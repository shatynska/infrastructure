---
# The prod server was created with only a single SSH key and no root
# password (terraform/modules/server/main.tf's own comment: providing a
# key at creation means Hetzner never sets one) -- root is the only
# login this host has. Without this, Ansible defaults to the local
# operator's own username, which fails with "Permission denied".
ansible_user: root

# Non-secret prod configuration, mirroring
# terraform/environments/prod/terraform.tfvars's ssh_allowed_cidrs and
# web_allowed_cidrs exactly -- see ansible/roles/hardening/README.md for
# why these two are hand-kept in sync rather than generated from
# Terraform, and why that matters (they drifted once already: this
# project's UFW rules initially assumed web_allowed_cidrs was unset when
# it was actually already ["0.0.0.0/0"], which would have left the host
# firewall blocking traffic the cloud firewall already permitted).
hardening_ssh_allowed_cidrs:
  - "176.104.184.0/24"
hardening_web_allowed_cidrs:
  - "0.0.0.0/0"

# Per-application deploy public keys (add-per-app-deploy-keys). Safe to
# commit -- these are public keys, not secrets; only each private half is
# sensitive, and that never appears here (platform's lives in this
# repository's PLATFORM_DEPLOY_SSH_KEY Environment secret; commerce-ops's
# lives in that application's own repository's Environment secret, per
# tasks.md 2.2). `platform`'s entry is the same keypair that already
# authenticates prod today (tasks.md 2.1's "existing platform public key")
# -- restricting its authorized_keys entry to deploy-receive, rather than
# rotating it, is what lets the migration in design.md's Migration Plan
# proceed without needing a new secret on the platform-deploy.yml side.
deploy_apps:
  - name: platform
    public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKbTTA4VUQjmUt2+jOE3FxPahMc8i+bRvR6g8f+7/m9M deploy@platform"
  - name: commerce-ops
    public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIvqBXstDCjAlYAZ3i92iLanC+lDe44eNpS0UGa6N4jw commerce-ops-deploy"

# Operator identities allowed an unprivileged, interactive login on this
# host (add-ops-account). Safe to commit for the same reason deploy_apps's
# entries are: these are public keys, not secrets. Each private half is
# generated out-of-band on the operator's own workstation and never enters
# this repository.
#
# `state` is per-entry and defaults to `present`. To revoke an operator,
# set its `state` to `absent` and LEAVE THE ENTRY HERE until the next
# converge has removed the account -- deleting the entry outright is not
# revocation, it just stops the role from acting on it. See
# ansible/roles/ops_user/README.md.
#
# NOTE: `docker` group membership is root-equivalent by escalation, so this
# is not a boundary against the key holder -- it buys blast-radius
# containment against mistakes, attribution, and revocability. Read the
# role README before adding an entry.
ops_user_accounts:
  - name: ops-claude
    public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICc/YzvZTHHNETGGAy89vD7IpzTU3jDAphOeKD6q5Kiu ops-claude"

# ghcr_pull_username is not secret (it's the GitHub account the token
# below belongs to) and is committed in plain text. ghcr_pull_token is a
# genuine secret (a read:packages-scoped GHCR token, tasks.md 2.3:
# generated out-of-band) and is therefore Ansible-Vault-encrypted in place
# below, not plain text -- decrypting it requires the Vault password,
# which is not stored anywhere in this repository (per this project's
# Secrets convention).
# Subdirectories platform_data_volume creates on the mounted main-data
# volume for platform/docker-compose.yml's Prometheus and Grafana services
# to bind-mount (add-platform-monitoring). Owner/group match each image's
# own upstream default user, so no `user:` override is needed in the
# Compose service definitions: 65534/65534 is prom/prometheus's default
# ("nobody"); 472/472 is grafana/grafana's own documented default.
platform_data_volume_subdirs:
  - path: prometheus
    owner: "65534"
    group: "65534"
    mode: "0755"
  - path: grafana
    owner: "472"
    group: "472"
    mode: "0755"

