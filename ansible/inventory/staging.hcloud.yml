---
# Staging's inventory source. Identical to prod.hcloud.yml but for the
# credential it names -- read that file for why one source per environment,
# why the filename must end in `hcloud.yml`, and why the credential is not
# the plugin's bare HCLOUD_TOKEN fallback.
#
# Staging has a Hetzner project of its own (add-a-staging-environment), so
# this source reaches staging's project and nothing else, exactly as prod's
# reaches prod's.
plugin: hetzner.hcloud.hcloud

# Staging's read-only token, from ansible/.envrc. The same name the
# HCLOUD_TOKEN_STAGING *repository secret* carries, so the local variable and
# the CI secret do not have to be mentally translated between.
#
# Not to be confused with the HCLOUD_TOKEN that direnv exports inside
# terraform/stacks/staging/: that one is Terraform's, is staging's
# token under the name its provider reads, and is scoped to that directory.
api_token: "{{ lookup('ansible.builtin.env', 'HCLOUD_TOKEN_STAGING') }}"

# Identical to prod's block, and identical on purpose -- read that file for why
# the default is the public address, why CI selects `hostname`, why this is
# `compose:` rather than the plugin's own `connect_with:`, and why an
# unrecognised value fails rather than falling back.
strict: true
compose:
  ansible_host: >-
    {'public_ipv4': ansible_host, 'hostname': hcloud_name}[
      lookup('ansible.builtin.env', 'HCLOUD_CONNECT_WITH') | default('public_ipv4', true)
    ]

# `strict: true` above reaches `keyed_groups` as well as `compose`, and the key
# is left exactly as it was because that costs nothing. MEASURED rather than
# assumed, against the live API: with the label absent, a strict parse does not
# fail -- the host is simply not grouped, and is dropped from the plugin's own
# `hcloud` group too. Either way it is not in the environment group a play
# targets, which is what it was before, and the play's own guard refuses on an
# empty group with a diagnostic naming the environment.
keyed_groups:
  - key: hcloud_labels.environment
    separator: ""
