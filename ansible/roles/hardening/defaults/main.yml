---
# hardening_ssh_allowed_cidrs has no default — it must be supplied by the
# caller (e.g. group_vars), since there is no safe default source CIDR for
# SSH. That absence is enforced, not merely documented: tasks/main.yml's
# first task, "Fail loudly if the required SSH source CIDRs were not
# supplied", asserts it before any task changes the host. Keep the two in
# step — adding a default here would silently defeat that assertion.
#
# hardening_web_allowed_cidrs defaults closed: a safe default for
# this role in general, independent of what any particular environment's
# group_vars sets it to (see ansible/inventory/group_vars/<environment>.yml
# for each environment's actual value -- prod's is ["0.0.0.0/0"], staging's
# is [], and both are mirrors of that environment's own terraform.tfvars).
hardening_web_allowed_cidrs: []

# How stale a package index this role is willing to install from, in seconds.
#
# A BOUND, NOT A DISABLING. Every `apt` task below keeps `update_cache: true`:
# a task reaching an index older than this still refreshes, and one reaching a
# host with no record of a fetch at all still fetches, because staleness is
# measured from when the index was last fetched and an absent record reads as
# the epoch. What the bound removes is the SECOND and later fetch of one run --
# this role installs ufw and then fail2ban seconds apart, and without a bound
# the second re-downloads the whole index the first just fetched.
#
# An hour: a converge is minutes long, so one run fetches once, and two runs an
# hour apart do not share an index. On an already-configured host the question
# rarely arises -- `state: present` over an installed package consults no
# candidate -- and a converge is not what keeps a running host current; that is
# unattended upgrades.
#
# ON A LONG-LIVED HOST THIS MAY SAVE NOTHING, and an operator should hear that
# here rather than from a converge log. The module measures staleness from
# /var/lib/apt/periodic/update-success-stamp where it exists, preferring it
# over the lists directory -- and it never writes that stamp itself; apt's own
# 15update-stamp hook does, which `apt-daily` runs. So on a stock Ubuntu host
# every bounded task may re-read the same timestamp and fetch again, exactly as
# it does today. The direction is benign -- never a staler index -- and the
# saving this bound is measured against is the one in continuous integration,
# whose containers carry no such stamp.
# NOT for a task installing a pinned version, nor for one installing from a
# source the same run added: see ansible/roles/tailscale/tasks/main.yml, which
# is both and therefore declares no bound.
hardening_apt_cache_valid_time: 3600
