---
# Molecule scenario for the `hardening` role (UFW + fail2ban). Same
# convention as the `docker` role's scenario -- see its molecule.yml for
# the rationale shared across roles. Run via `molecule test` from
# ansible/roles/hardening/.
dependency:
  name: galaxy
  options:
    # This role is hand-written (no external role pinned for it, per
    # design.md), but its UFW tasks will plausibly need the
    # `community.general.ufw` module, which is not currently pinned in
    # ansible/requirements.yml -- see test-manifest.md's unresolved
    # project questions. This dependency step installs whatever *is*
    # pinned there so converge has it available once added.
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  # systemd is required: UFW and fail2ban are managed as services, and
  # fail2ban-client/ufw status both expect a running init system.
  # Instance name namespaced per working tree, with a default Docker refuses,
  # and an explicit `hostname` because the driver would otherwise derive one
  # from the name and cross the 64-byte limit. See
  # ansible/roles/docker/molecule/default/molecule.yml for the full account --
  # every scenario must agree on the variable.
  - name: hardening-role-instance-${INFRA_WORKTREE_NS:-unset:run-via-ansible/scripts/run-molecule}
    hostname: hardening-role
    # Digest-pinned. See ansible/roles/docker/molecule/default/molecule.yml for
    # why a digest and not a version tag, and for how to refresh it -- every
    # scenario must carry the same one.
    # The apt staleness bound hardening and image_prune declare depends on
    # THIS image's recorded apt-fetch time being older than that bound. As
    # pinned, it is: no update-success-stamp, no 15update-stamp hook, and
    # /var/lib/apt/lists empty with a build-date mtime, so the first install of
    # a converge fetches and later ones reuse. Observed against this digest on
    # 2026-09-11; see the change cache-the-apt-index-within-a-converge,
    # design.md Decision 1. A pin bumped to a freshly built image would make
    # the bound inert and the failure would name a package, not the pin.
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:0172e3b586fc316491b5ac080e6b24c5f66cde985c27c625025f13f66a8cd21f
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    # See ansible/roles/docker/molecule/default/molecule.yml for why this
    # is needed -- same reasoning, applies to every role's scenario.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../

verifier:
  name: ansible
