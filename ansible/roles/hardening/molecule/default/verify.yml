---
# Verifies iac-host-configuration's existing "Host-Level Security Owned by
# Ansible, Cloud Firewall Owned by Terraform" requirement as this change
# implements it for the first time (tasks.md 2.1/2.2): a default-deny UFW
# posture with SSH always allowed and HTTP/HTTPS gated behind a variable,
# plus fail2ban. The "Host firewall rules are Ansible-managed" scenario is
# specified; the fail2ban assertions are derived from the requirement's own
# normative text ("Ansible SHALL own host-level security controls: the host
# firewall, intrusion prevention...") rather than from a dedicated scenario
# naming fail2ban specifically -- see test-manifest.md.
- name: Verify
  hosts: all
  become: true
  tasks:
    # --- UFW: default-deny + SSH allowed (today's actual deployed state) ---
    - name: Get current UFW status
      ansible.builtin.command: ufw status verbose
      register: hardening_ufw_status
      changed_when: false

    - name: Assert UFW is active
      ansible.builtin.assert:
        that:
          - "'Status: active' in hardening_ufw_status.stdout"
        fail_msg: "UFW is not active after the hardening role converged"

    - name: Assert UFW's default incoming policy is deny
      ansible.builtin.assert:
        that:
          - "'Default: deny (incoming)' in hardening_ufw_status.stdout"
        fail_msg: "UFW's default incoming policy is not deny -- host firewall rules are not managed as a default-deny posture"

    - name: Assert SSH (22) is allowed from the configured CIDR
      ansible.builtin.assert:
        that:
          - "'22' in hardening_ufw_status.stdout"
          - "'203.0.113.0/24' in hardening_ufw_status.stdout"
        fail_msg: "UFW does not allow SSH from hardening_ssh_allowed_cidrs"

    - name: Assert SSH (22) is allowed from the tailnet CGNAT range
      ansible.builtin.assert:
        that:
          - "'22' in hardening_ufw_status.stdout"
          - "'100.64.0.0/10' in hardening_ufw_status.stdout"
        fail_msg: "UFW does not allow SSH from the tailnet CGNAT range (100.64.0.0/10)"

    - name: Assert Grafana (3000) is allowed from the tailnet CGNAT range
      ansible.builtin.assert:
        that:
          - "'3000' in hardening_ufw_status.stdout"
          - "'100.64.0.0/10' in hardening_ufw_status.stdout"
        fail_msg: "UFW does not allow Grafana (3000) from the tailnet CGNAT range (100.64.0.0/10) -- add-grafana-tailnet-ufw-rule"

    - name: Assert HTTP/HTTPS are NOT open while hardening_web_allowed_cidrs is unset (today's real state)
      ansible.builtin.assert:
        that:
          - "'80/tcp' not in hardening_ufw_status.stdout"
          - "'443/tcp' not in hardening_ufw_status.stdout"
        fail_msg: >-
          Port 80/tcp or 443/tcp is allowed even though
          hardening_web_allowed_cidrs was left unset -- per design.md's
          Non-Goals, HTTP/HTTPS SHALL default to closed until the
          corresponding Terraform web_allowed_cidrs change lands.

    # --- fail2ban (derived from the requirement's "intrusion prevention" clause) ---
    - name: Check the fail2ban.service unit state
      ansible.builtin.systemd:
        name: fail2ban
      register: hardening_fail2ban_service

    - name: Assert fail2ban is active
      ansible.builtin.assert:
        that:
          - hardening_fail2ban_service.status.ActiveState == "active"
        fail_msg: "fail2ban is not active after the hardening role converged"

    - name: Get fail2ban jail status
      ansible.builtin.command: fail2ban-client status
      register: hardening_fail2ban_status
      changed_when: false

    - name: Assert a sane default SSH jail is enabled
      ansible.builtin.assert:
        that:
          - "'sshd' in hardening_fail2ban_status.stdout"
        fail_msg: "fail2ban has no sshd jail enabled (tasks.md 2.2's 'sane default jail for SSH')"

    # ----------------------------------------------------------------------
    # The apt-index staleness bound: "An index older than the bound is
    # refreshed" (change `cache-the-apt-index-within-a-converge`)
    # ----------------------------------------------------------------------
    # Derived from that change's delta specification before any implementation
    # of it existed. Its two sibling scenarios are established in converge.yml,
    # beside the role run they characterise; this one characterises an
    # invocation the test itself makes, so it sits here.
    #
    # WHY IT REUSES THE ROLE INVOCATION BELOW rather than adding one to the
    # converge play. Molecule runs converge TWICE and the bound is a single
    # variable per role, so a bound-overridden invocation there would make both
    # apt tasks fetch on both passes -- four fetches, in the very scenario every
    # figure in the change's design.md is computed from. This play runs once,
    # after the idempotence pass, and already carries a third role invocation
    # for the web-CIDR path. Reusing it costs one fetch and touches neither the
    # idempotence check nor converge.yml's header claim.
    #
    # WHY THE INDEX IS BACK-DATED RATHER THAN THE BOUND OVERRIDDEN. The include
    # below is not `public:`, so the role's bound variable is not in scope for a
    # task placed ahead of it and the back-date distance has to be a literal.
    # The consequence is stated rather than discovered: this catches an ABSURD
    # default -- one longer than the distance below -- and not a merely wrong
    # one. Nothing here guards the bound's value.
    #
    # WHY EMPTY-THEN-BACK-DATE, IN THAT ORDER. `cache_updated` is true only
    # where the mtime the apt module reads MOVED across the update, so:
    #   * The success stamp is the wrong path to touch. The module PREFERS it
    #     when it exists and python-apt's cache.update() never writes it, so
    #     back-dating it would pin the read value in the past and every later
    #     task would report cache_updated false however much it fetched.
    #   * Back-dating the lists directory WITHOUT emptying it is not enough: a
    #     re-fetch may resolve entirely to "not modified", write nothing, and
    #     leave the mtime where this fixture put it.
    #   * Emptying sets the directory's mtime to NOW, so the back-dating must
    #     come after it, never before.
    # The directory itself and its partial/ subdirectory must survive: apt fails
    # with "E: List directory /var/lib/apt/lists/partial is missing", which
    # names apt rather than this fixture.
    #
    # This task reports `changed`, which is harmless: Molecule's idempotence
    # check re-runs converge.yml alone and never reads this file.
    - name: Confirm the apt lists directory exists before the fixture back-dates it
      ansible.builtin.stat:
        path: /var/lib/apt/lists
      register: hardening_apt_lists_fixture

    - name: Assert the fixture has the directory it is about to back-date
      ansible.builtin.assert:
        that:
          - hardening_apt_lists_fixture.stat.exists
          - hardening_apt_lists_fixture.stat.isdir
        fail_msg: >-
          /var/lib/apt/lists is absent, so the back-dating below would establish
          nothing and the assertion after it would pass or fail for a reason
          that has nothing to do with the bound.

    - name: Find everything inside the apt lists directory
      ansible.builtin.find:
        paths: /var/lib/apt/lists
        patterns:
          - "*"
          - ".*"
        file_type: any
        hidden: true
        recurse: false
      register: hardening_apt_list_entries

    - name: Empty the apt lists directory, leaving the directory itself in place
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ hardening_apt_list_entries.files }}"
      loop_control:
        label: "{{ item.path }}"

    # `_apt:root 0700` is what the distribution ships, and it is not cosmetic:
    # apt drops privileges to `_apt` to download, and on any other ownership it
    # warns "Can't drop privileges for downloading as file
    # '/var/lib/apt/lists/partial/' couldn't be accessed by user '_apt'" and
    # falls back to root. The fetch still happens and the assertion below still
    # holds -- but the warning lands in the one run someone debugging this
    # fixture would be reading, pointing at apt rather than at the fixture.
    - name: Restore the partial/ subdirectory apt refuses to run without
      ansible.builtin.file:
        path: /var/lib/apt/lists/partial
        state: directory
        owner: _apt
        group: root
        mode: "0700"

    - name: Back-date the apt lists directory to well outside any plausible bound
      ansible.builtin.file:
        path: /var/lib/apt/lists
        state: directory
        owner: root
        group: root
        mode: "0755"
        modification_time: "197001020000.00"
        access_time: preserve

    # --- Re-converge with hardening_web_allowed_cidrs set, to exercise the
    #     web-enabled path. This is a second role invocation inside verify,
    #     not converge, so it is never seen by Molecule's idempotence check.
    - name: Re-apply the hardening role with HTTP/HTTPS CIDRs set
      ansible.builtin.include_role:
        name: hardening
      vars:
        hardening_ssh_allowed_cidrs:
          - "203.0.113.0/24"
        hardening_web_allowed_cidrs:
          - "198.51.100.0/24"


    # SPECIFIED -- scenario "An index older than the bound is refreshed". This
    # is what makes the bound a bound rather than a disabling: an
    # implementation that simply stopped fetching would satisfy every other
    # assertion this change adds.
    #
    # A register set by a task inside an included role is a play variable and
    # reaches the tasks after the include, which is why this reads
    # `hardening_ufw_install` without the include being `public:` -- `public`
    # governs the role's vars and defaults, not its registers.
    - name: Assert the first bounded apt task refreshed an index older than the bound
      ansible.builtin.assert:
        that:
          - hardening_ufw_install is defined
          - "'cache_updated' in hardening_ufw_install"
          - hardening_ufw_install.cache_updated | bool
        fail_msg: >-
          The role's first bounded apt task reported cache_updated
          {{ hardening_ufw_install.cache_updated | default('ABSENT') }} against
          an index back-dated to 1970. A bound is a bound on staleness, not a
          switch: a task reaching an index older than it SHALL still fetch. Read
          this together with converge.yml's assertions -- if those pass and this
          one fails, the change removed the refresh instead of bounding it. If
          it fails because `hardening_ufw_install` is undefined, the role's
          first apt task is not registered under that name; if it fails with the
          index apparently fresh, check that the fixture above emptied
          /var/lib/apt/lists BEFORE back-dating it, since deleting its contents
          sets its mtime to now.
        success_msg: >-
          A bounded apt task reaching an index older than its bound fetched the
          index before installing.
    - name: Get UFW status after enabling web CIDRs
      ansible.builtin.command: ufw status verbose
      register: hardening_ufw_status_web_enabled
      changed_when: false

    - name: Assert HTTP/HTTPS are allowed once hardening_web_allowed_cidrs is set
      ansible.builtin.assert:
        that:
          - "'80/tcp' in hardening_ufw_status_web_enabled.stdout"
          - "'443/tcp' in hardening_ufw_status_web_enabled.stdout"
          - "'198.51.100.0/24' in hardening_ufw_status_web_enabled.stdout"
        fail_msg: "UFW did not open 80/443 for the configured CIDR once hardening_web_allowed_cidrs was set"

    - name: Assert the SSH rule is still present and unaffected by the web-CIDR change
      ansible.builtin.assert:
        that:
          - "'22' in hardening_ufw_status_web_enabled.stdout"
          - "'203.0.113.0/24' in hardening_ufw_status_web_enabled.stdout"
        fail_msg: "SSH access rule was lost or changed when hardening_web_allowed_cidrs was set"
