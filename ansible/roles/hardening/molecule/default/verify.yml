---
# Verifies iac-host-configuration's existing "Host-Level Security Owned by
# Ansible, Cloud Firewall Owned by Terraform" requirement as this change
# implements it for the first time (tasks.md 2.1/2.2): a default-deny UFW
# posture with SSH always allowed and HTTP/HTTPS gated behind a variable,
# plus fail2ban. The "Host firewall rules are Ansible-managed" scenario is
# specified; the fail2ban assertions are derived from the requirement's own
# normative text ("Ansible SHALL own host-level security controls: the host
# firewall, intrusion prevention...") rather than from a dedicated scenario
# naming fail2ban specifically -- see test-manifest.md.
- name: Verify
  hosts: all
  become: true
  tasks:
    # --- UFW: default-deny + SSH allowed (today's actual deployed state) ---
    - name: Get current UFW status
      ansible.builtin.command: ufw status verbose
      register: hardening_ufw_status
      changed_when: false

    - name: Assert UFW is active
      ansible.builtin.assert:
        that:
          - "'Status: active' in hardening_ufw_status.stdout"
        fail_msg: "UFW is not active after the hardening role converged"

    - name: Assert UFW's default incoming policy is deny
      ansible.builtin.assert:
        that:
          - "'Default: deny (incoming)' in hardening_ufw_status.stdout"
        fail_msg: "UFW's default incoming policy is not deny -- host firewall rules are not managed as a default-deny posture"

    - name: Assert SSH (22) is allowed from the configured CIDR
      ansible.builtin.assert:
        that:
          - "'22' in hardening_ufw_status.stdout"
          - "'203.0.113.0/24' in hardening_ufw_status.stdout"
        fail_msg: "UFW does not allow SSH from hardening_ssh_allowed_cidrs"

    - name: Assert HTTP/HTTPS are NOT open while hardening_web_allowed_cidrs is unset (today's real state)
      ansible.builtin.assert:
        that:
          - "'80/tcp' not in hardening_ufw_status.stdout"
          - "'443/tcp' not in hardening_ufw_status.stdout"
        fail_msg: >-
          Port 80/tcp or 443/tcp is allowed even though
          hardening_web_allowed_cidrs was left unset -- per design.md's
          Non-Goals, HTTP/HTTPS SHALL default to closed until the
          corresponding Terraform web_allowed_cidrs change lands.

    # --- fail2ban (derived from the requirement's "intrusion prevention" clause) ---
    - name: Check the fail2ban.service unit state
      ansible.builtin.systemd:
        name: fail2ban
      register: hardening_fail2ban_service

    - name: Assert fail2ban is active
      ansible.builtin.assert:
        that:
          - hardening_fail2ban_service.status.ActiveState == "active"
        fail_msg: "fail2ban is not active after the hardening role converged"

    - name: Get fail2ban jail status
      ansible.builtin.command: fail2ban-client status
      register: hardening_fail2ban_status
      changed_when: false

    - name: Assert a sane default SSH jail is enabled
      ansible.builtin.assert:
        that:
          - "'sshd' in hardening_fail2ban_status.stdout"
        fail_msg: "fail2ban has no sshd jail enabled (tasks.md 2.2's 'sane default jail for SSH')"

    # --- Re-converge with hardening_web_allowed_cidrs set, to exercise the
    #     web-enabled path. This is a second role invocation inside verify,
    #     not converge, so it is never seen by Molecule's idempotence check.
    - name: Re-apply the hardening role with HTTP/HTTPS CIDRs set
      ansible.builtin.include_role:
        name: hardening
      vars:
        hardening_ssh_allowed_cidrs:
          - "203.0.113.0/24"
        hardening_web_allowed_cidrs:
          - "198.51.100.0/24"

    - name: Get UFW status after enabling web CIDRs
      ansible.builtin.command: ufw status verbose
      register: hardening_ufw_status_web_enabled
      changed_when: false

    - name: Assert HTTP/HTTPS are allowed once hardening_web_allowed_cidrs is set
      ansible.builtin.assert:
        that:
          - "'80/tcp' in hardening_ufw_status_web_enabled.stdout"
          - "'443/tcp' in hardening_ufw_status_web_enabled.stdout"
          - "'198.51.100.0/24' in hardening_ufw_status_web_enabled.stdout"
        fail_msg: "UFW did not open 80/443 for the configured CIDR once hardening_web_allowed_cidrs was set"

    - name: Assert the SSH rule is still present and unaffected by the web-CIDR change
      ansible.builtin.assert:
        that:
          - "'22' in hardening_ufw_status_web_enabled.stdout"
          - "'203.0.113.0/24' in hardening_ufw_status_web_enabled.stdout"
        fail_msg: "SSH access rule was lost or changed when hardening_web_allowed_cidrs was set"
