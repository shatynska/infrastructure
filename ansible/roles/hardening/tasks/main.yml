---
# Host-level UFW + fail2ban, per iac-host-configuration's "Host-Level
# Security Owned by Ansible, Cloud Firewall Owned by Terraform"
# requirement. UFW's allowed ports SHALL mirror what the Hetzner cloud
# firewall (terraform/modules/server's hcloud_firewall) already allows --
# see this role's README for the sync obligation between the two.

- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH (22) from the configured CIDRs
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ hardening_ssh_allowed_cidrs }}"

- name: Allow HTTP (80) from the configured web CIDRs
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ hardening_web_allowed_cidrs }}"

- name: Allow HTTPS (443) from the configured web CIDRs
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ hardening_web_allowed_cidrs }}"


# Additive to the public-interface SSH rule above, not a replacement for
# it -- see connect-platform-deploy-via-tailscale's design.md for why
# this is needed (UFW's default-deny-incoming policy applies to the
# tailscale0 interface too, not just the public one) and why it's safe
# (100.64.0.0/10 is the tailnet's CGNAT range, not publicly routable;
# only authenticated tailnet peers can present it as a source).
- name: Allow SSH (22) from the tailnet CGNAT range
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "100.64.0.0/10"

# Same rationale as the SSH-tailnet rule above: Grafana (added by
# add-platform-monitoring) binds to the host's tailnet-literal IP and is
# meant to be reachable only from tailnet peers, but UFW's default-deny-
# incoming policy applies to the tailscale0 interface too, so it needs its
# own explicit allow rule here as well.
- name: Allow Grafana (3000) from the tailnet CGNAT range
  community.general.ufw:
    rule: allow
    port: "3000"
    proto: tcp
    src: "100.64.0.0/10"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Ensure fail2ban is installed
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Enable the sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
