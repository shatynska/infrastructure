---
# Molecule scenario for iac-host-configuration's MODIFIED "Platform Data
# Volume Is Mounted at a Fixed Host Path" requirement
# (openspec/specs/iac-host-configuration/spec.md), covering three of the four
# scenarios the change `move-the-platform-data-mount` adds to it:
#
#   "A superseded mount path is declared"
#   "No superseded mount path is declared"
#   "A running service still holds the superseded path"
#
# The fourth -- "A path is declared superseded and is also the path in force"
# -- is the sibling `superseded-path-in-force-refused` scenario, and the split
# is deliberate rather than a divergence from that change's tasks.md 3.2, which
# frames all four as limbs of one scenario. Its own wording is why: the refusal
# SHALL happen "before the mount is established", and a host this scenario has
# already converged has its mount established, so that limb could only ever be
# observed here against a host in the wrong state. See this change's
# test-plan.md, which records the split and the reason.
#
# Written BEFORE the implementation exists, from the delta specification alone:
# `ansible/roles/platform_data_volume/` has no
# `platform_data_volume_superseded_mount_paths` input and no retirement task at
# the time this scenario was authored. It is expected to be RED until that
# lands. See this change's test-plan.md for the scenario-to-test mapping, the
# recorded baseline, and the per-assertion specified/derived classification.
#
# WHY THIS NEEDS A SCENARIO OF ITS OWN
# -----------------------------------
# `default` converges a host that has never carried a superseded path, so it
# can establish nothing about retiring one, and its premise is a clean first
# converge. The fixture here is the opposite premise: a host already carrying
# the superseded path in `/etc/fstab`, already mounted there, and with a
# process holding it. Folding that into `default` would change what a red run
# there means.
#
# WHY test_sequence IS NOT OVERRIDDEN
# ----------------------------------
# The default sequence's `idempotence` action is load-bearing here rather than
# incidental: it re-runs `converge.yml` against a host whose superseded entry
# the first converge already removed, which IS the delta's "No superseded mount
# path is declared" scenario in its second form -- "one whose superseded paths
# have already been retired". Under this change's Decision 3 the inventory
# keeps the declaration indefinitely, so that is the state every converge after
# the first is in. `prepare.yml` is not re-run for `idempotence`, which is what
# makes this work: the fixture establishes the superseded state exactly once.
dependency:
  name: galaxy
  options:
    # ansible.posix is pinned at 1.6.2 in requirements.yml, and its `mount`
    # module's `absent_from_fstab` state is what this change's Decision 1
    # selects. No new pin is expected; the dependency step still runs so the
    # pinned set is present before converge.
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  # Distinct instance name from every sibling scenario of this role: two
  # scenarios of one role sharing an instance name collide on `create`.
  # Namespaced per working tree, with a default Docker refuses, and an explicit
  # short `hostname` because the driver would otherwise derive one from the
  # instance name and cross the 64-byte limit. See
  # ansible/roles/docker/molecule/default/molecule.yml for the full account --
  # every scenario must agree on the variable.
  - name: platform-data-volume-retire-instance-${INFRA_WORKTREE_NS:-unset:run-via-ansible/scripts/run-molecule}
    hostname: platform-data-volume-retire
    # Digest-pinned, and the SAME digest every other scenario in this
    # repository names -- iac-cicd-pipeline requires it and
    # .github/tests/test_ci_configuration.py asserts it. See
    # ansible/roles/docker/molecule/default/molecule.yml for why a digest and
    # for how to refresh it.
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:0172e3b586fc316491b5ac080e6b24c5f66cde985c27c625025f13f66a8cd21f
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    # See ansible/roles/docker/molecule/default/molecule.yml -- same reasoning,
    # applies to every role's scenario.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../

verifier:
  name: ansible
