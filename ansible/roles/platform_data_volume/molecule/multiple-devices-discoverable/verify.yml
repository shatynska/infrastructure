---
# Verifies which of the two candidate devices the role's discovery selected.
#
# Provenance of each assertion (full classification in
# fix-volume-discovery-and-consistency's test-plan.md):
#
#   both candidates are present   DERIVED. No scenario states it; it exists
#                                 so this file cannot pass vacuously against
#                                 a fixture that only ever produced one
#                                 device, in which case "discovery matched
#                                 more than one" -- the scenario's WHEN --
#                                 was never true.
#   the fixture achieved the      DERIVED. The stronger non-vacuity guard,
#   directory-read order it       and the one that matters: if the entry a
#   intended                      directory read returns first happens to BE
#                                 the lexicographic winner, then `files[0]`
#                                 and a sorted selection agree, and the
#                                 assertion below passes against an unsorted
#                                 role. This was not hypothetical -- the
#                                 first draft of this fixture created the
#                                 links in the order that produced exactly
#                                 that, and passed against the unfixed role.
#   the mount resolves to the     SPECIFIED, as the operative reading of
#   lexicographically-first       "the device selected SHALL be the same on
#   candidate                     every run ... rather than depending on the
#                                 order the discovery happened to return
#                                 them in". The spec fixes determinism, not
#                                 which particular device; sorting is
#                                 design.md Decision 2's chosen rule, so the
#                                 CHOICE of "lexicographically first" is
#                                 DERIVED from that decision. A different
#                                 deterministic rule would be a spec-legal
#                                 implementation this assertion would have
#                                 to be re-pointed at, not weakened.
#   the mount is NOT the other    SPECIFIED, and the half that
#   candidate                     discriminates. Stated as its own limb so a
#                                 failure names which device was chosen
#                                 instead.
- name: Verify
  hosts: all
  become: true
  vars:
    platform_data_volume_mount_path: /mnt/main-data
    # Redeclared here because a verify playbook inherits nothing from
    # prepare or converge -- same reasoning as `default`'s verify.yml
    # redeclaring its device and mount path.
    platform_data_volume_expected_link: /dev/disk/by-id/scsi-0HC_Volume_100000001
    platform_data_volume_other_link: /dev/disk/by-id/scsi-0HC_Volume_200000002
    platform_data_volume_fixture_reverse_order: >-
      {{ lookup('env', 'MOLECULE_MULTI_DEVICE_REVERSE_ORDER') | lower in ['1', 'true', 'yes', 'on'] }}
  tasks:
    - name: Stat both candidate by-id links
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ platform_data_volume_expected_link }}"
        - "{{ platform_data_volume_other_link }}"
      register: platform_data_volume_candidate_stats

    - name: Assert the host really did present more than one candidate device
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
        fail_msg: >-
          {{ item.item }} is not present as a symlink on the instance, so
          on-host discovery did not match more than one candidate device and
          the scenario's precondition never held. Everything below would
          then pass having established nothing about how a multi-device host
          is resolved -- this assertion exists to make that visible rather
          than silent.
        quiet: true
      loop: "{{ platform_data_volume_candidate_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Deliberately the SAME module, path and pattern the role's own discovery
    # task uses, so this observes the order the role itself sees rather than
    # a re-derivation of it.
    - name: Read the by-id directory in the order the role's own discovery returns it
      ansible.builtin.find:
        paths: /dev/disk/by-id
        patterns: scsi-0HC_Volume_*
        file_type: any
      register: platform_data_volume_readdir_order

    - name: Assert the fixture achieved the directory-read order it intended
      vars:
        readdir_first: "{{ platform_data_volume_readdir_order.files | map(attribute='path') | first | default('') }}"
      ansible.builtin.assert:
        that:
          - platform_data_volume_readdir_order.files | length == 2
          - >-
            (readdir_first == platform_data_volume_expected_link)
            if platform_data_volume_fixture_reverse_order
            else (readdir_first != platform_data_volume_expected_link)
        fail_msg: >-
          The directory read returned '{{ readdir_first }}' first, which is
          not the arrangement this fixture intended
          (MOLECULE_MULTI_DEVICE_REVERSE_ORDER is
          {{ platform_data_volume_fixture_reverse_order }}). In the default
          arrangement the first entry must NOT be
          {{ platform_data_volume_expected_link }}: if it were, an unsorted
          `files[0]` would agree with a sorted selection and the assertion
          below would pass against the very implementation this scenario
          exists to reject. Readdir order is a property of the kernel and
          filesystem, measured rather than contracted -- this assertion is
          what turns a change in it into a visible failure instead of a
          scenario that silently stops discriminating.
        success_msg: >-
          The directory read returns the candidates in the intended order, so
          the selection assertion below discriminates a sorted selection from
          `files[0]`.
        quiet: true

    - name: Read the live mount table entry for the fixed mount path
      ansible.builtin.command: >-
        findmnt --noheadings --output SOURCE
        {{ platform_data_volume_mount_path }}
      register: platform_data_volume_multi_findmnt
      changed_when: false
      failed_when: false

    - name: Assert the data volume is mounted at all
      ansible.builtin.assert:
        that:
          - platform_data_volume_multi_findmnt.rc == 0
          - platform_data_volume_multi_findmnt.stdout | trim | length > 0
        fail_msg: >-
          Nothing is mounted at {{ platform_data_volume_mount_path }}
          (findmnt rc {{ platform_data_volume_multi_findmnt.rc }}). The role
          converged against a host with two discoverable candidate devices
          and mounted neither.
        quiet: true

    - name: Resolve each candidate link to the device node it points at
      ansible.builtin.command: readlink -f {{ item }}
      changed_when: false
      loop:
        - "{{ platform_data_volume_expected_link }}"
        - "{{ platform_data_volume_other_link }}"
      register: platform_data_volume_resolved_candidates

    - name: Assert the selected device is the lexicographically-first candidate, not the one a directory read returns first
      vars:
        selected: "{{ platform_data_volume_multi_findmnt.stdout | trim }}"
        expected: "{{ platform_data_volume_resolved_candidates.results[0].stdout | trim }}"
        other: "{{ platform_data_volume_resolved_candidates.results[1].stdout | trim }}"
      ansible.builtin.assert:
        that:
          - selected == expected
          - selected != other
        fail_msg: >-
          {{ platform_data_volume_mount_path }} is mounted from
          '{{ selected }}', but a deterministic selection over the two
          candidates ({{ platform_data_volume_expected_link }} ->
          {{ expected }}, {{ platform_data_volume_other_link }} ->
          {{ other }}) must yield '{{ expected }}'. The fixture arranges the
          links so that the lexicographic winner is NOT the entry the
          directory read returns first, so this is exactly the difference
          between a sorted selection and `files[0]`: the latter picks
          whichever entry the directory read happened to hand back, which is
          what the requirement forbids.
        success_msg: >-
          The mount resolves to the lexicographically-first candidate, not to
          the one the directory read returned first.
        quiet: true
