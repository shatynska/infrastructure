---
# Molecule scenario for iac-host-configuration's MODIFIED "Platform Data
# Volume Is Mounted at a Fixed Host Path" requirement
# (openspec/specs/iac-host-configuration/spec.md), scenario "A path is declared
# superseded and is also the path in force", as the change
# `move-the-platform-data-mount` adds it.
#
# Written BEFORE the implementation exists, from the delta specification alone.
# See this change's test-plan.md for the scenario-to-test mapping, the recorded
# baseline, and the per-assertion specified/derived classification.
#
# WHY THIS NEEDS A SCENARIO OF ITS OWN, SEPARATE FROM `superseded-path-retired`
# ---------------------------------------------------------------------------
# That change's tasks.md 3.2 frames this as the fourth limb of one scenario.
# Its own wording is why it is not: the run SHALL fail "before any task that
# changes the host has run", and that is only observable against a host NOTHING
# HAS YET CHANGED. `superseded-path-retired` converges the role to completion
# before it could reach this case, so a refusal there would be indistinguishable
# from one arriving after the mount was established -- which is precisely the
# ordering this scenario exists to pin down. On a host that has never converged,
# the fixed path's directory does not exist, the fixture's device carries no
# filesystem, and /etc/fstab names neither path; each of those is a check that
# an assert placed AFTER the mount task would fail.
#
# WHY `idempotence` AND `side_effect` ARE OMITTED FROM test_sequence
# -----------------------------------------------------------------
# Stated explicitly rather than inherited silently, following
# `no-device-discoverable/molecule.yml`. This converge deliberately aborts the
# role at its declaration check, twice, so no task after it ever runs and role
# idempotence is not a property this scenario can observe. It is covered by
# `default` and, for the retirement specifically, by `superseded-path-retired`.
# `side_effect` is omitted because this scenario has no side_effect.yml.
# `prepare` is kept in the sequence and this scenario does have a prepare.yml.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  # Distinct instance name from every sibling scenario of this role: two
  # scenarios of one role sharing an instance name collide on `create`.
  # Namespaced per working tree, with a default Docker refuses, and an explicit
  # short `hostname` because the driver would otherwise derive one from the
  # instance name and cross the 64-byte limit. See
  # ansible/roles/docker/molecule/default/molecule.yml for the full account --
  # every scenario must agree on the variable.
  - name: platform-data-volume-refusal-instance-${INFRA_WORKTREE_NS:-unset:run-via-ansible/scripts/run-molecule}
    hostname: platform-data-volume-refusal
    # Digest-pinned, and the SAME digest every other scenario in this
    # repository names -- iac-cicd-pipeline requires it and
    # .github/tests/test_ci_configuration.py asserts it. See
    # ansible/roles/docker/molecule/default/molecule.yml for why a digest and
    # for how to refresh it.
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:0172e3b586fc316491b5ac080e6b24c5f66cde985c27c625025f13f66a8cd21f
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    # See ansible/roles/docker/molecule/default/molecule.yml -- same reasoning,
    # applies to every role's scenario.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
