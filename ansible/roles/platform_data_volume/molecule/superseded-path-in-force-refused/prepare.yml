---
# FIXTURE ONLY -- nothing here is the subject of any assertion, and nothing
# here may set up the thing under test. It supplies ONE thing: a block device
# for the role to be pointed at, so that the run this scenario observes fails
# on the declaration it is about rather than on the device check that precedes
# it.
#
# THE DEVICE IS LEFT UNFORMATTED, DELIBERATELY, and it is an assertion's
# subject rather than a convenience. The role's own filesystem task is the
# FIRST task that changes the host, so a device still carrying no filesystem
# after the run is direct evidence that the refusal came before it. A fixture
# that formatted the device would give that assertion away, and an assert
# misplaced after the mount task would then pass this scenario.
#
# /dev/loop91: 87, 88 and 89 are taken by the sibling scenarios of this role
# and 90 by `superseded-path-retired`. `molecule/default/prepare.yml` records
# in full why the minor number is hardcoded rather than taken from
# `losetup -f --show`, and why a CI host that already holds it is a FIXTURE
# flake rather than a defect in the role.
- name: Prepare
  hosts: all
  become: true
  vars:
    platform_data_volume_device: /dev/loop91
    platform_data_volume_backing_file: /root/platform-data-volume-refusal-backing.img
  tasks:
    - name: Refresh the apt cache and install fixture-only loop/filesystem tooling
      ansible.builtin.apt:
        name:
          - util-linux
          - e2fsprogs
        state: present
        update_cache: true
        cache_valid_time: 0

    - name: Create a sparse backing file to stand in for the attached Hetzner Volume
      ansible.builtin.command: truncate -s 512M {{ platform_data_volume_backing_file }}
      args:
        creates: "{{ platform_data_volume_backing_file }}"

    - name: Check whether the fixed loop device node already exists
      ansible.builtin.stat:
        path: "{{ platform_data_volume_device }}"
      register: platform_data_volume_loop_node

    - name: Create the fixed loop device node (major 7 = loop) if it does not already exist
      ansible.builtin.command: mknod -m 0660 {{ platform_data_volume_device }} b 7 91
      when: not platform_data_volume_loop_node.stat.exists
      changed_when: true

    # DETACH FIRST, UNCONDITIONALLY. A loop device minor is a kernel-global
    # handle: it is NOT namespaced by the container, so an association made
    # inside a Molecule container outlives that container and is still there
    # on the next run -- `losetup -a` on the host shows it, naming a backing
    # file inside a container that no longer exists.
    #
    # Associating only "if not already associated" therefore inherits whatever
    # a previous run left on this minor, including a filesystem a previous
    # run's converge created. That is not hypothetical: it is what this
    # scenario met, and it made "no filesystem was created on the device"
    # fail against contamination rather than against the role. `docs/change-
    # queue.md` carries the entry for the wider problem -- every scenario of
    # this role leaks its minor the same way.
    - name: Detach the fixed loop device, whatever a previous run left on it
      ansible.builtin.command: losetup -d {{ platform_data_volume_device }}
      register: platform_data_volume_loop_detach
      changed_when: platform_data_volume_loop_detach.rc == 0
      failed_when: false

    - name: Associate this run's own backing file with the fixed loop device
      ansible.builtin.command: >-
        losetup {{ platform_data_volume_device }} {{ platform_data_volume_backing_file }}
      changed_when: true

    - name: Assert the fixture's device starts with no filesystem on it
      ansible.builtin.command: blkid {{ platform_data_volume_device }}
      register: platform_data_volume_loop_blkid
      changed_when: false
      failed_when: platform_data_volume_loop_blkid.rc == 0
      # The premise this scenario's own assertions rest on. Checked here rather
      # than assumed, because the way it fails -- a stale kernel association --
      # is invisible from inside the container and makes a later assertion read
      # as an implementation defect.
