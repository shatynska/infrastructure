---
# Mounts the platform's dedicated data volume (the Terraform-provisioned
# `main-data` Hetzner Volume) at a fixed host path, formats it if needed,
# persists the mount across reboot, and creates the subdirectories
# monitoring's containers bind-mount into — iac-host-configuration's ADDED
# "Platform Data Volume Is Mounted at a Fixed Host Path" requirement
# (openspec/specs/iac-host-configuration/spec.md, from add-platform-monitoring).
#
# Scope stops at the mount and its filesystem layout: this role never
# templates or starts a platform/ service, consistent with the existing
# "Configuration Scope Stops at the Container Runtime" requirement.

- name: Discover the attached data volume's device path, if not explicitly set
  ansible.builtin.find:
    paths: /dev/disk/by-id
    # Hetzner's stable, documented naming for an attached Volume — see
    # design.md's "The volume's device path is discovered on-host" decision
    # for why this is preferred over hand-copying Terraform's `linux_device`
    # output into inventory.
    patterns: "scsi-0HC_Volume_*"
    file_type: any
  register: platform_data_volume_by_id
  when: platform_data_volume_device | length == 0

- name: Resolve the discovered device path
  ansible.builtin.set_fact:
    # Sorted, not `files[0]`: `find` returns directory-read order and
    # guarantees none. With one volume attached the two agree, so the
    # difference is invisible until a second one is -- at which point an
    # unsorted pick is nondeterministic and silent. Sorting makes the
    # selection the same on every run against the same set of devices.
    platform_data_volume_device: "{{ platform_data_volume_by_id.files | map(attribute='path') | sort | first }}"
  when:
    - platform_data_volume_device | length == 0
    # Guards the indexing above. Without it, an empty `find` result reaches
    # `files | first` and the play aborts on a Jinja error BEFORE the assert
    # below -- the assert written to diagnose precisely that case, which is
    # what a host sees with volume_enabled false or a volume still
    # attaching. The empty case must fall through to it instead.
    #
    # `| default([])` is load-bearing because the register can be WHOLLY
    # UNDEFINED, not merely missing its `files` key: a run that excludes the
    # discovery task by --tags/--skip-tags never registers it at all. It
    # also covers the ordinary skipped case, where the caller supplied a
    # device and the register holds no `files`.
    - platform_data_volume_by_id.files | default([]) | length > 0

- name: Fail loudly if no device path is available (neither supplied nor discoverable)
  ansible.builtin.assert:
    that:
      - platform_data_volume_device | length > 0
    fail_msg: >-
      No platform_data_volume_device was supplied and no
      /dev/disk/by-id/scsi-0HC_Volume_* device was found on this host. Is the
      main-data Hetzner Volume actually attached (volume_enabled in
      terraform/environments/<environment>/terraform.tfvars, for the
      environment this run targets)?

- name: Format the data volume, if it has no filesystem yet
  community.general.filesystem:
    dev: "{{ platform_data_volume_device }}"
    fstype: "{{ platform_data_volume_fs_type }}"
  # community.general.filesystem is itself idempotent (it checks the
  # existing filesystem type via blkid before acting) — this is not a
  # first-attach-only guard, just documenting why no separate "already
  # formatted?" check precedes it.

- name: Ensure the fixed mount path exists
  ansible.builtin.file:
    path: "{{ platform_data_volume_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount the data volume at the fixed path and persist it in /etc/fstab
  ansible.posix.mount:
    path: "{{ platform_data_volume_mount_path }}"
    src: "{{ platform_data_volume_device }}"
    fstype: "{{ platform_data_volume_fs_type }}"
    state: mounted

- name: Create the dependent subdirectories on the mounted volume, with per-service ownership
  ansible.builtin.file:
    path: "{{ platform_data_volume_mount_path }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ platform_data_volume_subdirs }}"
  loop_control:
    label: "{{ item.path }}"
  # Runs after the mount task above, not before: a subdirectory created
  # before the volume is mounted would be shadowed by the mount rather than
  # be what a container's bind-mount actually reads from.
