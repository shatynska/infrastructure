---
# Verifies the ADDED "Restricted Deploy Account Supports Per-Application
# Forced-Command Deploys" (7 scenarios) and "Host Authenticates to GHCR
# for Application Image Pulls" (2 scenarios) requirements
# (openspec/changes/add-per-app-deploy-keys/specs/iac-host-configuration/
# spec.md). Each block is labeled with the scenario it covers. See
# test-manifest.md for the full scenario-accounting table, including which
# parts of some scenarios are proxy coverage or deliberately left to
# tasks.md's Rollout section's live/manual verification instead of
# Molecule.
#
# Three tasks near the end of this file (denial of raw `docker`/arbitrary
# `sudo` access, and the private-key-marker scan) are carried forward from
# the old, now-replaced `default` scenario's verify.yml -- their normative
# content is not superseded by this change (test-manifest.md's "Obsolete
# tests": flagged as "not superseded", not dropped) and remains true under
# the new per-application model, so they were kept rather than lost when
# that scenario's converge/verify (which assumed the retired single-key
# interface) were replaced by this one.
- name: Verify
  hosts: all
  become: true
  tasks:
    # ============================================================
    # Setup: build the two test archives `deploy-receive` will be fed.
    # Piped directly at the script (as `deploy`), not over an actual `ssh`
    # session -- the SSH-layer forced-command binding itself is verified
    # separately below as a static `authorized_keys` content check, per
    # tasks.md 3.2's own framing ("exercising deploy-receive directly").
    # ============================================================
    - name: Build a valid deploy archive (docker-compose.yml + .env only) for commerce-ops
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p /tmp/deploy_user_valid_archive
        printf 'services:\n  noop:\n    image: alpine:3.19\n    command: ["sleep", "3600"]\n' > /tmp/deploy_user_valid_archive/docker-compose.yml
        printf 'FOO=bar\n' > /tmp/deploy_user_valid_archive/.env
        tar -czf /tmp/deploy_user_valid_archive.tar.gz -C /tmp/deploy_user_valid_archive docker-compose.yml .env
      args:
        executable: /bin/bash
      changed_when: false

    - name: Build a decoy-bearing deploy archive (docker-compose.yml + .env + an unexpected member) for platform
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p /tmp/deploy_user_decoy_archive
        printf 'services:\n  noop:\n    image: alpine:3.19\n    command: ["sleep", "3600"]\n' > /tmp/deploy_user_decoy_archive/docker-compose.yml
        printf 'FOO=bar\n' > /tmp/deploy_user_decoy_archive/.env
        printf 'echo pwned\n' > /tmp/deploy_user_decoy_archive/evil.sh
        tar -czf /tmp/deploy_user_decoy_archive.tar.gz -C /tmp/deploy_user_decoy_archive docker-compose.yml .env evil.sh
      args:
        executable: /bin/bash
      changed_when: false

    # ============================================================
    # Scenario: A single SSH session delivers content and triggers deploy
    # ============================================================
    - name: Pipe the valid archive into deploy-receive commerce-ops, as deploy, non-interactively
      ansible.builtin.shell: set -o pipefail; cat /tmp/deploy_user_valid_archive.tar.gz | /usr/local/bin/deploy-receive commerce-ops
      args:
        executable: /bin/bash
      become: true
      become_user: deploy
      register: deploy_user_per_app_valid_pipe
      changed_when: false
      failed_when: false

    - name: Assert the pipe was not rejected by sudo (the deploy trigger was permitted, not blocked at the authorization layer)
      ansible.builtin.assert:
        that:
          - "'password is required' not in deploy_user_per_app_valid_pipe.stderr"
          - "'not allowed' not in deploy_user_per_app_valid_pipe.stderr"
        fail_msg: >-
          deploy-receive's own `sudo app-deploy commerce-ops` trigger was
          denied by sudo ({{ deploy_user_per_app_valid_pipe.stderr }}) --
          the sudoers rule for commerce-ops does not actually grant it.

    - name: Assert deploy-receive's full pipeline (extract, permission, trigger) succeeded end to end
      ansible.builtin.assert:
        that:
          - deploy_user_per_app_valid_pipe.rc == 0
        fail_msg: >-
          deploy-receive exited non-zero ({{ deploy_user_per_app_valid_pipe.rc }}) for
          a single-session pipe of a valid archive. Because this converge
          installs Docker and the test Compose file declares one small
          service on a public base image, `docker compose pull && docker
          compose up -d --wait` inside app-deploy is a real, fast success
          when the whole chain (extraction, permissions, sudo escalation,
          trigger) actually works -- a non-zero rc here means some step in
          that one-session chain did not complete, not merely that
          Docker/GHCR content was unavailable.

    - name: Confirm commerce-ops's docker-compose.yml and .env landed under /opt/commerce-ops
      ansible.builtin.stat:
        path: "/opt/commerce-ops/{{ item }}"
      loop:
        - docker-compose.yml
        - .env
      register: deploy_user_commerce_ops_extracted_files

    - name: Assert both expected members were extracted
      ansible.builtin.assert:
        that:
          - deploy_user_commerce_ops_extracted_files.results[0].stat.exists
          - deploy_user_commerce_ops_extracted_files.results[1].stat.exists
        fail_msg: "docker-compose.yml and/or .env were not extracted into /opt/commerce-ops by the single-session pipe"

    - name: Assert the extracted .env has restrictive permissions (tasks.md 1.3 -- chmod 600)
      ansible.builtin.assert:
        that:
          - deploy_user_commerce_ops_extracted_files.results[1].stat.mode == "0600"
        fail_msg: >-
          /opt/commerce-ops/.env is mode
          {{ deploy_user_commerce_ops_extracted_files.results[1].stat.mode }},
          not 0600 -- deploy-receive SHALL set restrictive permissions on
          the extracted .env

    # ============================================================
    # Scenario: Archive members outside the expected set are ignored
    # ============================================================
    - name: Pipe the decoy-bearing archive into deploy-receive platform, as deploy, non-interactively
      ansible.builtin.shell: set -o pipefail; cat /tmp/deploy_user_decoy_archive.tar.gz | /usr/local/bin/deploy-receive platform
      args:
        executable: /bin/bash
      become: true
      become_user: deploy
      register: deploy_user_per_app_decoy_pipe
      changed_when: false
      failed_when: false

    - name: Confirm whether the decoy member was extracted alongside the real members
      ansible.builtin.stat:
        path: "/opt/platform/{{ item }}"
      loop:
        - docker-compose.yml
        - .env
        - evil.sh
      register: deploy_user_platform_decoy_check

    - name: Assert the two real members were extracted and the decoy member was not, regardless of its name
      ansible.builtin.assert:
        that:
          - deploy_user_platform_decoy_check.results[0].stat.exists
          - deploy_user_platform_decoy_check.results[1].stat.exists
          - not deploy_user_platform_decoy_check.results[2].stat.exists
        fail_msg: >-
          Either a real member (docker-compose.yml/.env) failed to extract,
          or the decoy member (evil.sh) was extracted when it SHALL NOT
          have been -- deploy-receive SHALL extract only the two named
          members, regardless of what else the archive contains.

    # ============================================================
    # Scenario: An application's key can only ever deploy that application
    # Scenario: A leaked key cannot be used to pivot into the host's network
    # Scenario: Platform deploys through the same mechanism as every other
    #           application (authorized_keys half)
    #
    # The actual channel-forwarding-refusal half of "leaked key cannot
    # pivot" is live OpenSSH `restrict` enforcement, not this role's own
    # logic, and is verified live against a real SSH client/session by
    # tasks.md 5.4's Rollout step -- not reproduced here (see
    # test-manifest.md). This static content check is the proxy: it
    # confirms the `restrict` option this enforcement depends on is
    # actually present per key, and that each key's forced command is
    # bound to that key's own, and only its own, application name -- which
    # is the entirety of what this role's own tasks control.
    # ============================================================
    - name: Read deploy's authorized_keys
      ansible.builtin.slurp:
        src: /opt/platform/.ssh/authorized_keys
      register: deploy_user_per_app_authorized_keys_file

    - name: Assert each key's line carries restrict,command= bound to its own application name only
      vars:
        authorized_keys_content: "{{ deploy_user_per_app_authorized_keys_file.content | b64decode }}"
        platform_line: "{{ authorized_keys_content.split('\n') | select('search', 'platform-molecule@ci') | list | first | default('') }}"
        commerce_ops_line: "{{ authorized_keys_content.split('\n') | select('search', 'commerce-ops-molecule@ci') | list | first | default('') }}"
      ansible.builtin.assert:
        that:
          - platform_line != ""
          - "'restrict' in platform_line"
          - "'command=\"/usr/local/bin/deploy-receive platform\"' in platform_line"
          - "'commerce-ops' not in platform_line"
          - commerce_ops_line != ""
          - "'restrict' in commerce_ops_line"
          - "'command=\"/usr/local/bin/deploy-receive commerce-ops\"' in commerce_ops_line"
        fail_msg: >-
          authorized_keys does not carry a restrict,command=... entry
          binding each key to exactly its own application name -- either
          `restrict` is missing (leaked-key forwarding not closed), the
          forced command is missing/wrong (an application's key would not
          deploy only that application), or one key's line references the
          other application's name (cross-key contamination). platform
          line: '{{ platform_line }}'; commerce-ops line:
          '{{ commerce_ops_line }}'

    # ============================================================
    # Scenario: An unenumerated application name is rejected
    # ============================================================
    - name: Attempt sudo app-deploy for an application with no sudoers.d entry, as deploy, non-interactively
      ansible.builtin.command: sudo -n /usr/local/bin/app-deploy nonexistent-app
      become: true
      become_user: deploy
      register: deploy_user_per_app_unenumerated_attempt
      changed_when: false
      failed_when: false

    - name: Assert sudo refuses the unenumerated application name
      ansible.builtin.assert:
        that:
          - deploy_user_per_app_unenumerated_attempt.rc != 0
          - "'password is required' in deploy_user_per_app_unenumerated_attempt.stderr or 'not allowed' in deploy_user_per_app_unenumerated_attempt.stderr"
        fail_msg: "sudo permitted app-deploy for an application name with no matching sudoers.d entry"

    # ============================================================
    # Scenario: New applications are onboarded without a new account
    # ============================================================
    - name: Confirm /opt/<name> for both platform and commerce-ops (tasks.md 1.1)
      ansible.builtin.stat:
        path: "/opt/{{ item }}"
      loop:
        - platform
        - commerce-ops
      register: deploy_user_per_app_opt_dirs

    - name: Assert each /opt/<name> directory is owned deploy:deploy, mode 0750
      ansible.builtin.assert:
        that:
          - deploy_user_per_app_opt_dirs.results[0].stat.exists
          - deploy_user_per_app_opt_dirs.results[0].stat.pw_name == "deploy"
          - deploy_user_per_app_opt_dirs.results[0].stat.gr_name == "deploy"
          - deploy_user_per_app_opt_dirs.results[0].stat.mode == "0750"
          - deploy_user_per_app_opt_dirs.results[1].stat.exists
          - deploy_user_per_app_opt_dirs.results[1].stat.pw_name == "deploy"
          - deploy_user_per_app_opt_dirs.results[1].stat.gr_name == "deploy"
          - deploy_user_per_app_opt_dirs.results[1].stat.mode == "0750"
        fail_msg: "/opt/platform and/or /opt/commerce-ops is missing, or not owned deploy:deploy mode 0750"

    - name: Read each application's sudoers.d entry, /etc/sudoers.d/app-deploy-<name> per tasks.md 1.4
      ansible.builtin.slurp:
        src: "/etc/sudoers.d/app-deploy-{{ item }}"
      loop:
        - platform
        - commerce-ops
      register: deploy_user_per_app_sudoers_files

    - name: Assert each sudoers.d entry is the exact, fully-qualified, wildcard-free line for that application
      vars:
        platform_sudoers: "{{ deploy_user_per_app_sudoers_files.results[0].content | b64decode }}"
        commerce_ops_sudoers: "{{ deploy_user_per_app_sudoers_files.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'deploy ALL=(root) NOPASSWD: /usr/local/bin/app-deploy platform' in platform_sudoers"
          - "'*' not in platform_sudoers"
          - "'deploy ALL=(root) NOPASSWD: /usr/local/bin/app-deploy commerce-ops' in commerce_ops_sudoers"
          - "'*' not in commerce_ops_sudoers"
        fail_msg: >-
          A sudoers.d entry is not an exact match on its own application's
          app-deploy invocation with no wildcard -- either the exact line
          is missing or a wildcard/argument-forwarding form was used.

    - name: Validate each sudoers.d entry with visudo (derived -- tasks.md 3.1)
      ansible.builtin.command: "visudo -cf /etc/sudoers.d/app-deploy-{{ item }}"
      loop:
        - platform
        - commerce-ops
      register: deploy_user_per_app_visudo_check
      changed_when: false

    - name: Assert exactly one `deploy` system account exists -- no per-application account was created
      ansible.builtin.command: getent passwd
      register: deploy_user_per_app_passwd
      changed_when: false

    - name: Assert onboarding commerce-ops required no new Unix account, home directory, or sudoers structure
      vars:
        passwd_lines: "{{ deploy_user_per_app_passwd.stdout_lines }}"
        deploy_account_lines: "{{ passwd_lines | select('match', '^deploy:') | list }}"
      ansible.builtin.assert:
        that:
          - deploy_account_lines | length == 1
          - "'deploy-commerce-ops:' not in deploy_user_per_app_passwd.stdout"
          - "'deploy-platform:' not in deploy_user_per_app_passwd.stdout"
        fail_msg: >-
          Expected exactly one `deploy` account and none named after a
          specific application -- onboarding commerce-ops SHALL require
          only a new keypair, authorized_keys line, sudoers.d entry, and
          /opt/<app_name> directory, not a new Unix account.

    # ============================================================
    # Scenario: Platform deploys through the same mechanism as every other
    # application
    #
    # converge.yml's pre_tasks seed a pre-migration
    # platform-compose-deploy script and /etc/sudoers.d/deploy entry
    # before the role runs -- simulating an already-provisioned host that
    # still carries them (design.md's Migration Plan: present-but-
    # unreachable until tasks.md 5.6's cleanup). This exercises the role's
    # absent tasks actually removing something, not merely confirming a
    # fresh host never had it.
    # ============================================================
    - name: Assert the retired platform-compose-deploy script does not exist after convergence
      ansible.builtin.stat:
        path: /usr/local/bin/platform-compose-deploy
      register: deploy_user_per_app_old_wrapper_stat

    - name: Assert the seeded platform-specific script was removed by this role's tasks (tasks.md 5.6)
      ansible.builtin.assert:
        that:
          - not deploy_user_per_app_old_wrapper_stat.stat.exists
        fail_msg: >-
          /usr/local/bin/platform-compose-deploy still exists after
          convergence, even though converge.yml seeded it beforehand --
          platform SHALL deploy through the same generic
          app-deploy/deploy-receive mechanism as every other application,
          with no separate platform-specific script, and this role's
          tasks SHALL remove a pre-migration leftover (tasks.md 5.6).

    - name: Assert the seeded pre-migration sudoers entry was removed by this role's tasks (tasks.md 5.6)
      ansible.builtin.stat:
        path: /etc/sudoers.d/deploy
      register: deploy_user_per_app_old_sudoers_stat

    - name: Assert /etc/sudoers.d/deploy does not exist after convergence
      ansible.builtin.assert:
        that:
          - not deploy_user_per_app_old_sudoers_stat.stat.exists
        fail_msg: >-
          /etc/sudoers.d/deploy still exists after convergence, even
          though converge.yml seeded it beforehand -- this role's tasks
          SHALL remove the pre-migration sudoers entry (tasks.md 5.6).

    - name: Assert the generic app-deploy script exists (root:root, mode 0755 -- tasks.md 1.2)
      ansible.builtin.stat:
        path: /usr/local/bin/app-deploy
      register: deploy_user_per_app_app_deploy_stat

    - name: Assert app-deploy is root-owned, mode 0755
      ansible.builtin.assert:
        that:
          - deploy_user_per_app_app_deploy_stat.stat.exists
          - deploy_user_per_app_app_deploy_stat.stat.pw_name == "root"
          - deploy_user_per_app_app_deploy_stat.stat.gr_name == "root"
          - deploy_user_per_app_app_deploy_stat.stat.mode == "0755"
        fail_msg: "/usr/local/bin/app-deploy is missing or not root:root mode 0755"

    - name: Assert deploy-receive exists (deploy:deploy, mode 0755 -- tasks.md 1.3)
      ansible.builtin.stat:
        path: /usr/local/bin/deploy-receive
      register: deploy_user_per_app_deploy_receive_stat

    - name: Assert deploy-receive is deploy-owned, mode 0755
      ansible.builtin.assert:
        that:
          - deploy_user_per_app_deploy_receive_stat.stat.exists
          - deploy_user_per_app_deploy_receive_stat.stat.pw_name == "deploy"
          - deploy_user_per_app_deploy_receive_stat.stat.gr_name == "deploy"
          - deploy_user_per_app_deploy_receive_stat.stat.mode == "0755"
        fail_msg: "/usr/local/bin/deploy-receive is missing or not deploy:deploy mode 0755"

    # ============================================================
    # Scenario: A private GHCR package can be pulled during deploy
    #
    # DELIBERATELY conditional / best-effort. A real pull-success proof
    # needs a real private GHCR package and a real, valid, non-placeholder
    # read:packages token -- neither of which this pass can safely commit
    # (a real token is a credential; a fake one legitimately fails
    # authentication, which would not be a defect in the role). tasks.md
    # 5.5 assigns the actual pull-success proof to a manual Rollout step
    # against real infrastructure. This structural check only runs when
    # MOLECULE_GHCR_PULL_TOKEN is supplied at test-run time (e.g. a CI
    # secret); otherwise it is skipped, not silently passed. See
    # test-manifest.md's unresolved-questions section.
    # ============================================================
    - name: Report whether the live GHCR credential-store check will run
      ansible.builtin.debug:
        msg: >-
          {{ 'Running the GHCR credential-store check against a real supplied token.'
          if (lookup('env', 'MOLECULE_GHCR_PULL_TOKEN') | default('', true)) != ''
          else 'MOLECULE_GHCR_PULL_TOKEN not set -- skipping the GHCR
          credential-store check (see test-manifest.md); the actual
          pull-success scenario is verified operationally per tasks.md 5.5,
          not by this Molecule scenario.' }}

    - name: Read root's Docker credential store (only when a real token was supplied)
      ansible.builtin.slurp:
        src: /root/.docker/config.json
      register: deploy_user_per_app_docker_config
      when:
        - (lookup('env', 'MOLECULE_GHCR_PULL_TOKEN') | default('', true)) != ''
        - (lookup('env', 'MOLECULE_GHCR_PULL_USERNAME') | default('', true)) != ''
      ignore_errors: true

    - name: Assert root's Docker credential store contains a ghcr.io entry (only when a real token was supplied)
      vars:
        docker_config_content: "{{ deploy_user_per_app_docker_config.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'ghcr.io' in docker_config_content"
        fail_msg: >-
          /root/.docker/config.json does not contain a ghcr.io entry after
          convergence, even though a real GHCR pull token was supplied via
          MOLECULE_GHCR_PULL_TOKEN.
      when:
        - (lookup('env', 'MOLECULE_GHCR_PULL_TOKEN') | default('', true)) != ''
        - (lookup('env', 'MOLECULE_GHCR_PULL_USERNAME') | default('', true)) != ''

    # ============================================================
    # Scenario: GHCR token is never committed
    #
    # Not host-state to converge against (the token only ever reaches the
    # host as a decrypted Vault value, per tasks.md 2.3) -- checked as a
    # static scan of the committed repository, delegated to localhost,
    # same technique as the private-key-marker scan further below.
    # ============================================================
    - name: Scan the repository for literal GitHub/GHCR token markers
      ansible.builtin.shell: |
        set -o pipefail
        grep -rlE "gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}" "{{ playbook_dir }}/../../../../.." || true
      args:
        executable: /bin/bash
      register: deploy_user_per_app_ghcr_token_marker_scan
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Assert no literal GitHub/GHCR token is committed anywhere in the repository
      ansible.builtin.assert:
        that:
          - deploy_user_per_app_ghcr_token_marker_scan.stdout | trim == ""
        fail_msg: >-
          A GitHub/GHCR token-shaped marker was found committed in:
          {{ deploy_user_per_app_ghcr_token_marker_scan.stdout }} -- the GHCR
          pull token SHALL be stored outside version control and SHALL NOT
          appear in plaintext anywhere in the repository.

    # Tests the VALUE of each assignment, wherever the file lives, rather
    # than the file as a whole. The old form ran `head -c 15 | grep
    # '^$ANSIBLE_VAULT'` -- a whole-file encryption test -- which flagged
    # ansible/inventory/group_vars/prod.yml, whose token is an INLINE
    # `!vault` value inside an otherwise plaintext file. That is this
    # project's documented and correct pattern, so the scan was reporting a
    # false positive on a correct tree, and also flagged the scenario
    # converge files that read the value from the environment.
    #
    # Excluding those files by path would have been simpler and is
    # deliberately not done: it would blind the scan permanently in exactly
    # the files most likely to acquire a pasted real token, since running
    # the credentialled verification means having a live token at the
    # keyboard while editing them. An assignment is acceptable if its value
    # is an inline `!vault` value or a `lookup('env', ...)` expression;
    # anything else is a literal and fails.
    # (openspec/changes/repair-ansible-test-harness, task 6.2.)
    - name: Find any ghcr_pull_token assignment whose value is a committed literal
      ansible.builtin.shell: |
        set -o pipefail
        python3 - "{{ playbook_dir }}/../../../../.." <<'SCAN'
        import pathlib, re, sys

        # A line-oriented grep cannot do this correctly: both scenario
        # converge files assign the token as a YAML FOLDED scalar, so the
        # assignment line is just `ghcr_pull_token: >-` and the lookup that
        # makes it acceptable sits on the following lines. Reading the
        # assignment together with its continuation is the whole point.
        root = pathlib.Path(sys.argv[1]).resolve()
        assign = re.compile(r"^([ \t]*)ghcr_pull_token[ \t]*:(.*)$")
        offenders = []

        for path in sorted(root.rglob("*.y*ml")):
            if ".git" in path.parts:
                continue
            lines = path.read_text(errors="ignore").splitlines()
            for i, line in enumerate(lines):
                m = assign.match(line)
                if not m:
                    continue
                indent, value = len(m.group(1)), m.group(2)
                # Absorb the folded/block continuation: any following line
                # indented deeper than the assignment itself.
                for cont in lines[i + 1:]:
                    if cont.strip() and (len(cont) - len(cont.lstrip())) <= indent:
                        break
                    value += " " + cont.strip()
                if not value.strip():
                    continue
                if "!vault" in value or "lookup('env'" in value or 'lookup("env"' in value:
                    continue
                offenders.append(f"{path.relative_to(root)}:{i + 1}")

        print("\n".join(offenders))
        SCAN
      args:
        executable: /bin/bash
      register: deploy_user_per_app_ghcr_token_plaintext_scan
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Assert no ghcr_pull_token assignment carries a committed literal value
      ansible.builtin.assert:
        that:
          - deploy_user_per_app_ghcr_token_plaintext_scan.stdout | trim == ""
        fail_msg: >-
          ghcr_pull_token is assigned a value outside an Ansible-Vault-
          encrypted file in: {{ deploy_user_per_app_ghcr_token_plaintext_scan.stdout }}
          -- per the GHCR requirement, it SHALL be stored outside version
          control (Ansible Vault), not merely referenced without a
          committed default.

    # ============================================================
    # Carried forward from the old `default` scenario (test-manifest.md's
    # "Obsolete tests": flagged "not directly superseded" / "likely not
    # superseded"). Not required by either of this change's own scenarios,
    # but still true under the new per-application model -- `deploy`'s only
    # privileged capability is the named app-deploy sudoers rules, no raw
    # docker access or arbitrary-command escalation is granted, and no
    # private-key material is committed under this role.
    # ============================================================
    - name: Attempt sudo docker directly as deploy, non-interactively
      ansible.builtin.command: sudo -n docker ps
      become: true
      become_user: deploy
      register: deploy_user_docker_direct_attempt
      changed_when: false
      failed_when: false

    - name: Assert deploy cannot invoke docker directly with elevated privilege
      ansible.builtin.assert:
        that:
          - deploy_user_docker_direct_attempt.rc != 0
        fail_msg: "deploy was able to run `sudo docker` directly -- only the named app-deploy invocations SHALL be privileged options"

    - name: Attempt an arbitrary privileged command (sudo whoami) as deploy, non-interactively
      ansible.builtin.command: sudo -n whoami
      become: true
      become_user: deploy
      register: deploy_user_whoami_attempt
      changed_when: false
      failed_when: false

    - name: Assert deploy cannot run an arbitrary privileged command
      ansible.builtin.assert:
        that:
          - deploy_user_whoami_attempt.rc != 0
          - "'root' not in deploy_user_whoami_attempt.stdout"
        fail_msg: "deploy was able to run an arbitrary privileged command (sudo whoami) -- only the named app-deploy invocations SHALL be privileged options"

    # The search pattern is assembled from two halves at run time, and that
    # is load-bearing rather than stylistic: a scan whose pattern is spelled
    # out literally matches THIS FILE, because this file necessarily
    # contains the string it searches for and the scan's target directory
    # contains the scan. Written out, it fails on its own text and reports
    # verify.yml as committed key material -- a false positive no
    # implementation can clear. Splitting the delimiter means the assembled
    # regex appears nowhere in the file, while still matching every real key:
    # an OpenSSH, RSA or PKCS#8 private key opens with exactly that line.
    # (openspec/changes/repair-ansible-test-harness, task 6.1.)
    - name: Scan this role's committed files for embedded private-key material
      ansible.builtin.shell: |
        set -o pipefail
        head='-----BEGIN'
        tail='PRIVATE KEY-----'
        grep -rlE -- "${head} (OPENSSH |RSA )?${tail}" "{{ playbook_dir }}/../.." || true
      args:
        executable: /bin/bash
      register: deploy_user_committed_private_key_scan
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Assert no private-key marker is committed anywhere under the deploy_user role
      ansible.builtin.assert:
        that:
          - deploy_user_committed_private_key_scan.stdout | trim == ""
        fail_msg: >-
          A private-key marker was found under the deploy_user role's
          committed files: {{ deploy_user_committed_private_key_scan.stdout }} -- every
          application's keypair's private half SHALL be stored outside
          version control (Ansible Vault or a GitHub Actions Environment
          secret, per tasks.md 2.2) and SHALL NOT appear in plaintext in
          the repository.

    # ================================================================
    # ADDED requirement: "Superseded Application Images Are Reclaimed at
    # Deploy Time" -- openspec/changes/reclaim-superseded-app-images/
    # specs/iac-host-configuration/spec.md, 11 scenarios.
    #
    # Derived from that delta spec ahead of the implementation, per
    # tasks.md section 2. THESE TASKS FAIL UNTIL tasks.md section 1 IS
    # IMPLEMENTED, and that is the intended state: nothing in app-deploy
    # reclaims anything today.
    #
    # openspec/changes/reclaim-superseded-app-images/test-plan.md carries
    # the scenario-accounting table, the two scenarios (plus one half of a
    # third) deliberately left uncovered and why, and every assertion's
    # specified/derived classification. Read it before changing anything
    # below -- several fixtures look gratuitously specific and are not.
    #
    # ORDERING IS LOAD-BEARING (tasks.md 2.8). Reclamation runs on EVERY
    # deploy, the first included, so an in-namespace fixture standing
    # before the deploy meant to observe it is a candidate for an EARLIER
    # deploy, and its scenario then passes for the wrong reason -- the
    # image having been reclaimed by a deploy the scenario is not about.
    # Each in-namespace fixture is therefore built immediately before the
    # deploy that must observe it, and the whole block runs after the
    # commerce-ops deploy above, which is where alpine:3.19 actually
    # enters the instance (lines 35 and 46 only write its name into a
    # Compose file).
    #
    # Fixtures are built with `docker build`, never `docker tag`: tagging
    # yields ONE image ID wearing several tags, which makes `docker image
    # rm` untag instead of remove -- the wrong-reason pass tasks.md 2.1
    # and 2.4 each name for themselves. `docker tag` is used exactly once
    # below, for the out-of-namespace base-image decoy, where a shared
    # image ID is the point. No fixture points at a real GHCR package;
    # `reclaim-fixture` and `reclaim-fixture-previous-owner` are owner
    # segments that exist nowhere, and every fixture service carries
    # `pull_policy: never` so `docker compose pull` stays a real success
    # against a locally-built image.
    #
    # DELIBERATELY NOT COVERED HERE (tasks.md 2.7 and 2.9), recorded so
    # the absence of a test is distinguishable from the absence of the
    # thought:
    #
    #   * "An untagged image in the namespace is left alone". The fixture
    #     it needs is an in-namespace image carrying no tag, which arises
    #     only from a repo digest -- a real pull from a registry, which
    #     tasks.md 2.8 forbids on determinism grounds. "Tag then untag"
    #     does NOT substitute: it yields <none>:<none>, a fully dangling
    #     image, which is the proposal's first non-goal and outside every
    #     namespace by construction, so a test built that way would prove
    #     the wrong property while reading as though it proved this one.
    #     Held instead by the `:<none>` filter being visible in the
    #     script (tasks.md 1.5) and by review. Accepted on the operator's
    #     decision, 2026-09-07, against adding a digest-pinned local
    #     registry:2 to this scenario. REVISIT IF ANY APPLICATION EVER
    #     ADOPTS A DIGEST PIN.
    #
    #   * "A non-responding runtime does not hold the deploy open", and
    #     with it the duration-bound half of "A run that ends early says
    #     why". Wedging a container daemon inside a Molecule container is
    #     not reproducible without breaking the same daemon the preceding
    #     `docker compose pull` needs. Held by the `timeout` being
    #     visible in the script (tasks.md 1.8) and by review.
    # ================================================================

    - name: Reclaim fixture -- build image A, the tag the first of the two deploys runs
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/reclaim_build_fixture-tag-a
        mkdir -p /tmp/reclaim_build_fixture-tag-a
        printf 'FROM alpine:3.19\nRUN echo fixture-tag-a > /reclaim-fixture-marker\n' \
          > /tmp/reclaim_build_fixture-tag-a/Dockerfile
        docker build -t ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-a /tmp/reclaim_build_fixture-tag-a
      args:
        executable: /bin/bash
      # DOCKER_BUILDKIT=0 is not a preference. prepare.yml puts the nested
      # daemon on the vfs storage driver with containerd-snapshotter
      # disabled (the only configuration under which a container runs at
      # all inside this instance), and the classic builder is the one that
      # mounts anywhere. tasks.md 2.8 names this as the first thing to try
      # when a build fails; it is set up front rather than after a failure.
      environment:
        DOCKER_BUILDKIT: "0"
      changed_when: false

    - name: Reclaim fixture -- build the deploy archive referencing image A
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/reclaim_archive_tag_a
        mkdir -p /tmp/reclaim_archive_tag_a
        cat > /tmp/reclaim_archive_tag_a/docker-compose.yml <<'COMPOSE'
        services:
          app:
            image: ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-a
            pull_policy: never
            command: ["sleep", "3600"]
        COMPOSE
        printf 'FOO=bar\n' > /tmp/reclaim_archive_tag_a/.env
        tar -czf /tmp/reclaim_archive_tag_a.tar.gz -C /tmp/reclaim_archive_tag_a docker-compose.yml .env
      args:
        executable: /bin/bash
      changed_when: false

    - name: Reclaim -- deploy commerce-ops at fixture-tag-a (deploy 1 of 2, tasks.md 2.1)
      ansible.builtin.shell: set -o pipefail; cat /tmp/reclaim_archive_tag_a.tar.gz | /usr/local/bin/deploy-receive commerce-ops
      args:
        executable: /bin/bash
      become: true
      become_user: deploy
      register: deploy_user_reclaim_first_deploy
      changed_when: false
      failed_when: false

    - name: Assert the first fixture deploy succeeded (precondition, not a scenario assertion)
      ansible.builtin.assert:
        that:
          - deploy_user_reclaim_first_deploy.rc == 0
        fail_msg: >-
          The fixture deploy of commerce-ops at fixture-tag-a exited
          {{ deploy_user_reclaim_first_deploy.rc }}. Every reclamation
          assertion below rests on this deploy having succeeded, so this
          is a broken fixture rather than a defect in reclamation. stdout:
          {{ deploy_user_reclaim_first_deploy.stdout }} stderr:
          {{ deploy_user_reclaim_first_deploy.stderr }}

    # Built HERE, not alongside image A: all three live in the namespace
    # the deploy above clears, so building them earlier would hand deploy
    # 1 the previous-owner image and the stopped-container image as
    # candidates, and the previous-owner scenario would then pass for the
    # wrong reason (tasks.md 2.8). The stopped container is created in the
    # same task as its image, so that image is never unheld while a deploy
    # runs.
    - name: Reclaim fixture -- build image B, the previous-owner image and the stopped-container image
      ansible.builtin.shell: |
        set -euo pipefail
        build_fixture() {
          marker="$1"
          ref="$2"
          rm -rf "/tmp/reclaim_build_${marker}"
          mkdir -p "/tmp/reclaim_build_${marker}"
          printf 'FROM alpine:3.19\nRUN echo %s > /reclaim-fixture-marker\n' "${marker}" \
            > "/tmp/reclaim_build_${marker}/Dockerfile"
          docker build -t "${ref}" "/tmp/reclaim_build_${marker}"
        }
        build_fixture fixture-tag-b ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-b
        build_fixture fixture-legacy ghcr.io/reclaim-fixture-previous-owner/commerce-ops:fixture-legacy
        build_fixture fixture-held ghcr.io/reclaim-fixture/commerce-ops:fixture-held-by-stopped
        docker rm -f reclaim_stopped_holder >/dev/null 2>&1 || true
        docker run --name reclaim_stopped_holder \
          ghcr.io/reclaim-fixture/commerce-ops:fixture-held-by-stopped /bin/true
        docker tag alpine:3.19 alpine:reclaim-decoy
      args:
        executable: /bin/bash
      environment:
        DOCKER_BUILDKIT: "0"
      changed_when: false

    # Guards the two fixtures whose wrong-reason pass tasks.md 2.1 and 2.4
    # each call out. If A and B were one image ID with two tags, Docker
    # would untag rather than remove and both halves of the supersession
    # assertion would pass with no disk reclaimed; if the held image
    # carried a second tag, its removal would succeed by untagging and the
    # unforced-removal assertion would prove nothing.
    - name: Reclaim fixture self-check -- collect the fixture image IDs and the held image's tag count
      ansible.builtin.shell: |
        set -euo pipefail
        docker images -q ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-a
        docker images -q ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-b
        docker images -q ghcr.io/reclaim-fixture-previous-owner/commerce-ops:fixture-legacy
        docker images -q ghcr.io/reclaim-fixture/commerce-ops:fixture-held-by-stopped
        docker image inspect --format '{% raw %}{{len .RepoTags}}{% endraw %}' \
          ghcr.io/reclaim-fixture/commerce-ops:fixture-held-by-stopped
      args:
        executable: /bin/bash
      register: deploy_user_reclaim_fixture_selfcheck
      changed_when: false

    - name: Assert the four in-namespace fixtures are distinct images and the held one carries exactly one tag
      ansible.builtin.assert:
        that:
          - deploy_user_reclaim_fixture_selfcheck.stdout_lines | length == 5
          - deploy_user_reclaim_fixture_selfcheck.stdout_lines[0:4] | unique | length == 4
          - deploy_user_reclaim_fixture_selfcheck.stdout_lines[4] == "1"
        fail_msg: >-
          The fixture images are not what the assertions below assume.
          Either two of them share an image ID -- in which case
          `docker image rm` untags instead of removing and the
          supersession assertions pass without any disk being reclaimed --
          or the stopped-container image carries more than one tag, which
          makes its removal succeed by untagging and turns the
          unforced-removal assertion into a wrong-reason pass. Collected:
          {{ deploy_user_reclaim_fixture_selfcheck.stdout_lines }}

    - name: Reclaim fixture -- build the deploy archive referencing image B and the shared base image
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/reclaim_archive_tag_b
        mkdir -p /tmp/reclaim_archive_tag_b
        cat > /tmp/reclaim_archive_tag_b/docker-compose.yml <<'COMPOSE'
        services:
          app:
            image: ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-b
            pull_policy: never
            command: ["sleep", "3600"]
          base:
            image: alpine:3.19
            pull_policy: never
            command: ["sleep", "3600"]
        COMPOSE
        printf 'FOO=bar\n' > /tmp/reclaim_archive_tag_b/.env
        tar -czf /tmp/reclaim_archive_tag_b.tar.gz -C /tmp/reclaim_archive_tag_b docker-compose.yml .env
      args:
        executable: /bin/bash
      changed_when: false

    - name: Reclaim -- deploy commerce-ops at fixture-tag-b (deploy 2 of 2, the run every assertion below reads)
      ansible.builtin.shell: set -o pipefail; cat /tmp/reclaim_archive_tag_b.tar.gz | /usr/local/bin/deploy-receive commerce-ops
      args:
        executable: /bin/bash
      become: true
      become_user: deploy
      register: deploy_user_reclaim_second_deploy
      changed_when: false
      failed_when: false

    - name: Reclaim -- report what survived the second deploy
      ansible.builtin.shell: |
        set -euo pipefail
        for ref in \
          ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-a \
          ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-b \
          ghcr.io/reclaim-fixture-previous-owner/commerce-ops:fixture-legacy \
          ghcr.io/reclaim-fixture/commerce-ops:fixture-held-by-stopped \
          alpine:3.19 \
          alpine:reclaim-decoy; do
          if [ -n "$(docker images -q "$ref")" ]; then
            echo "PRESENT $ref"
          else
            echo "ABSENT $ref"
          fi
        done
        if [ -n "$(docker ps -q --filter ancestor=ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-b)" ]; then
          echo "RUNNING-ON fixture-tag-b"
        else
          echo "NOT-RUNNING-ON fixture-tag-b"
        fi
        if [ -n "$(docker ps -aq --filter name=reclaim_stopped_holder --filter status=exited)" ]; then
          echo "STOPPED-HOLDER present"
        else
          echo "STOPPED-HOLDER absent"
        fi
      args:
        executable: /bin/bash
      register: deploy_user_reclaim_after_second
      changed_when: false

    # ------------------------------------------------------------
    # Scenario: A deploy removes the image its predecessor left behind
    # ------------------------------------------------------------
    - name: Assert the superseded tag is gone after the second deploy and the deployed tag remains
      ansible.builtin.assert:
        that:
          - "'ABSENT ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-a' in deploy_user_reclaim_after_second.stdout_lines"
          - "'PRESENT ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-b' in deploy_user_reclaim_after_second.stdout_lines"
        fail_msg: >-
          After deploying commerce-ops at fixture-tag-b over a host that
          was running fixture-tag-a, the superseded tag SHALL no longer be
          present and the deployed tag SHALL be. Present/absent report:
          {{ deploy_user_reclaim_after_second.stdout_lines }} -- deploy
          output: {{ deploy_user_reclaim_second_deploy.stdout }}
          {{ deploy_user_reclaim_second_deploy.stderr }}

    # ------------------------------------------------------------
    # Scenario: The image the running containers use is never removed
    # ------------------------------------------------------------
    - name: Assert every image the current Compose file references survived and its containers are running
      ansible.builtin.assert:
        that:
          - "'PRESENT ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-b' in deploy_user_reclaim_after_second.stdout_lines"
          - "'PRESENT alpine:3.19' in deploy_user_reclaim_after_second.stdout_lines"
          - "'RUNNING-ON fixture-tag-b' in deploy_user_reclaim_after_second.stdout_lines"
        fail_msg: >-
          Reclamation removed an image the application's current Compose
          file references, or left its containers not running. Both
          referenced images (fixture-tag-b and the alpine:3.19 base) SHALL
          still be present and the application SHALL still be up.
          Present/absent report: {{ deploy_user_reclaim_after_second.stdout_lines }}

    # ------------------------------------------------------------
    # Scenario: An image held by a stopped container is not removed
    #
    # The assertion that catches a later `-f`. Without it the design's
    # only backstop against a defective reference set is unenforced
    # (tasks.md 2.4). The held image is in the namespace, is referenced by
    # no Compose service, and carries exactly one tag -- so the runtime's
    # refusal is the only thing that can keep it, and `-f` or
    # `image prune -a` would take it.
    # ------------------------------------------------------------
    - name: Assert the unreferenced image a stopped container holds was not removed, and the container still holds it
      ansible.builtin.assert:
        that:
          - "'PRESENT ghcr.io/reclaim-fixture/commerce-ops:fixture-held-by-stopped' in deploy_user_reclaim_after_second.stdout_lines"
          - "'STOPPED-HOLDER present' in deploy_user_reclaim_after_second.stdout_lines"
        fail_msg: >-
          An in-namespace image that no Compose service references but a
          STOPPED container still holds was removed. Removal SHALL NOT be
          forced -- the container runtime's own refusal is what stands
          between a defective reference set and an image still in use, so
          this is what `-f` or `docker image prune -a` looks like from the
          outside. Present/absent report:
          {{ deploy_user_reclaim_after_second.stdout_lines }}

    # ------------------------------------------------------------
    # Scenario: An image shared with another application is never a
    # candidate
    #
    # alpine:reclaim-decoy is a second tag of the same base repository the
    # deployed Compose file references. It is deliberately a `docker tag`
    # of alpine:3.19 rather than a build: that shared image ID is what
    # gives this assertion teeth, because Docker refuses removal only
    # where it would drop an image's LAST reference and untags a redundant
    # tag successfully. A namespace filter wrongly widened to `alpine:*`
    # would therefore untag the decoy without error, and this assertion
    # would catch it -- where a fixture whose image nothing else
    # referenced would have been protected by the running container
    # instead, and would have proved nothing about the filter.
    # ------------------------------------------------------------
    - name: Assert a second tag of a shared base-image repository survived the deploy
      ansible.builtin.assert:
        that:
          - "'PRESENT alpine:reclaim-decoy' in deploy_user_reclaim_after_second.stdout_lines"
        fail_msg: >-
          alpine:reclaim-decoy is gone. Reclamation SHALL NOT consider an
          image reference outside the application's own
          ghcr.io/<owner>/<app_name> namespace, so a base image shared
          with another application on the host is never a candidate for
          removal by any application's deploy. Present/absent report:
          {{ deploy_user_reclaim_after_second.stdout_lines }}

    # ------------------------------------------------------------
    # Scenario: Images published under a previous owner are reclaimed
    # ------------------------------------------------------------
    - name: Assert an image under a previous owner segment but the same application name was reclaimed
      ansible.builtin.assert:
        that:
          - "'ABSENT ghcr.io/reclaim-fixture-previous-owner/commerce-ops:fixture-legacy' in deploy_user_reclaim_after_second.stdout_lines"
        fail_msg: >-
          An image under ghcr.io/<previous owner>/commerce-ops survived a
          deploy referencing ghcr.io/<current owner>/commerce-ops. The
          namespace is matched on the application name with ANY owner
          segment, not on the owner in force at the time -- an
          owner-pinned pattern strands every image published under an
          owner the application has since left, permanently and invisibly.
          Present/absent report: {{ deploy_user_reclaim_after_second.stdout_lines }}

    # ------------------------------------------------------------
    # Scenario: A failed reclamation does not fail a successful deploy
    #
    # A real induction, not a stubbed one (tasks.md 2.6): the
    # stopped-container image above makes `docker image rm` genuinely fail
    # on this very run. A test asserting the exit status without making
    # any removal fail would pass against a reclamation step that matched
    # nothing at all.
    # ------------------------------------------------------------
    - name: Assert a deploy whose reclamation could not remove an image still exits successfully with its containers up
      ansible.builtin.assert:
        that:
          - deploy_user_reclaim_second_deploy.rc == 0
          - "'RUNNING-ON fixture-tag-b' in deploy_user_reclaim_after_second.stdout_lines"
        fail_msg: >-
          app-deploy exited {{ deploy_user_reclaim_second_deploy.rc }} on a
          deploy whose containers came up healthy and whose reclamation
          then met a removal the runtime refused. Reclamation SHALL NOT
          change the outcome of a deploy that has already succeeded: a
          failure to enumerate or remove any image SHALL leave the deploy
          reported as successful and SHALL NOT fail the invoking SSH
          session. stdout: {{ deploy_user_reclaim_second_deploy.stdout }}
          stderr: {{ deploy_user_reclaim_second_deploy.stderr }}

    # ------------------------------------------------------------
    # Scenario: A completed run reports what it did (the removed-something
    # half; the found-nothing half is asserted on the platform deploy at
    # the end of this block)
    #
    # The report is the step's ONLY per-run signal -- `|| true` swallows
    # every other one -- so it is asserted on the path it is most often
    # read on, not only on the early-exit paths.
    #
    # DERIVED, and the manifest records it as such: the delta requires a
    # completed run to "report how many images it considered and how many
    # it removed" but fixes no wording. The words matched here are
    # tasks.md 1.9's own (`considered N, removed M`). The removed count is
    # asserted at 2 -- fixture-tag-a and the previous-owner image -- while
    # `considered` is only required to be a number, because "considered"
    # admits both "candidates found" and "namespace members enumerated"
    # and the delta settles neither.
    # ------------------------------------------------------------
    - name: Assert the completed run reported how many images it considered and how many it removed
      vars:
        reclaim_second_output: >-
          {{ deploy_user_reclaim_second_deploy.stdout ~ ' ' ~ deploy_user_reclaim_second_deploy.stderr }}
        reclaim_second_report: >-
          {{ (reclaim_second_output
             | regex_search('app-deploy: reclamation considered [0-9]+, removed ([0-9]+)', '\1')
             | default([], true) | first) | default('') }}
      ansible.builtin.assert:
        that:
          - reclaim_second_report != ''
          - reclaim_second_report | int == 2
        fail_msg: >-
          A reclamation run that completed SHALL report how many images it
          considered and how many it removed, and this run removed exactly
          two (the superseded tag and the previous-owner image; the
          stopped-container image was refused). Reported removed count
          read as '{{ reclaim_second_report }}'. Deploy output was:
          {{ reclaim_second_output }}

    # Built HERE for the same reason as the previous-owner image: an
    # unheld, unreferenced in-namespace image standing before the second
    # deploy would simply have been reclaimed by it. Its whole job is to
    # be removable, so that the degraded run below is discriminating --
    # without it, every remaining namespace member is held by a container
    # and a reclamation that ignored the empty/undeterminable guard
    # entirely would still remove nothing, and the scenario would pass for
    # the wrong reason.
    #
    # NOT one of the four fixtures tasks.md 2.8 enumerates. Recorded in
    # test-plan.md as a derived addition, with that reasoning.
    - name: Reclaim fixture -- build the removable canary the degraded run must leave alone
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/reclaim_build_fixture-canary
        mkdir -p /tmp/reclaim_build_fixture-canary
        printf 'FROM alpine:3.19\nRUN echo fixture-canary > /reclaim-fixture-marker\n' \
          > /tmp/reclaim_build_fixture-canary/Dockerfile
        docker build -t ghcr.io/reclaim-fixture/commerce-ops:fixture-canary /tmp/reclaim_build_fixture-canary
      args:
        executable: /bin/bash
      environment:
        DOCKER_BUILDKIT: "0"
      changed_when: false

    # The reference set is made UNDETERMINABLE, which is the half of the
    # scenario tasks.md 2.5 asks for ("with `docker compose config
    # --images` unable to produce a set"). The other half -- a reference
    # set determined to be empty -- is not reachable through this path:
    # `docker compose up -d --wait` over a Compose file declaring no
    # services at all, or none outside an inactive profile, exits 1 with
    # "no service selected", so the deploy fails and reclamation never
    # runs. (Checked directly, 2026-09-07, against Compose v5.4.0. It also
    # falsifies molecule.yml's header claim that "an empty `services: {}`
    # Compose file keeps `docker compose pull && up -d --wait` a real,
    # fast, no-registry-needed success" -- see test-plan.md.)
    #
    # So the deploy brings up a service that corrupts the project's own
    # Compose file and only then reports healthy. `up -d --wait` returns
    # 0, having loaded the file before it was corrupted; the reclamation
    # step that follows re-reads it and cannot produce a reference set.
    # The healthcheck is what makes this deterministic rather than racy:
    # `--wait` returns only once the corruption has happened.
    #
    # This is deliberately the LAST deploy in the scenario, because it
    # leaves /opt/commerce-ops/docker-compose.yml invalid. A later
    # `molecule verify` re-run is self-healing -- deploy-receive
    # overwrites that file from the archive on the first deploy above.
    - name: Reclaim fixture -- build the deploy archive that makes the reference set undeterminable
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/reclaim_archive_degraded
        mkdir -p /tmp/reclaim_archive_degraded
        cat > /tmp/reclaim_archive_degraded/docker-compose.yml <<'COMPOSE'
        services:
          wrecker:
            image: alpine:3.19
            pull_policy: never
            volumes:
              - /opt/commerce-ops:/project
            command: ["sh", "-c", "echo 'services: [' > /project/docker-compose.yml; touch /tmp/wrecked; sleep 3600"]
            healthcheck:
              test: ["CMD-SHELL", "test -f /tmp/wrecked"]
              interval: 1s
              timeout: 2s
              retries: 30
              start_period: 1s
        COMPOSE
        printf 'FOO=bar\n' > /tmp/reclaim_archive_degraded/.env
        tar -czf /tmp/reclaim_archive_degraded.tar.gz -C /tmp/reclaim_archive_degraded docker-compose.yml .env
      args:
        executable: /bin/bash
      changed_when: false

    - name: Reclaim -- deploy commerce-ops with a Compose file that is corrupted before reclamation reads it
      ansible.builtin.shell: set -o pipefail; cat /tmp/reclaim_archive_degraded.tar.gz | /usr/local/bin/deploy-receive commerce-ops
      args:
        executable: /bin/bash
      become: true
      become_user: deploy
      register: deploy_user_reclaim_degraded_deploy
      changed_when: false
      failed_when: false

    - name: Reclaim -- report what survived the degraded run, and confirm the reference set really was undeterminable
      ansible.builtin.shell: |
        set -euo pipefail
        for ref in \
          ghcr.io/reclaim-fixture/commerce-ops:fixture-canary \
          ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-b \
          ghcr.io/reclaim-fixture/commerce-ops:fixture-held-by-stopped; do
          if [ -n "$(docker images -q "$ref")" ]; then
            echo "PRESENT $ref"
          else
            echo "ABSENT $ref"
          fi
        done
        cd /opt/commerce-ops
        if docker compose config --images >/dev/null 2>&1; then
          echo "REFERENCE-SET determinable"
        else
          echo "REFERENCE-SET undeterminable"
        fi
      args:
        executable: /bin/bash
      register: deploy_user_reclaim_after_degraded
      changed_when: false

    # ------------------------------------------------------------
    # Scenario: An unavailable or empty reference set reclaims nothing
    # ------------------------------------------------------------
    - name: Assert a run that could not determine the reference set removed no image in the namespace
      ansible.builtin.assert:
        that:
          - "'REFERENCE-SET undeterminable' in deploy_user_reclaim_after_degraded.stdout_lines"
          - "'PRESENT ghcr.io/reclaim-fixture/commerce-ops:fixture-canary' in deploy_user_reclaim_after_degraded.stdout_lines"
          - "'PRESENT ghcr.io/reclaim-fixture/commerce-ops:fixture-tag-b' in deploy_user_reclaim_after_degraded.stdout_lines"
          - "'PRESENT ghcr.io/reclaim-fixture/commerce-ops:fixture-held-by-stopped' in deploy_user_reclaim_after_degraded.stdout_lines"
        fail_msg: >-
          Where the reference set cannot be determined, reclamation SHALL
          remove nothing on that run. The canary is an in-namespace image
          that no container holds and no Compose service references, so a
          filter that degraded to "everything in the namespace is
          unreferenced" -- which is what `grep -vxF -f` over an empty
          pattern file does -- takes exactly this image and leaves the
          held ones behind. If REFERENCE-SET reads determinable instead,
          the fixture failed to induce the condition and this is a broken
          test, not a defect. Report:
          {{ deploy_user_reclaim_after_degraded.stdout_lines }}

    # ------------------------------------------------------------
    # Scenario: A run that ends early says why (the
    # empty-or-undeterminable-reference-set half; the duration-bound half
    # is deliberately uncovered, per the block header)
    #
    # DERIVED wording, as above: the delta fixes what must be
    # distinguishable, not how it is spelled. `considered` is the marker
    # of tasks.md 1.9's completed-run line and appears on no other path,
    # so its ABSENCE here is what makes this run distinguishable from a
    # completed run that found nothing to reclaim.
    # ------------------------------------------------------------
    - name: Assert the early-exit run reported its reason, distinguishably from a completed run that found nothing
      vars:
        reclaim_degraded_output: >-
          {{ deploy_user_reclaim_degraded_deploy.stdout ~ ' ' ~ deploy_user_reclaim_degraded_deploy.stderr }}
      ansible.builtin.assert:
        that:
          - deploy_user_reclaim_degraded_deploy.rc == 0
          - reclaim_degraded_output is search('reference set', ignorecase=True)
          - not (reclaim_degraded_output is search('considered', ignorecase=True))
        fail_msg: >-
          A reclamation abandoned because the reference set was empty or
          could not be determined SHALL report which of those ended it,
          distinguishably from a completed run that found nothing to
          reclaim -- and SHALL still leave the deploy successful. Since
          every failure here is otherwise swallowed, a run that reports
          nothing is indistinguishable from one working correctly. Deploy
          rc {{ deploy_user_reclaim_degraded_deploy.rc }}, output:
          {{ reclaim_degraded_output }}

    # ------------------------------------------------------------
    # Scenario: A completed run reports what it did (the found-nothing
    # half)
    #
    # Asserted against the `platform` deploy this scenario already
    # performs above, rather than a deploy of its own: `platform`
    # publishes no image of its own, so ghcr.io/<any owner>/platform is
    # permanently empty and that deploy is a free instance of the
    # completed-but-removed-nothing path (tasks.md 2.9). It is also the
    # path tasks.md 1.9 warns is the ORDINARY one for platform and the
    # easiest to lose: a `grep` over an empty namespace exits 1, which
    # under `set -euo pipefail` can abandon the group before the report
    # runs.
    # ------------------------------------------------------------
    # ------------------------------------------------------------
    # Static assertions over the INSTALLED script, in the same idiom as
    # this scenario's existing authorized_keys and sudoers content checks.
    #
    # Two delta clauses are held by review alone because they cannot be
    # induced here -- the untagged exclusion (no registry, so no repo
    # digest) and the duration bound (wedging the daemon would break the
    # `docker compose pull` the deploy needs). The no-force clause IS
    # induced behaviourally, by the stopped-container fixture above; these
    # checks are its second line, not its only one.
    #
    # Asserted against the script with COMMENT LINES STRIPPED. The script
    # explains each of these properties in prose, so a naive `search` for
    # `timeout ` matches the comment describing the bound and stays green
    # after the bound itself is deleted -- a guard that cannot fail.
    # ------------------------------------------------------------
    - name: Read the installed app-deploy script
      ansible.builtin.slurp:
        src: /usr/local/bin/app-deploy
      register: deploy_user_reclaim_installed_script

    - name: Assert the installed script keeps its untagged guard, its duration bound, and forces no removal
      vars:
        reclaim_script_code: >-
          {{ (deploy_user_reclaim_installed_script.content | b64decode).split('\n')
             | reject('match', '\s*#') | join('\n') }}
      ansible.builtin.assert:
        that:
          - reclaim_script_code is search("grep -v ':<none>\\$'")
          - reclaim_script_code is search('timeout -k [0-9]+ [0-9]+ bash')
          - not (reclaim_script_code is search('(rmi|image rm)[^\n]*(\s-f\b|--force)'))
          - not (reclaim_script_code is search('image prune'))
        fail_msg: >-
          The installed app-deploy has lost one of the properties this
          scenario cannot induce. The `grep -v ':<none>$'` guard keeps a
          digest-pinned image out of the candidate set -- asserted with its
          `grep -v` intact, since an inverted guard would still contain the
          pattern. `timeout -k N M` is what stops a wedged runtime holding
          the deploy session open, and the kill-after is part of it: SIGTERM
          alone is only as strong as the signalled process's willingness to
          return. A forced removal in any spelling (`-f`, `--force`, via
          `docker rmi`) or a `prune` would destroy the runtime's refusal,
          which is the only backstop between a defective reference set and
          an image still in use -- and refused removals are the NORMAL
          outcome here, so forcing is the likeliest well-intentioned
          regression.

    - name: Assert the platform deploy, whose namespace is empty by design, still reported its counts
      vars:
        reclaim_platform_output: >-
          {{ deploy_user_per_app_decoy_pipe.stdout ~ ' ' ~ deploy_user_per_app_decoy_pipe.stderr }}
        reclaim_platform_considered: >-
          {{ (reclaim_platform_output
             | regex_search('app-deploy: reclamation considered ([0-9]+), removed [0-9]+', '\1')
             | default([], true) | first) | default('') }}
        reclaim_platform_removed: >-
          {{ (reclaim_platform_output
             | regex_search('app-deploy: reclamation considered [0-9]+, removed ([0-9]+)', '\1')
             | default([], true) | first) | default('') }}
      ansible.builtin.assert:
        that:
          - reclaim_platform_considered != ''
          - reclaim_platform_considered | int == 0
          - reclaim_platform_removed | int == 0
        fail_msg: >-
          Reclamation SHALL report on every run, whether it removed images
          or found nothing to remove. The platform deploy's namespace is
          empty by design, so this is the completed-but-removed-nothing
          path, and it is the one most easily lost to an enumeration that
          exits non-zero before the report runs. Read considered
          '{{ reclaim_platform_considered }}' / removed
          '{{ reclaim_platform_removed }}' from deploy rc
          {{ deploy_user_per_app_decoy_pipe.rc }}, output:
          {{ reclaim_platform_output }}
