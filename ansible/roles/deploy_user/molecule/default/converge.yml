---
# Converges Docker Engine first (see molecule.yml for why this scenario
# needs it), then `deploy_user` with the `deploy_apps` interface tasks.md
# 1.1/2.1 describes: a list of {name, public_key} entries, seeded here
# with `platform` (mirroring the existing production entry, per tasks.md
# 2.1) plus `commerce-ops` as the sample new-application entry -- the same
# pairing tasks.md 2.1 itself names, so this is not an invented example.
#
# Role variable interface, confirmed against ansible/roles/deploy_user/
# tasks/main.yml and defaults/main.yml as implemented:
#   - `deploy_apps`: list of {name, public_key}, no default.
#   - `ghcr_pull_token` / `ghcr_pull_username`: no default -- the
#     credentials community.docker.docker_login uses to authenticate root's
#     Docker credential store to GHCR.
#
# GHCR_PULL_TOKEN and GHCR_PULL_USERNAME are read from the environment
# with a placeholder fallback, never committed as real credentials --
# see test-manifest.md for why the GHCR-credential-store assertion in
# verify.yml is conditioned on a real value being supplied this way.
- name: Converge
  hosts: all
  become: true
  vars:
    deploy_apps:
      - name: platform
        public_key: >-
          ssh-ed25519
          AAAAC3NzaC1lZDI1NTE5AAAAIDummyMoleculePlatformKeyOnlyNotARealCredential
          platform-molecule@ci
      - name: commerce-ops
        public_key: >-
          ssh-ed25519
          AAAAC3NzaC1lZDI1NTE5AAAAIDummyMoleculeCommerceOpsKeyOnlyNotARealCred
          commerce-ops-molecule@ci
    ghcr_pull_token: "{{ lookup('env', 'MOLECULE_GHCR_PULL_TOKEN') | default('dummy-molecule-placeholder-token-not-real', true) }}"
    ghcr_pull_username: "{{ lookup('env', 'MOLECULE_GHCR_PULL_USERNAME') | default('dummy-molecule-placeholder-user-not-real', true) }}"
  pre_tasks:
    # Simulates an already-provisioned host that still carries the
    # pre-migration platform-compose-deploy script and sudoers entry
    # (design.md's Migration Plan: present-but-unreachable until tasks.md
    # 5.6's cleanup runs) -- exercises the role's absent tasks actually
    # removing something, not just confirming a fresh host never had it.
    - name: Seed a pre-migration platform-compose-deploy script (tasks.md 5.6 fixture)
      ansible.builtin.copy:
        dest: /usr/local/bin/platform-compose-deploy
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail
          cd /opt/platform
          docker compose pull
          docker compose up -d --wait

    - name: Seed a pre-migration sudoers entry (tasks.md 5.6 fixture)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        owner: root
        group: root
        mode: "0440"
        content: |
          deploy ALL=(root) NOPASSWD: /usr/local/bin/platform-compose-deploy
        validate: "visudo -cf %s"
  roles:
    - role: docker
    - role: deploy_user
