---
# Converges Docker Engine first (see molecule.yml for why this scenario
# needs it), then `deploy_user` with the `deploy_apps` interface tasks.md
# 1.1/2.1 describes: a list of {name, public_key} entries, seeded here
# with `platform` (mirroring the existing production entry, per tasks.md
# 2.1) plus `commerce-ops` as the sample new-application entry -- the same
# pairing tasks.md 2.1 itself names, so this is not an invented example.
#
# Role variable interface, confirmed against ansible/roles/deploy_user/
# tasks/main.yml and defaults/main.yml as implemented:
#   - `deploy_apps`: list of {name, public_key}, no default.
#   - `ghcr_pull_token` / `ghcr_pull_username`: no default -- the
#     credentials community.docker.docker_login uses to authenticate root's
#     Docker credential store to GHCR.
#
# GHCR_PULL_TOKEN and GHCR_PULL_USERNAME are read from the environment and
# fall back to an EMPTY string -- never a placeholder, and never a committed
# credential. The login task is guarded on both halves being non-empty, so
# an empty fallback is what lets this scenario run with no credential at
# all; a non-empty dummy would satisfy the guard, reach ghcr.io and abort
# the converge on a 403, which is what it used to do
# (openspec/changes/repair-ansible-test-harness). Set both variables
# together to exercise the real login path -- see test-manifest.md for why
# the GHCR-credential-store assertion in verify.yml is conditioned on a real
# value being supplied this way.
- name: Converge
  hosts: all
  become: true
  vars:
    deploy_apps:
      - name: platform
        public_key: >-
          ssh-ed25519
          AAAAC3NzaC1lZDI1NTE5AAAAIDummyMoleculePlatformKeyOnlyNotARealCredential
          platform-molecule@ci
      - name: commerce-ops
        public_key: >-
          ssh-ed25519
          AAAAC3NzaC1lZDI1NTE5AAAAIDummyMoleculeCommerceOpsKeyOnlyNotARealCred
          commerce-ops-molecule@ci
    ghcr_pull_token: "{{ lookup('env', 'MOLECULE_GHCR_PULL_TOKEN') | default('', true) }}"
    ghcr_pull_username: "{{ lookup('env', 'MOLECULE_GHCR_PULL_USERNAME') | default('', true) }}"
  roles:
    - role: docker
    - role: deploy_user
