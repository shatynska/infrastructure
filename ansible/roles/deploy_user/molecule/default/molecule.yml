---
# Molecule scenario for the ADDED "Restricted Deploy Account Supports
# Per-Application Forced-Command Deploys" and "Host Authenticates to GHCR
# for Application Image Pulls" requirements
# (openspec/specs/iac-host-configuration/spec.md,
# from add-per-app-deploy-keys). Originally written as a sibling
# `per_app_deploy` scenario by the test-writing pass ahead of implementation
# (which never edits or deletes an existing test); folded into `default`
# here, at implementation
# time, as test-manifest.md's own "Obsolete tests" section anticipated --
# the old `default`'s converge/verify assumed the single-key,
# single-wrapper-script shape this change retires, so it could not
# converge against this role's new `deploy_apps` interface at all. A
# handful of the old `default`'s assertions whose normative content is not
# superseded (no raw `docker`/arbitrary-`sudo` access, no committed
# private-key material) were carried forward into verify.yml below rather
# than dropped; see that file's own comments for which.
#
# This scenario installs Docker Engine (via the sibling `docker` role,
# converged first, mirroring host-baseline.yml's own `docker` -> ... ->
# `deploy_user` ordering) -- unlike the old `default`, which stayed
# independent of it. Two things in this change's scope need a real
# `docker` CLI to be meaningfully exercised at all: `app-deploy`'s trigger
# (assert it actually runs, not just that sudo permits it) and the GHCR
# credential-store check (task 3.3). The fixture Compose files declare one
# small service on a public base image, which keeps
# `docker compose pull && up -d --wait` a real, fast success even with
# Docker actually installed. NOT an empty `services: {}` file, which this
# comment claimed until reclaim-superseded-app-images checked it: Compose
# exits 1 with `no service selected` on a file declaring no services, so
# `up -d --wait` would fail rather than succeed quickly.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  # Instance name namespaced per working tree, with a default Docker refuses,
  # and an explicit `hostname` because the driver would otherwise derive one
  # from the name and cross the 64-byte limit. See
  # ansible/roles/docker/molecule/default/molecule.yml for the full account --
  # every scenario must agree on the variable.
  - name: deploy_user-role-instance-${INFRA_WORKTREE_NS:-unset:run-via-ansible/scripts/run-molecule}
    hostname: deploy-user-role
    # Digest-pinned. See ansible/roles/docker/molecule/default/molecule.yml for
    # why a digest and not a version tag, and for how to refresh it -- every
    # scenario must carry the same one.
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:0172e3b586fc316491b5ac080e6b24c5f66cde985c27c625025f13f66a8cd21f
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../

verifier:
  name: ansible
