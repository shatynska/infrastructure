---
# Molecule scenario for the `deploy_user` role. Same convention as the
# other two roles' scenarios -- see docker/molecule/default/molecule.yml
# for the shared rationale. Run via `molecule test` from
# ansible/roles/deploy_user/.
#
# Deliberately does NOT install Docker in this instance: this role's own
# tests are scoped to account/sudoers/wrapper-script provisioning, kept
# independent of the `docker` role per design.md's "each can be
# run/tested independently" rationale. See test-manifest.md for what that
# means is out of scope here (an end-to-end `docker compose` run through
# the wrapper).
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  # systemd for a real sudo/PAM environment; nothing here needs Docker
  # itself running.
  - name: deploy_user-role-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    # See ansible/roles/docker/molecule/default/molecule.yml for why this
    # is needed -- same reasoning, applies to every role's scenario.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../

verifier:
  name: ansible
