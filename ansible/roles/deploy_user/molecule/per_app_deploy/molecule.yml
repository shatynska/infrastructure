---
# Molecule scenario for the ADDED "Restricted Deploy Account Supports
# Per-Application Forced-Command Deploys" and "Host Authenticates to GHCR
# for Application Image Pulls" requirements
# (openspec/changes/add-per-app-deploy-keys/specs/iac-host-configuration/
# spec.md). Written as a NEW scenario, sibling to the existing `default`
# scenario, rather than editing `default` in place -- this test-writing
# pass never edits or deletes an existing test. tasks.md 3.1 anticipates
# these assertions eventually replacing `default`'s content directly
# (since `default`'s converge/verify assume the now-superseded single-key,
# single-wrapper-script shape this change retires); folding the two
# together, or deleting `default` once it is confirmed superseded, is an
# implementation-time action for whoever applies this change -- see
# test-manifest.md's "Obsolete tests" section for exactly which of
# `default`'s assertions that concerns.
#
# UNLIKE `default`, this scenario installs Docker Engine (via the sibling
# `docker` role, converged first, mirroring host-baseline.yml's own
# `docker` -> ... -> `deploy_user` ordering) rather than staying
# independent of it. Two things in this change's scope need a real `docker`
# CLI to be meaningfully exercised at all: `app-deploy`'s trigger (assert
# it actually runs, not just that sudo permits it) and the GHCR
# credential-store check (task 3.3). An empty `services: {}` Compose file
# (same technique `default`'s verify.yml already uses) keeps
# `docker compose pull && up -d --wait` a real, fast, no-registry-needed
# success even with Docker actually installed.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: deploy_user-per-app-deploy-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../

verifier:
  name: ansible
