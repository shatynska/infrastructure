---
# Converges Docker Engine first (see molecule.yml for why this scenario,
# unlike `default`, needs it), then `deploy_user` with the new
# `deploy_apps` interface tasks.md 1.1/2.1 describes: a list of
# {name, public_key} entries, seeded here with `platform` (mirroring the
# existing production entry, per tasks.md 2.1) plus `commerce-ops` as the
# sample new-application entry -- the same pairing tasks.md 2.1 itself
# names, so this is not an invented example.
#
# ASSUMPTION (role variable interface -- flagged in test-manifest.md's
# "Unresolved project questions", since no implementation exists yet to
# confirm against):
#   - `deploy_apps`: list of {name, public_key}, no default -- name taken
#     directly from tasks.md 1.1/2.1, not invented by this pass.
#   - `ghcr_pull_token`: taken directly from tasks.md 2.3.
#   - `ghcr_pull_username`: invented by this pass -- nothing in the
#     change's artifacts names a companion username variable for
#     `docker login ghcr.io -u <user> --password-stdin`, but GHCR's own
#     login flow needs one alongside the token. If the implementer's
#     `docker_login`/hand-rolled task takes a different name (or derives
#     it from the token some other way), only this converge's `vars:` need
#     updating to match -- mechanical, not a rewrite of what's asserted.
#
# GHCR_PULL_TOKEN and GHCR_PULL_USERNAME are read from the environment
# with a placeholder fallback, never committed as real credentials --
# see test-manifest.md for why the GHCR-credential-store assertion in
# verify.yml is conditioned on a real value being supplied this way.
- name: Converge
  hosts: all
  become: true
  vars:
    deploy_apps:
      - name: platform
        public_key: >-
          ssh-ed25519
          AAAAC3NzaC1lZDI1NTE5AAAAIDummyMoleculePlatformKeyOnlyNotARealCredential
          platform-molecule@ci
      - name: commerce-ops
        public_key: >-
          ssh-ed25519
          AAAAC3NzaC1lZDI1NTE5AAAAIDummyMoleculeCommerceOpsKeyOnlyNotARealCred
          commerce-ops-molecule@ci
    ghcr_pull_token: "{{ lookup('env', 'MOLECULE_GHCR_PULL_TOKEN') | default('dummy-molecule-placeholder-token-not-real', true) }}"
    ghcr_pull_username: "{{ lookup('env', 'MOLECULE_GHCR_PULL_USERNAME') | default('dummy-molecule-placeholder-user-not-real', true) }}"
  roles:
    - role: docker
    - role: deploy_user
