---
# FIXTURE ONLY -- nothing here asserts anything about the requirement, and
# nothing here creates, configures or pre-empts an artifact this scenario's
# own converge.yml or verify.yml is responsible for (the same constraint
# tasks.md 3.3 places on the `prepare.yml` files this change adds).
#
# Two upstream/base-image gaps, both worked around here:
#
#   1. `geerlingguy.docker` 8.0.0's `setup-Debian.yml` installs
#      `ca-certificates` and `python3-debian` with `state: present` and no
#      `update_cache`, which fails against this base image's empty apt
#      cache with "No package matching 'python3-debian' is available".
#      8.0.0 is the latest release and upstream `master` still has it, as
#      of 2026-09-01 -- so this workaround stays needed until that changes,
#      which is a version comparison rather than an investigation.
#   2. The base image `geerlingguy/docker-ubuntu2204-ansible:latest` lacks
#      `python3-requests`, which `community.docker.docker_login` needs on
#      the target. Load-bearing for THIS scenario in particular: without it
#      the login fails on a missing Python library, and the failure this
#      scenario asserts on would be the wrong failure -- present, but
#      establishing nothing about how the role treats a rejected
#      credential. Checked against that image as of 2026-09-01.
#
# Molecule runs `prepare` once, after `create` and before `converge`.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Refresh the apt cache and install the target-side Python dependency
      ansible.builtin.apt:
        name:
          - python3-requests
        state: present
        update_cache: true
        cache_valid_time: 0
