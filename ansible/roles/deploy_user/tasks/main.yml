---
# Provisions the restricted `deploy` account per iac-host-configuration's
# "Restricted Deploy Account Supports Per-Application Forced-Command
# Deploys" and "Host Authenticates to GHCR for Application Image Pulls"
# requirements (openspec/changes/add-per-app-deploy-keys). See that
# change's design.md for why every application -- platform included --
# shares one account, isolated per application by a forced-command SSH key
# plus a named `sudoers` rule, rather than one account per application.
#
# `platform-compose-deploy` and its dedicated `/etc/sudoers.d/deploy` rule
# (the account's original, single-application shape from
# bootstrap-ansible-host-baseline) are deliberately not created by these
# tasks any more -- see design.md's Migration Plan: an already-provisioned
# host keeps them present-but-unreachable until a later, separate,
# validation-gated playbook run removes them (tasks.md 5.6), which is not
# part of this role.

# FIRST, before any task that changes the host -- the same obligation, and
# the same reasoning, as the assertion at the top of ansible/roles/hardening.
# deploy_apps has no default and no safe one (defaults/main.yml says why), and
# without this it surfaced as `'deploy_apps' is undefined` from the /opt/<name>
# loop below, after the deploy group, the account and its .ssh directory had
# already been created.
#
# Definedness, deliberately NOT `| length > 0`: an empty list means no
# application may deploy to this host, which is restrictive rather than wrong.
- name: Fail loudly if the applications allowed to deploy were not supplied
  ansible.builtin.assert:
    that:
      - deploy_apps is defined
      - deploy_apps is sequence
      - deploy_apps is not string
      - deploy_apps is not mapping
    fail_msg: >-
      deploy_apps was not supplied, or is not a list. This role has no default
      for it -- there is no safe default set of applications permitted to
      deploy to this host. Set it in ansible/inventory/group_vars/prod.yml
      (see this role's defaults/main.yml and README).

- name: Create the deploy group
  ansible.builtin.group:
    name: deploy
    state: present

- name: Create the deploy system account
  ansible.builtin.user:
    name: deploy
    group: deploy
    home: /opt/platform
    system: true
    shell: /bin/bash
    password: "!"
    create_home: true

- name: Ensure deploy's .ssh directory exists
  ansible.builtin.file:
    path: /opt/platform/.ssh
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"

- name: Ensure each application's /opt/<name> directory exists, owned deploy:deploy, mode 0750
  ansible.builtin.file:
    path: "/opt/{{ item.name }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "0750"
  loop: "{{ deploy_apps }}"
  loop_control:
    label: "{{ item.name }}"

# root:root, 0755 -- unchanged in shape from the original
# platform-compose-deploy, only now taking the application name as its one
# argument instead of having it fixed in the script body.
- name: Install the generic app-deploy script
  ansible.builtin.copy:
    dest: /usr/local/bin/app-deploy
    owner: root
    group: root
    mode: "0755"
    # `{% raw %}` because the reclamation step below uses Go template
    # syntax (`docker images --format '{{.Repository}}:{{.Tag}}'`) that
    # Jinja would otherwise try to evaluate when rendering this content.
    content: |
      {% raw %}#!/bin/bash
      set -euo pipefail
      app="$1"
      cd "/opt/$app"
      docker compose pull
      docker compose up -d --wait

      # Reclaim the images this application's previous deploys left behind.
      # See openspec/specs/iac-host-configuration/spec.md, "Superseded
      # Application Images Are Reclaimed at Deploy Time". Four decisions in
      # here look like they could be simplified and cannot:
      #
      #   * The namespace is this application's OWN repository, matched with
      #     ANY owner segment -- not everything the Compose file names. The
      #     wide form would make a shared base like postgres:16 a candidate
      #     for whichever application happens to reference it, with only a
      #     running container in the way. The owner is a wildcard so that an
      #     ownership transfer does not strand its whole pre-transfer tail
      #     permanently, since no later deploy would ever name that owner.
      #
      #   * The match requires the application's image repository to be
      #     exactly `ghcr.io/<owner>/<app name>` -- two segments after the
      #     registry, the last of them equal to the name app-deploy was
      #     invoked with. A deeper repository (ghcr.io/<owner>/<app>/api) is
      #     NOT matched. Where the names do not line up the namespace is
      #     empty and this reclaims nothing, silently. See the role README's
      #     onboarding paragraph.
      #
      #   * Removal is NEVER forced. The runtime's refusal to remove an
      #     image a container still holds is the only backstop against a
      #     wrong reference set. Note that the LIVE tag is never offered to
      #     `docker image rm` at all -- it is in the reference set and the
      #     filter drops it -- so a refusal is the exception, not the rule,
      #     and `removed` falling short of `considered` is a signal worth
      #     reading rather than routine noise. Adding -f would silence
      #     exactly the case the backstop exists for.
      #
      #   * An empty or undeterminable reference set reclaims NOTHING. This
      #     is an explicit early return, not a property of the filter:
      #     `grep -vxF -f` with an empty pattern file matches every line,
      #     so the degraded path would otherwise clear the whole namespace.
      reclaim() {
        local app="$1"
        local keep listing candidates considered=0 removed=0 ref

        # Normalised to a tagged form on both sides: the local listing always
        # emits a tag, a Compose reference without one may not.
        keep=$(docker compose config --images 2>/dev/null \
          | sed 's|^[^:]*$|&:latest|' | sort -u) || keep=""
        if [ -z "$keep" ]; then
          printf 'app-deploy: reclamation abandoned -- reference set empty or undeterminable\n'
          return 0
        fi

        # Enumerated in its own right, with its status checked, rather than as
        # the head of the filter pipeline. Folded into the pipeline its failure
        # would be swallowed by the `|| true` below and reported as
        # `considered 0, removed 0` -- byte-identical to a healthy run over an
        # empty namespace. A reclamation whose enumeration never works would
        # then be indistinguishable from one working correctly, which is the
        # exact outcome the report requirement exists to prevent.
        if ! listing=$(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null); then
          printf 'app-deploy: reclamation abandoned -- could not enumerate local images\n'
          return 0
        fi

        # `|| true`: an empty namespace makes the filter match nothing and exit
        # 1, which is the ordinary case for an application that publishes no
        # image of its own, and must still reach the report below.
        #
        # Matched field-wise rather than by a regex holding "$app": an
        # application name is operator-supplied at onboarding and may legally
        # contain a regex metacharacter (a `.` is legal in a GitHub repository
        # name), which interpolated into an ERE would widen this pattern into
        # another package's namespace -- an app named `commerce.ops` matched
        # `commerce-ops`. NF==3 also states the segment rule exactly:
        # ghcr.io/<owner>/<app>, and nothing deeper.
        candidates=$(printf '%s\n' "$listing" \
          | awk -F/ -v a="$app" 'NF==3 && $1=="ghcr.io" && index($3, a ":")==1' \
          | grep -v ':<none>$' \
          | grep -vxF -f <(printf '%s\n' "$keep") || true)

        if [ -n "$candidates" ]; then
          considered=$(printf '%s\n' "$candidates" | wc -l | tr -d ' ')
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if docker image rm "$ref" >/dev/null 2>&1; then
              removed=$((removed + 1))
            fi
          done < <(printf '%s\n' "$candidates")
        fi

        printf 'app-deploy: reclamation considered %s, removed %s\n' "$considered" "$removed"
      }
      export -f reclaim

      # The bound covers enumeration as well as removal, because
      # `docker images` is a daemon call exactly as the removals are: against
      # a runtime that stops answering it hangs, and a bound wrapped around
      # only the removals would never get the chance to engage.
      # (`docker compose config` is NOT a daemon call -- it parses the file
      # locally and returns 0 against a dead DOCKER_HOST -- so it is inside
      # the bound for tidiness rather than necessity.) 60s is generous
      # against a legitimate steady-state run, which removes one image.
      #
      # The timeout line is printed HERE, outside the bounded region, because
      # a report emitted inside it cannot survive that region being killed --
      # the one run most worth hearing about would be the silent one. It
      # carries a reason and no counts, since no count survives the kill.
      #
      # The whole step is isolated as one unit: reclamation must never change
      # the outcome of a deploy that has already succeeded.
      # `-k 10`: SIGTERM alone is only as strong as the signalled process's
      # willingness to return, so a hard SIGKILL follows ten seconds later.
      # The child gets `-u` and `pipefail` but deliberately NOT `-e`: this
      # function handles its own failures, and `-e` would turn a refused
      # removal -- the normal outcome -- into an abandoned run.
      reclaim_rc=0
      timeout -k 10 60 bash -c 'set -uo pipefail; reclaim "$0"' "$app" || reclaim_rc=$?
      if [ "$reclaim_rc" -eq 124 ]; then
        printf 'app-deploy: reclamation abandoned -- duration bound reached\n'
      elif [ "$reclaim_rc" -ne 0 ]; then
        # Every other non-zero status still owes a report: `timeout` returns
        # 125/126/127 when it cannot run the command at all, and 128+N when
        # the command dies from a signal -- 137 if the OOM killer takes the
        # bounded region, which is not far-fetched on a host under the disk
        # and memory pressure this step exists to relieve. Reporting only 124
        # would leave those exactly as silent as having no report at all.
        printf 'app-deploy: reclamation abandoned -- exited %s\n' "$reclaim_rc"
      fi
      {% endraw %}

# deploy:deploy, 0755 -- the SSH-layer forced command for every key
# (authorized_keys task below). Explicit member list, not a general
# extraction: GNU tar with named members extracts only those names,
# ignoring anything else the archive contains (design.md's "explicit,
# fixed member list" decision).
- name: Install the deploy-receive script
  ansible.builtin.copy:
    dest: /usr/local/bin/deploy-receive
    owner: deploy
    group: deploy
    mode: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      app="$1"
      tar -xzf - -C "/opt/$app" --no-same-owner -- docker-compose.yml .env
      chmod 600 "/opt/$app/.env"
      sudo /usr/local/bin/app-deploy "$app"

# One file per application, each an exact, fully-qualified line -- no
# wildcard, no argument forwarding. This is the second of the two
# independent layers (design.md's "Two independent layers still pin the
# application name") that together bound a key to its own application.
- name: Render each application's sudoers.d NOPASSWD rule for app-deploy
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/app-deploy-{{ item.name }}"
    owner: root
    group: root
    mode: "0440"
    content: |
      deploy ALL=(root) NOPASSWD: /usr/local/bin/app-deploy {{ item.name }}
    validate: "visudo -cf %s"
  loop: "{{ deploy_apps }}"
  loop_control:
    label: "{{ item.name }}"

# `restrict` (OpenSSH >= 7.2), in addition to `command=`, also disables
# port/agent/X11 forwarding and pty allocation for this key -- closing the
# gap a bare `command=` leaves open (design.md: a leaked key with only
# `command=` set could still open a forwarding channel even though it can
# never run anything but the forced invocation). `exclusive` is left at
# its default (false): each loop iteration manages only its own key,
# leaving every other application's entry untouched.
- name: Install each application's forced-command, forwarding-restricted authorized_keys entry
  ansible.posix.authorized_key:
    user: deploy
    key: "{{ item.public_key }}"
    key_options: 'restrict,command="/usr/local/bin/deploy-receive {{ item.name }}"'
  loop: "{{ deploy_apps }}"
  loop_control:
    label: "{{ item.name }}"

# Read-only (`read:packages`-scoped), shared across every application --
# not a per-application credential, since it grants no capability beyond
# reading package contents (design.md's GHCR decision).
#
# Guarded on BOTH credential halves being supplied and non-empty
# (openspec/changes/repair-ansible-test-harness). What the guard tolerates,
# and what it deliberately does not:
#
#   TOLERATED -- the credential being ABSENT. A host that pulls no private
#   image needs no GHCR credential, and host configuration is not made
#   contingent on one existing. `| default('', true)` rather than a bare
#   `| default('')` because the variable may be *undefined* (no vars file
#   loaded at all), not merely empty, and `| length` on an undefined value
#   raises instead of skipping.
#
#   NOT TOLERATED -- a credential that is supplied and REJECTED. If both
#   halves are present, this task runs and a registry refusal fails the run,
#   exactly as before. The guard must never be widened into `failed_when:
#   false` or `ignore_errors: true`: that would buy the same testability
#   while discarding the fail-fast property this task exists for.
#
# Both halves are tested, not just the token: a token supplied without a
# username would otherwise pass a token-only guard and then fail on an
# undefined variable -- an error matching none of the requirement's
# scenarios, which reads as a bug rather than as a misconfiguration.
#
# The cost of the tolerated case is real and accepted: a revoked token, or a
# misnamed/unloaded variable, no longer fails here. It surfaces later, at the
# next `docker compose pull` during a deploy. See this role's README.
- name: Authenticate root's Docker credential store to GHCR
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_pull_username }}"
    password: "{{ ghcr_pull_token }}"
  when:
    - (ghcr_pull_token | default('', true)) | length > 0
    - (ghcr_pull_username | default('', true)) | length > 0

# An absent GHCR credential is a legitimate configuration, but it must never
# be an INVISIBLE one. The likeliest real-world instance is not a deliberate
# omission -- it is a misnamed variable or a vars file that did not load, on
# a host that does need the credential. Before the guard above that aborted
# the run; now it is an ordinary `skipping:` line, indistinguishable from
# intent. So say it out loud.
- name: Report that GHCR authentication was skipped for want of a credential
  ansible.builtin.debug:
    msg: >-
      No GHCR credential supplied (ghcr_pull_token / ghcr_pull_username), so
      registry authentication was skipped. This host will fail to pull any
      PRIVATE image: `app-deploy`'s `docker compose pull` will error at
      deploy time, not here. If that is unexpected, check that the variables
      are named correctly and that their vars file is actually loaded.
  when:
    - (ghcr_pull_token | default('', true)) | length == 0
      or (ghcr_pull_username | default('', true)) | length == 0

# tasks.md 5.6: removes the fully-superseded single-application mechanism
# left present-but-unreachable since the migration (design.md's Migration
# Plan) -- deliberately not part of the tasks above, and only run once
# 5.2's live validation of the generic mechanism has already passed. Safe
# to leave as a permanent, idempotent cleanup step: a host that never had
# these (every host provisioned after this change) simply finds nothing to
# remove.
- name: Remove the fully-superseded platform-compose-deploy script
  ansible.builtin.file:
    path: /usr/local/bin/platform-compose-deploy
    state: absent

- name: Remove the fully-superseded platform-compose-deploy sudoers entry
  ansible.builtin.file:
    path: /etc/sudoers.d/deploy
    state: absent
