---
# Verifies all four scenarios under the ADDED "Restricted Deploy Account
# for Platform Stack Access" requirement
# (openspec/changes/bootstrap-ansible-host-baseline/specs/
# iac-host-configuration/spec.md). Each block below is labeled with the
# scenario it covers.
- name: Verify
  hosts: all
  become: true
  tasks:
    # ============================================================
    # Scenario: Deploy account's privileged access is a single fixed
    # action, not arbitrary command injection
    # ============================================================
    - name: Confirm the deploy account exists
      ansible.builtin.command: id deploy
      register: id_deploy
      changed_when: false

    - name: Assert deploy is not a member of the docker group (root-equivalent membership rejected on review, design.md)
      ansible.builtin.assert:
        that:
          - "'docker' not in id_deploy.stdout"
        fail_msg: "deploy is a member of the docker group -- design.md explicitly rejects this as root-equivalent"

    - name: Read the sudoers.d drop-in for deploy
      ansible.builtin.slurp:
        src: /etc/sudoers.d/deploy
      register: sudoers_drop_in

    - name: Assert the sudoers rule is exactly the fixed, argument-free, wildcard-free invocation (design.md / tasks.md 3.3)
      vars:
        sudoers_content: "{{ sudoers_drop_in.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'deploy ALL=(root) NOPASSWD: /usr/local/bin/platform-compose-deploy' in sudoers_content"
          - "'*' not in sudoers_content"
        fail_msg: >-
          /etc/sudoers.d/deploy is not an exact match on
          '/usr/local/bin/platform-compose-deploy' with no wildcard --
          either the exact line is missing or a wildcard/argument-forwarding
          form was used, both rejected on review per design.md.

    - name: Confirm the wrapper script's ownership and permissions (root:root, 0755 -- tasks.md 3.3)
      ansible.builtin.stat:
        path: /usr/local/bin/platform-compose-deploy
      register: wrapper_stat

    - name: Assert the wrapper script is root-owned, mode 0755
      ansible.builtin.assert:
        that:
          - wrapper_stat.stat.exists
          - wrapper_stat.stat.pw_name == "root"
          - wrapper_stat.stat.gr_name == "root"
          - wrapper_stat.stat.mode == "0755"
        fail_msg: "the wrapper script is not root:root mode 0755 -- if deploy could write to it, the 'fixed script' guarantee this scenario depends on would not hold"

    - name: Attempt the one permitted invocation as deploy, non-interactively (no PTY, matching how CI will invoke it -- design.md Risks)
      ansible.builtin.command: sudo -n /usr/local/bin/platform-compose-deploy
      become: true
      become_user: deploy
      register: permitted_invocation
      changed_when: false
      failed_when: false

    - name: Assert sudo itself did not reject the permitted invocation
      ansible.builtin.assert:
        that:
          - "'password is required' not in permitted_invocation.stderr"
          - "'not allowed' not in permitted_invocation.stderr"
        fail_msg: >-
          sudo denied deploy's one permitted invocation of the wrapper
          script ({{ permitted_invocation.stderr }}) -- the sudoers rule
          does not actually grant it. (This does not assert the wrapper's
          own `docker compose` commands succeed: Docker is not installed in
          this role's isolated scenario by design -- see molecule.yml.)

    - name: Attempt to append an argument to the wrapper invocation as deploy, non-interactively
      ansible.builtin.command: sudo -n /usr/local/bin/platform-compose-deploy --extra-argument
      become: true
      become_user: deploy
      register: argument_injection_attempt
      changed_when: false
      failed_when: false

    - name: Assert appending an argument to the wrapper invocation is denied
      ansible.builtin.assert:
        that:
          - argument_injection_attempt.rc != 0
          - "'password is required' in argument_injection_attempt.stderr or 'not allowed' in argument_injection_attempt.stderr"
        fail_msg: "deploy was able to invoke the wrapper with an appended argument -- the sudoers rule accepts argument injection"

    - name: Attempt sudo docker directly as deploy, non-interactively
      ansible.builtin.command: sudo -n docker ps
      become: true
      become_user: deploy
      register: docker_direct_attempt
      changed_when: false
      failed_when: false

    - name: Assert deploy cannot invoke docker directly with elevated privilege
      ansible.builtin.assert:
        that:
          - docker_direct_attempt.rc != 0
        fail_msg: "deploy was able to run `sudo docker` directly -- only the fixed wrapper script SHALL be a privileged option"

    - name: Attempt an arbitrary privileged command (sudo whoami) as deploy, non-interactively
      ansible.builtin.command: sudo -n whoami
      become: true
      become_user: deploy
      register: whoami_attempt
      changed_when: false
      failed_when: false

    - name: Assert deploy cannot run an arbitrary privileged command
      ansible.builtin.assert:
        that:
          - whoami_attempt.rc != 0
          - "'root' not in whoami_attempt.stdout"
        fail_msg: "deploy was able to run an arbitrary privileged command (sudo whoami) -- only the fixed wrapper script SHALL be a privileged option"

    - name: Attempt to overwrite the wrapper script as deploy (derived -- supports the 'fixed script' guarantee)
      ansible.builtin.copy:
        dest: /usr/local/bin/platform-compose-deploy
        content: "echo pwned\n"
      become: true
      become_user: deploy
      register: overwrite_attempt
      ignore_errors: true

    - name: Assert deploy cannot modify the wrapper script itself
      ansible.builtin.assert:
        that:
          - overwrite_attempt is failed
        fail_msg: "deploy was able to overwrite the wrapper script -- the 'one fixed action' guarantee does not hold if the action itself is mutable by this account"

    # ============================================================
    # Scenario: Deploy account can escalate via the content it is
    # entitled to write
    #
    # Per the dispatch instructions for this test-writing pass: this
    # scenario's normative content is that content-layer escalation is
    # NOT prevented and NOT this account's restriction mechanism's
    # responsibility. The assertions below therefore demonstrate the
    # actual normative content -- deploy is entitled to write here, and
    # the wrapper performs no content validation -- rather than asserting
    # escalation is blocked.
    # ============================================================
    - name: Confirm /opt/platform's ownership and permissions (deploy:deploy, 0750 -- tasks.md 3.1)
      ansible.builtin.stat:
        path: /opt/platform
      register: opt_platform_stat

    - name: Assert /opt/platform is owned deploy:deploy, mode 0750
      ansible.builtin.assert:
        that:
          - opt_platform_stat.stat.exists
          - opt_platform_stat.stat.pw_name == "deploy"
          - opt_platform_stat.stat.gr_name == "deploy"
          - opt_platform_stat.stat.mode == "0750"
        fail_msg: "/opt/platform is not owned deploy:deploy mode 0750 per tasks.md 3.1"

    - name: Deploy writes a new Compose file into the directory the wrapper operates on
      ansible.builtin.copy:
        dest: /opt/platform/docker-compose.yml
        content: "services: {}\n"
        owner: deploy
        group: deploy
        mode: "0640"
      become: true
      become_user: deploy
      register: compose_write

    - name: Assert the write succeeded -- deploy is entitled to place content the wrapper will later apply
      ansible.builtin.assert:
        that:
          - compose_write is not failed
        fail_msg: "deploy could not write a Compose file into /opt/platform -- this is the write access the requirement's own text says is how a deployment mechanism gets new content onto the host at all"

    - name: Read the wrapper script's content from the managed node
      ansible.builtin.slurp:
        src: /usr/local/bin/platform-compose-deploy
      register: wrapper_script_file

    - name: Assert the wrapper applies whatever Compose content is present, with no content validation of its own
      vars:
        wrapper_content: "{{ wrapper_script_file.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'docker compose pull' in wrapper_content"
          - "'docker compose up -d --wait' in wrapper_content"
          - "'grep' not in wrapper_content"
          - "'privileged' not in wrapper_content"
        fail_msg: >-
          The wrapper script appears to perform content inspection on the
          Compose file it applies. Per the "Deploy account can escalate via
          the content it is entitled to write" scenario, no such validation
          is required or guaranteed by this account's restriction mechanism
          -- containment of what content reaches this directory is
          explicitly out of scope for this requirement (design.md's
          accepted-risk decision), so finding validation logic here would
          contradict the scenario's own stated normative content, not
          exceed it safely.

    # ============================================================
    # Scenario: Deploy account is provisioned independently of any
    # operator
    # ============================================================
    - name: Assert the deploy account resolves with the fixed /opt/platform home, using only this converge's deploy_user_public_key
      ansible.builtin.command: getent passwd deploy
      register: deploy_passwd
      changed_when: false

    - name: Assert deploy is a real account with home /opt/platform
      ansible.builtin.assert:
        that:
          - deploy_passwd.rc == 0
          - "'/opt/platform' in deploy_passwd.stdout"
        fail_msg: >-
          The deploy account does not exist with home /opt/platform, even
          though this converge supplied no operator/personal key variable
          at all -- provisioning SHALL NOT require one.

    - name: Read deploy's authorized_keys
      ansible.builtin.slurp:
        src: /opt/platform/.ssh/authorized_keys
      register: authorized_keys_file

    - name: Assert only the test-supplied deploy key is authorized
      vars:
        authorized_keys_content: "{{ authorized_keys_file.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'test-molecule@ci' in authorized_keys_content"
        fail_msg: >-
          deploy's authorized_keys does not contain the key supplied via
          deploy_user_public_key in this scenario's converge.yml -- that
          converge deliberately supplies no operator/personal key, so the
          account's provisioning must not depend on one.

    # ============================================================
    # Scenario: Deploy private key is never committed
    #
    # Not host-state to converge against (the playbook only ever installs
    # the *public* key -- tasks.md 3.2 generates the keypair out-of-band).
    # Checked as a static scan of this role's committed files on the
    # controller, delegated to localhost.
    # ============================================================
    - name: Scan this role's committed files for embedded private-key material
      ansible.builtin.shell: |
        set -o pipefail
        grep -rl -e "BEGIN OPENSSH PRIVATE KEY" -e "BEGIN RSA PRIVATE KEY" -e "BEGIN PRIVATE KEY" "{{ playbook_dir }}/../.." || true
      args:
        executable: /bin/bash
      register: committed_private_key_scan
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Assert no private-key marker is committed anywhere under the deploy-user role
      ansible.builtin.assert:
        that:
          - committed_private_key_scan.stdout | trim == ""
        fail_msg: >-
          A private-key marker was found under the deploy-user role's
          committed files: {{ committed_private_key_scan.stdout }} -- the
          deploy keypair's private half SHALL be stored outside version
          control (Ansible Vault or a GitHub Actions Environment secret,
          per tasks.md 3.2) and SHALL NOT appear in plaintext in the
          repository.
