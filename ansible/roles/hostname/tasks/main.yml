---
# Sets the host's own name, and makes the host resolve it -- iac-host-configuration's
# ADDED "The Host's Own Name Is Set by the Converge" requirement
# (openspec/specs/iac-host-configuration/spec.md, from the change
# rename-the-stacks-and-their-resources).
#
# WHY THIS ROLE EXISTS AT ALL. Cloud-init sets a host's name once, at creation,
# from the name the provisioning layer gave the server -- and nothing re-sets
# it. So renaming a server in Terraform produces a host answering to a name no
# committed file states, and nothing fails. Before this role the production
# host answered to `main-server` and would have kept answering to it forever.
#
# THE TWO NAMES, and why they differ. This sets the host's OWN name, which
# carries the company: `shatynska-main-production`. The name the host reports
# to the tailnet is `inventory_hostname` alone -- `main-production` -- and is
# pinned by the `tailscale` role. The company's namespace is the workstation,
# which serves more than one company; the tailnet belongs to one company and
# holds every stack it owns. See docs/naming-conventions.md.
#
# WHERE THIS ROLE RUNS IN THE PLAY, which is not arbitrary: immediately AFTER
# `tailscale`. Until that role pins it, the name a host reports to the tailnet
# is derived from the name this role is about to change -- so running this
# first would tell the tailnet a name nothing intends, for as long as the rest
# of the converge takes. host-baseline.yml says so at the role list and
# `.github/tests` asserts the order.

# FIRST, AND THE POSITION IS THE ASSERTION'S POINT. `company` has no safe
# default -- a name assembled from a blank is a host named for nobody, and it
# is the name every unattended consumer then resolves. This runs before any
# task that acts on the host so that an unsupplied input is a refusal rather
# than a partial application: a host renamed and then abandoned mid-converge is
# worse than one not renamed at all.
#
# It is `is defined` AND non-blank, not merely defined: an empty string is a
# supplied value to Jinja and would yield `-main-production`, which is a name
# the kernel accepts.
- name: Fail loudly if the operating company was not supplied
  ansible.builtin.assert:
    that:
      - company is defined
      - company is string
      - company | trim | length > 0
    fail_msg: >-
      `company` was not supplied, so this host cannot be named. It has NO
      DEFAULT on purpose: the name it builds is read on a workstation that may
      serve more than one company, so a default would name every host for
      whoever wrote this role. Set it in
      ansible/inventory/group_vars/all.yml -- that file, and not an
      environment's variables file, because it is the single value a clone of
      this repository operated by a different company changes.
    quiet: true

- name: Set the host's own name
  ansible.builtin.hostname:
    name: "{{ company }}-{{ inventory_hostname }}"

# SETTING THE NAME DOES NOT MAKE THE HOST RESOLVE IT, and the two are separate
# files. `ansible.builtin.hostname` goes through `hostnamectl` and touches
# nothing else, so /etc/hosts keeps answering for the old name -- whereupon
# Ubuntu's sudo emits `unable to resolve host <name>` on every privileged task
# for the rest of the converge and on every login afterwards.
#
# IT IS A WARNING AND NOT A FAILURE, WHICH IS EXACTLY WHY IT WOULD SURVIVE.
# Nothing goes red; the converge reports success; the only person who ever sees
# it is the operator, on every single login. A name a host cannot resolve is a
# name only half set.
#
# `regexp` matches the whole 127.0.1.1 line rather than the name on it, so a
# host whose entry still carries the OLD name is rewritten rather than gaining
# a second entry. On a host that has no such line, `insertafter` places it
# after the loopback entry, which is where Debian's own installer puts it.
- name: Ensure the host resolves its own name
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ hostname_loopback_address | regex_escape }}\\s"
    line: "{{ hostname_loopback_address }}\t{{ company }}-{{ inventory_hostname }}"
    insertafter: '^127\.0\.0\.1\s'
    state: present
    owner: root
    group: root
    mode: "0644"
