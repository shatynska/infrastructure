---
# Joins the prod host to a private tailnet, per iac-host-configuration's
# ADDED "Host Joins a Private Tailnet for Non-Operator SSH Access"
# requirement (openspec/changes/connect-platform-deploy-via-tailscale).
# This exists so the GitHub Actions deploy job can reach the host without
# widening SSH access on the public internet -- see that change's
# design.md for the full rationale.

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Add the Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add the Tailscale apt repository
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"

# Pinned per this project's external-dependency convention. Confirmed
# directly against https://pkgs.tailscale.com/stable/ubuntu/resolute/...
# that this exact version is published for this host's Ubuntu codename
# (resolute) before pinning it here -- not assumed the way it briefly was
# for Docker.
- name: Ensure Tailscale is installed (pinned exact version)
  ansible.builtin.apt:
    name: "tailscale=1.102.3"
    state: present
    update_cache: true

- name: Ensure the tailscaled service is enabled and started
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

# `check_mode: false` so this runs even under `--check`. It is safe to:
# `tailscale status --json` only reads state. It is also necessary --
# Ansible skips `command` tasks in check mode, and a skipped task leaves the
# consumer below parsing a result that has no usable stdout, which used to
# abort every `--check` run of host-baseline.yml with
# "The filter plugin 'ansible.builtin.from_json' failed: Expecting value:
# line 1 column 1 (char 0)". Since tailscale runs third of five, nothing
# after it was ever evaluated (openspec/changes/repair-ansible-test-harness).
- name: Check current tailnet connection status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_check
  changed_when: false
  failed_when: false
  check_mode: false

# Idempotent: only calls `tailscale up` when not already connected, so a
# re-run doesn't attempt to re-register an already-joined node. no_log
# because the auth key would otherwise appear in the task's command
# output.
#
# The first two limbs guard the third, and their ORDER is load-bearing:
# `or` short-circuits, so an emptiness check has to be its own earlier limb.
# A filter wrapped around the `from_json` call is evaluated too late to stop
# it -- the captured failure showed `from_json` being reached and handed an
# empty string, which means the `rc` limb had already evaluated false.
#
# POLARITY: an absent, empty or unparseable status result means NOT
# CONNECTED, so `tailscale up` is attempted. It must never be read as
# "already connected" -- that would silently stop joining the tailnet on a
# host whose tailscaled is installed but not yet answering, and leave
# iac-host-configuration's "Host is reachable over the tailnet" scenario
# unsatisfied on a real run. Skipping is the dangerous direction here;
# attempting `tailscale up` on an already-connected host is harmless.
- name: Bring the host onto the tailnet
  ansible.builtin.command: "tailscale up --authkey={{ tailscale_auth_key }}"
  when: >
    (tailscale_status_check.rc | default(1)) != 0 or
    (tailscale_status_check.stdout | default('') | trim | length) == 0 or
    (tailscale_status_check.stdout | from_json).BackendState | default('') != "Running"
  changed_when: true # this task only ever runs when the host wasn't already connected, so it always represents a real state change
  no_log: true
