---
# Joins the host to a private tailnet, and pins the name it reports there.
#
# Two requirements, from two changes, and it is worth saying which is which:
#
#   "Host Joins a Private Tailnet for Non-Operator SSH Access"
#     -- the change connect-platform-deploy-via-tailscale, whose design.md
#     carries the full rationale. It exists so the GitHub Actions deploy job
#     can reach the host without widening SSH access on the public internet.
#
#   "The Host's Own Name Is Set by the Converge"
#     -- the change rename-the-stacks-and-their-resources, which added the
#     `--hostname` pin below. Before it, the name this host reported was
#     derived from the host's OWN name, which that change prefixes with the
#     operating company.
#
# Both are in openspec/specs/iac-host-configuration/spec.md.

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Add the Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add the Tailscale apt repository
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"

# Pinned per this project's external-dependency convention. Confirmed
# directly against https://pkgs.tailscale.com/stable/ubuntu/resolute/...
# that this exact version is published for this host's Ubuntu codename
# (resolute) before pinning it here -- not assumed the way it briefly was
# for Docker.
# DECLARES NO CACHE STALENESS BOUND, deliberately, where hardening's and
# image_prune's apt tasks do. Three reasons; the first survives the other two.
#
# 1. THIS ROLE ADDS THE SOURCE IT INSTALLS FROM, a few tasks above. An index
#    fetched earlier in the same converge is inside any bound AND predates that
#    source, so a bound here would skip the refresh and apt would report no
#    installation candidate -- while every other package on the host installed
#    normally. The failure names the package, not the cause, and appears only
#    on the run that adds the source, which is the run least likely to be
#    repeated.
# 2. The install is PINNED to an exact version. A stale index does not hand a
#    pinned install an older candidate; it hands it nothing.
# 3. This role carries no Molecule scenario, so nothing here would observe a
#    bound behaving either way. See docs/change-queue.md entry 3b.
#
# See the change cache-the-apt-index-within-a-converge.
- name: Ensure Tailscale is installed (pinned exact version)
  ansible.builtin.apt:
    name: "tailscale=1.102.3"
    state: present
    update_cache: true

- name: Ensure the tailscaled service is enabled and started
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

# `check_mode: false` so this runs even under `--check`. It is safe to:
# `tailscale status --json` only reads state. It is also necessary --
# Ansible skips `command` tasks in check mode, and a skipped task leaves the
# consumer below parsing a result that has no usable stdout, which used to
# abort every `--check` run of host-baseline.yml with
# "The filter plugin 'ansible.builtin.from_json' failed: Expecting value:
# line 1 column 1 (char 0)". Since tailscale runs third of five, nothing
# after it was ever evaluated (repair-ansible-test-harness).
- name: Check current tailnet connection status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_check
  changed_when: false
  failed_when: false
  check_mode: false

# Idempotent: only calls `tailscale up` when not already connected, so a
# re-run doesn't attempt to re-register an already-joined node. no_log
# because the auth key would otherwise appear in the task's command
# output.
#
# The first three limbs guard the fourth, and their ORDER is load-bearing:
# `or` short-circuits, so an emptiness check has to be its own earlier limb.
# A filter wrapped around the `from_json` call is evaluated too late to stop
# it -- the captured failure showed `from_json` being reached and handed an
# empty string, which means the `rc` limb had already evaluated false.
#
# The third limb exists because absent and empty are not the only ways to
# reach `from_json` with something it cannot parse: a non-empty, non-JSON
# stdout with rc 0 -- `tailscaled` answering with a plain-text notice, say --
# raises the identical "Expecting value: line 1 column 1" abort. Verified by
# probe. A `^{` shape test is enough to stop it and cannot itself raise.
#
# POLARITY: an absent, empty or unparseable status result means NOT
# CONNECTED, so `tailscale up` is attempted. It must never be read as
# "already connected" -- that would silently stop joining the tailnet on a
# host whose tailscaled is installed but not yet answering, and leave
# iac-host-configuration's "Host is reachable over the tailnet" scenario
# unsatisfied on a real run. Skipping is the dangerous direction here;
# attempting `tailscale up` on an already-connected host is harmless.
#
# `--hostname` PINS THE NAME THIS HOST REPORTS, and it is not decoration. With
# no pin the reported name is derived from the host's OWN name, which the
# `hostname` role sets to `{{ company }}-{{ inventory_hostname }}` -- and every
# unattended consumer resolves the server's name, not that one. Measured on the
# live production host before this was added: `tailscale debug prefs` returned
# `"Hostname": ""`, so nothing pinned it and the derivation was live.
- name: Bring the host onto the tailnet
  ansible.builtin.command: "tailscale up --authkey={{ tailscale_auth_key }} --hostname={{ inventory_hostname }}"
  when: >
    (tailscale_status_check.rc | default(1)) != 0 or
    (tailscale_status_check.stdout | default('') | trim | length) == 0 or
    not ((tailscale_status_check.stdout | default('') | trim) is match('^\{')) or
    (tailscale_status_check.stdout | from_json).BackendState | default('') != "Running"
  changed_when: true # this task only ever runs when the host wasn't already connected, so it always represents a real state change
  no_log: true

# THE SAME PIN, FOR A HOST ALREADY ON THE TAILNET. `tailscale up` above runs
# only on a host that is not connected, so without this an existing host --
# which is every host this repository has -- would keep deriving its reported
# name from its own name, and the `hostname` role is about to change that.
#
# THIS DOES NOT RENAME THE TAILNET MACHINE, and reading it as though it does is
# the mistake the change that added it made first. A machine's name is assigned
# at REGISTRATION and lives in the tailnet's own records; `--hostname` sets what
# the host REPORTS, which is a different field. Measured against tailscale
# 1.102.3 on the live tailnet: two peers report `HostName: helen` while carrying
# `DNSName: helen` and `helen-1`, so the two differ persistently; and
# `tailscale ip -4 helen-1` answers for a name no peer reports, so resolution --
# which is what `host-converge.yml` and `platform-deploy.yml` depend on --
# reaches the machine name. Renaming a machine is done in the Tailscale
# interface and is an operator step of a change, never a converge's.
#
# So this task is DEFENCE rather than mechanism: it keeps the host's own name
# from driving the machine name somewhere nobody chose. Whether Tailscale would
# carry a reported-name change into the machine name is then a question that
# does not need answering -- with the pin in place both outcomes are the name
# this repository intends.
#
# THE PIN RUNS UNCONDITIONALLY AND THE *REPORT* IS WHAT IS CONDITIONAL, which
# is the opposite of the shape `tailscale up` above uses and is deliberate.
# `tailscale set --hostname` to the value already in force is a no-op that exits
# 0, so gating the task on the name differing would buy nothing and would make
# the role's correctness depend on the same JSON read twice. `changed_when`
# instead compares against what the host reported BEFORE the task ran, so a
# converge whose only effect was to re-assert an already-correct name reports no
# change -- which is what makes a play recap readable as evidence, and the recap
# is what stands in for the Molecule scenario this role does not have.
#
# The `when:` that remains guards PARSEABILITY and nothing else: the same three
# limbs, in the same order and for the same reasons, that guard the `from_json`
# call above. A host whose tailscaled cannot be read is one this task cannot
# report on.
- name: Read the name this host currently reports to the tailnet
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs_check
  changed_when: false
  failed_when: false
  check_mode: false

#
# NO `when:`, AND ITS ABSENCE IS THE POINT. An earlier draft guarded this task
# on the prefs read having succeeded and parsed -- which, since that read
# carries `failed_when: false`, meant an unreachable tailscaled SKIPPED the pin
# silently, left the reported name deriving from the host's own, and let the
# `hostname` role immediately after change that name with nothing pinning it.
# That is precisely the window this task exists to close, and it would have
# closed it only on the runs that did not need closing.
#
# The polarity here is the opposite of `tailscale up`'s above and deliberately
# so. There, skipping is dangerous and attempting is harmless, so an
# unparseable status means NOT CONNECTED. Here, attempting is harmless --
# `tailscale set --hostname` to the value already in force is a no-op -- and
# skipping is the dangerous direction, so the task always runs and a genuinely
# broken daemon fails loudly on `tailscale set` rather than passing green.
#
# `changed_when` carries the guard instead, and its limbs are in the same
# short-circuiting order the `when:` above uses and for the same reason:
# `from_json` is reached only once emptiness and shape have been ruled out. It
# reports NO change only where the prefs read positively established the name
# was already correct, so a converge that could not read the prefs reports a
# change rather than silently claiming none.
#
# `is match('^\{')` is a SHAPE guard and not a parseability one -- it reads the
# first character, so stdout that opens with `{` and is then truncated still
# reaches `from_json` and raises. That is deliberate here where it would not
# have been under the old `when:`: failing is now the correct direction, and a
# daemon answering with half a document is one this task should not report on.
- name: Pin the name this host reports to the tailnet
  ansible.builtin.command: "tailscale set --hostname={{ inventory_hostname }}"
  changed_when: >
    not (
      (tailscale_prefs_check.rc | default(1)) == 0 and
      (tailscale_prefs_check.stdout | default('') | trim | length) > 0 and
      ((tailscale_prefs_check.stdout | default('') | trim) is match('^\{')) and
      (tailscale_prefs_check.stdout | from_json).Hostname | default('')
      == inventory_hostname
    )
