---
# Molecule scenario for the ADDED requirement "Scheduled Host Units Report
# Their Own Liveness" in openspec/specs/iac-host-configuration/spec.md --
# its scenario "An absent report address is reported by name", and through it
# the class "A Role's Absent Required Input Is Reported by Name" in the same
# capability, which design.md Decision 13 says governs this input.
#
# Derived from that delta spec ahead of any implementation, by an author who
# read no implementation of it. THESE PLAYBOOKS FAIL UNTIL THE CHANGE
# `notice-when-a-periodic-job-stops-reporting` IS IMPLEMENTED: the role has no
# `image_prune_heartbeat_ping_key` input and no assertion guarding it, so a
# converge with none supplied SUCCEEDS today -- and this scenario's converge
# records that success, which verify.yml then fails on. That is the intended
# pre-implementation state, recorded in that change's test-plan.md.
#
# WHY THIS IS A SCENARIO OF ITS OWN. A converge that must FAIL cannot share a
# scenario with one that must succeed: the run stops at the refusal and every
# later assertion in that scenario would be about a host the role never
# configured. `hardening/molecule/absent-ssh-cidrs` is the shape this follows
# and its comments carry the same reasoning.
#
# WHY THE ROLE'S OTHER REQUIRED INPUT IS SUPPLIED HERE. `deploy_apps` IS given
# a value, so that the refusal this scenario observes is the one it is about.
# With both inputs absent the role would refuse on whichever assertion comes
# first, and a role that had lost the heartbeat assertion entirely would still
# refuse -- passing this scenario while asserting nothing.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  # Distinct instance name from every sibling scenario of this role and of
  # every other role in this repository: two scenarios sharing an instance
  # name collide on `create` whenever the sibling's container is still up.
  #
  # Namespaced per working tree, with a default Docker refuses, and an explicit
  # `hostname` because the driver would otherwise derive one from the name and
  # cross the 64-byte limit. See
  # ansible/roles/docker/molecule/default/molecule.yml for the full account --
  # every scenario must agree on the variable.
  - name: image_prune-absent-heartbeat-key-instance-${INFRA_WORKTREE_NS:-unset:run-via-ansible/scripts/run-molecule}
    hostname: image-prune-absent-key
    # Digest-pinned, and the SAME digest every other scenario in this
    # repository names -- iac-cicd-pipeline requires it and
    # .github/tests/test_ci_configuration.py fails the build on a partial
    # refresh. See ansible/roles/docker/molecule/default/molecule.yml for why
    # a digest and for how to refresh it.
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:0172e3b586fc316491b5ac080e6b24c5f66cde985c27c625025f13f66a8cd21f
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../

scenario:
  # Stated explicitly rather than inherited silently, for the same reasons
  # `hardening/molecule/absent-ssh-cidrs` states them. `idempotence` is
  # meaningless here and would fail for a reason unrelated to this scenario:
  # this converge deliberately aborts the role before it configures anything,
  # so no task after the check ever runs. Role idempotence is covered by
  # `default`, which converges the role to completion. `side_effect` is
  # omitted because this scenario has no side_effect.yml. `prepare` is kept
  # although this scenario has no prepare.yml -- Molecule reports it as a
  # missing playbook and moves on, and the step is left in place so a fixture
  # added later needs no sequence edit.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
