---
# The schedule, its jitter and the run's duration bound. These are the role's
# only tunable inputs; `deploy_apps` is its one REQUIRED input and deliberately
# has no default (tasks/main.yml says why).
#
# Weekly: the high-rate source of superseded images -- one per merge per
# application -- is reclaimed at deploy time by `app-deploy`. What reaches this
# timer arrives when a platform pin changes, when an application is retired and
# when a moving tag moves, none of them daily events.
image_prune_on_calendar: "Sun *-*-* 04:00:00 UTC"

# So the run does not land on a fixed minute, for the same reason
# unattended-upgrades randomises its own.
image_prune_randomized_delay_sec: 3600

# The external observer this unit reports its own liveness to, per
# openspec/specs/iac-host-configuration/spec.md's "Scheduled Host Units Report
# Their Own Liveness". What raises the alarm is the check's SILENCE, so a unit
# that fails, one killed on the bound below, and a timer that has stopped
# firing altogether are equally visible -- the last of those leaves no failed
# unit behind and is why reporting failures alone is not enough.
#
# The base URL has a default because production has one address. It is a
# variable rather than a literal so that a Molecule scenario can point the
# reporter at a local sink: without that seam no scenario could observe what a
# failing or a killed activation reports, and pointing a scenario at the real
# observer would create a check there from a hosted runner on every pull
# request touching ansible/. Every scenario this role has sets it, and
# .github/tests asserts that over all of them.
image_prune_heartbeat_base_url: https://hc-ping.com

# DELIBERATELY NO DEFAULT, like `deploy_apps` above. A scheduled unit that runs
# unobserved is the state the requirement exists to end, so an absent key is a
# misconfiguration to refuse rather than a mode to tolerate -- unlike the GHCR
# credential, whose absence is a legitimate operating mode for a host that
# pulls no private images. Supplied Vault-encrypted from
# the targeted environment's own ansible/inventory/group_vars/<environment>.yml.
# image_prune_heartbeat_ping_key:

# Generous against a legitimate run, which enumerates a few dozen images and
# removes a handful. It exists for a container runtime that stops answering:
# enumeration is as much a daemon call as removal, so the bound covers the
# whole run. It is the unit's, not a `timeout` inside the script -- systemd
# records the expiry and marks the unit failed from outside the process, which
# is where a report about a killed region has to come from.
image_prune_timeout_start_sec: 600

# How stale a package index this role is willing to install from, in seconds.
# The same judgment hardening_apt_cache_valid_time carries, named per role
# because these roles are independently consumable and neither owns a home for
# a value shared between them.
#
# This role installs one package, so nothing here reuses an index THIS role
# fetched. What it reuses is the one fetched moments earlier by whatever ran
# before it -- in every scenario and on a real converge, the container runtime
# role. The bound is what lets it.
#
# ON A LONG-LIVED HOST THIS MAY SAVE NOTHING, and an operator should hear that
# here rather than from a converge log. The module measures staleness from
# /var/lib/apt/periodic/update-success-stamp where it exists, preferring it
# over the lists directory -- and it never writes that stamp itself; apt's own
# 15update-stamp hook does, which `apt-daily` runs. So on a stock Ubuntu host
# every bounded task may re-read the same timestamp and fetch again, exactly as
# it does today. The direction is benign -- never a staler index -- and the
# saving this bound is measured against is the one in continuous integration,
# whose containers carry no such stamp.
#
# A bound, not a disabling: an index older than this is still refreshed, and a
# host with no record of a fetch still fetches.
image_prune_apt_cache_valid_time: 3600
