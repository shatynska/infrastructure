---
# Host configuration for the prod server: container runtime, host-level
# hardening, and the restricted deploy account. See
# the change bootstrap-ansible-host-baseline for the full rationale.
# Ansible's scope stops here -- it never templates platform/'s Compose
# file or invokes a Compose lifecycle command (iac-platform-services'
# "Platform Stack Deployment Is Not Ansible's Responsibility").
- name: Host baseline configuration
  hosts: prod
  become: true
  roles:
    - role: docker
    - role: hardening
    - role: tailscale
    - role: deploy_user
    # After `docker`: the `docker` group must exist before an operator
    # account can join it (the change add-ops-account).
    - role: ops_user
    # Order-independent of every role above: a mount, not a service --
    # see ansible/roles/platform_data_volume/README.md
    # (add-platform-monitoring).
    - role: platform_data_volume
    # After `docker`: the prune script it installs calls the container runtime,
    # and the timer it arms is enabled at converge time. It reads the same
    # `deploy_apps` the deploy_user role above does -- the same inventory
    # variable, not a copy: a divergence between two such lists would offer a
    # live application's images for removal. See
    # openspec/specs/iac-host-configuration/spec.md, "Unreferenced Host Images
    # Are Pruned on a Schedule".
    - role: image_prune
    # LAST, and order-independent: `swap` depends on nothing and nothing
    # depends on it, so the position is chosen for what it does not disturb.
    # This play carries FIVE role-scope pre-flight assertions -- `hardening`,
    # `deploy_user`, `ops_user`, `platform_data_volume` and `image_prune` --
    # and no play-scope check at all, so a run missing a required input still
    # changes the host with every role ahead of the one that refuses
    # (docs/change-queue.md entry 3c). Running after all five means this role
    # never writes 4 GiB and swaps it on ahead of a refusal that was going to
    # happen anyway. An earlier placement did exactly that for `ops_user`'s and
    # `platform_data_volume`'s cases.
    - role: swap
