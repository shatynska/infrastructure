[defaults]
# NO `inventory =` HERE, DELIBERATELY. Any default would be one environment's,
# and a default that is production's makes the most consequential target the
# one a forgotten flag selects. Every run names its inventory:
#
#   ansible-playbook playbooks/host-baseline.yml \
#     -i inventory/<environment>.hcloud.yml -e target_environment=<environment>
#
# The cost is that `ansible <group> -m ...` ad-hoc commands need a `-i` too;
# docs/bootstrap-a-new-host.md §6.4 spells them out that way.
host_key_checking = True
roles_path = roles

[inventory]
enable_plugins = hetzner.hcloud.hcloud, auto

# A source that could not be parsed FAILS THE RUN rather than being warned
# about and skipped, which is Ansible's default.
#
# Without this, an inventory source whose Hetzner token is absent, empty or
# rejected resolves to nothing and the run carries on -- so the environment
# that source describes simply has no host in it. That is byte-for-byte the
# state of an environment whose server was destroyed, and the guard play in
# playbooks/host-baseline.yml would report it as "resolved to no host",
# sending an operator to Hetzner or Terraform to look for a server that is
# fine. See iac-host-configuration's "Dynamic Inventory via the hcloud Plugin, One Source per Stack",
# whose "an inventory source whose credential is absent or is rejected SHALL
# fail the run" clause is false without this line.
#
# NOT `unparsed_is_failed`, which is a different setting one word away and
# reads as a synonym. That one fires when NO source parsed at all -- which is
# exactly the state the `ansible-playbook --syntax-check` pre-commit hook runs
# in, since it supplies no inventory. Setting that one instead fails the hook
# on every commit. Verified both ways: under `unparsed_is_failed` the syntax
# check exits 1 with "No inventory was parsed"; under `any_unparsed_is_failed`
# it exits 0, and a source with a rejected token exits non-zero naming the
# source.
any_unparsed_is_failed = True
