name: PR Validation

# Required status check. This job must always run and report a
# conclusion — including on PRs that touch no Terraform files — so it
# is NOT path-filtered at the workflow level. Terraform-specific steps
# are instead conditioned on changed paths inside the job. See the
# Required Status Checks Report on Every Pull Request requirement.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # only this job posts the plan comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Terraform and platform changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            terraform:
              - 'terraform/environments/**'
              - 'terraform/modules/**'
            platform:
              - 'platform/**'

      # Validates platform/docker-compose.yml renders and parses
      # correctly. No SSH credential, no `environment:` declared anywhere
      # in this job -- see the Pull Request Validation Runs Without
      # Deploy Credentials requirement in iac-platform-deploy-pipeline.
      # .env.example supplies dummy values purely so `config` can resolve
      # variable interpolation; real values are never present here.
      - name: docker compose config (platform/)
        if: steps.changes.outputs.platform == 'true'
        run: |
          cp platform/.env.example platform/.env
          docker compose -f platform/docker-compose.yml config
          rm platform/.env

      # HCP Terraform has no OIDC path for CLI-driven backend/state auth
      # (its "dynamic credentials" feature authenticates providers during
      # a remote-executed run, not the CLI itself), and this org's free
      # tier has no team-scoped tokens to split by privilege either — see
      # design.md Decision 9. TF_API_TOKEN is a single static token,
      # identical in both the repository and production Environment
      # secrets; HCLOUD_TOKEN's split remains the real security boundary.
      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform fmt -check
        if: steps.changes.outputs.terraform == 'true'
        run: terraform fmt -check -recursive

      # validate/tflint/test discover terraform/modules/*/ and terraform/environments/* directories
      # rather than naming them, so a directory added under either one is
      # covered without a workflow edit — see
      # openspec/changes/fix-ci-module-coverage.
      - name: terraform validate
        if: steps.changes.outputs.terraform == 'true'
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/ terraform/environments/*/; do
            if compgen -G "${dir}*.tf" >/dev/null; then
              echo "::group::terraform validate ${dir}"
              (cd "$dir" && terraform init -backend=false && terraform validate)
              echo "::endgroup::"
            fi
          done

      - name: Setup tflint
        if: steps.changes.outputs.terraform == 'true'
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        if: steps.changes.outputs.terraform == 'true'
        run: |
          set -euo pipefail
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          for dir in terraform/modules/*/ terraform/environments/*/; do
            if compgen -G "${dir}*.tf" >/dev/null; then
              tflint --config="${{ github.workspace }}/.tflint.hcl" --chdir="${dir%/}"
            fi
          done

      - name: terraform test
        if: steps.changes.outputs.terraform == 'true'
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            if compgen -G "${dir}tests/*.tftest.hcl" >/dev/null; then
              echo "::group::terraform test ${dir}"
              (cd "$dir" && terraform test)
              echo "::endgroup::"
            fi
          done

      # Trivy's/tfsec's built-in misconfiguration rule packs target
      # AWS/Azure/GCP/Kubernetes/Docker, not Hetzner — see the Hetzner
      # Guardrails Are Encoded Locally requirement. This step catches
      # generic Terraform-level issues; it is deliberately not treated
      # as the Hetzner security control. Custom Hetzner-specific
      # policies, if added under the repo, are picked up automatically
      # by trivy-action's `trivy-config` custom checks directory.
      - name: Trivy misconfiguration scan
        if: steps.changes.outputs.terraform == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Install gitleaks
        if: steps.changes.outputs.terraform == 'true'
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # Invokes the gitleaks CLI binary directly, not
      # gitleaks/gitleaks-action@v2 — that action requires a paid
      # GITLEAKS_LICENSE for org-owned repos and runs on Node 20, which
      # GitHub-hosted runners drop on 2026-09-16. See design.md
      # Decision 6.
      - name: gitleaks
        if: steps.changes.outputs.terraform == 'true'
        run: ./gitleaks detect --source . --redact --exit-code 1

      - name: terraform plan
        if: steps.changes.outputs.terraform == 'true'
        id: plan
        working-directory: terraform/environments/prod
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          terraform init
          set +e
          terraform plan -no-color -input=false -out=tfplan >plan_output.txt 2>&1
          plan_exit=$?
          set -e
          {
            echo '### Terraform Plan — `terraform/environments/prod`'
            echo
            echo '```'
            cat plan_output.txt
            echo '```'
          } >comment_body.md
          cat plan_output.txt
          if [ "$plan_exit" -eq 1 ]; then
            exit 1
          fi

      - name: Find existing plan comment
        if: steps.changes.outputs.terraform == 'true' && always() && steps.plan.outcome != 'skipped'
        id: find_comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "### Terraform Plan"

      - name: Post plan as PR comment
        if: steps.changes.outputs.terraform == 'true' && always() && steps.plan.outcome != 'skipped'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: terraform/environments/prod/comment_body.md
