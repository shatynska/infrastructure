name: Pre-commit Autoupdate

# Dependabot has no `pre-commit` ecosystem, so pinned hook revisions in
# .pre-commit-config.yaml are refreshed here instead. See the
# Automated Dependency Updates requirement.
on:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  autoupdate:
    name: autoupdate
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job pushes the update branch
      pull-requests: write # only this job opens the PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: pre-commit autoupdate
        run: pre-commit autoupdate

      - name: Open PR if hook revisions changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update pre-commit hook revisions"
          title: "chore: update pre-commit hook revisions"
          body: Automated `pre-commit autoupdate` run.
          branch: chore/pre-commit-autoupdate
          delete-branch: true
