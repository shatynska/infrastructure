name: Platform Deploy

# Diff-then-gated-deploy, mirroring apply.yml's plan/apply split so the
# production Environment's approver sees the exact diff before approving
# -- see the Reviewer Sees the Exact Diff Before Approving requirement in
# iac-platform-deploy-pipeline. Not a required PR check; only the
# validation step in pr-validation.yml is that.
on:
  push:
    branches: [main]
    paths:
      - "platform/**"

# State on the host isn't locked the way Terraform state is; queue
# deploys instead of allowing two to overlap or race, same reasoning as
# apply.yml's Serialized Terraform Runs precedent (Serialized Deploys
# requirement here).
concurrency:
  group: platform-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diff:
    name: diff
    runs-on: ubuntu-latest
    # No `environment:` here -- must start immediately, with no access to
    # the deploy credential. See Reviewer Sees the Exact Diff Before
    # Approving and Deploy Credential Confined to the Gated Job.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write platform/ diff to job summary
        run: |
          {
            echo '### platform/ diff — this merge'
            echo
            echo '```diff'
            git diff "${{ github.event.before }}" "${{ github.sha }}" -- platform/
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: diff
    runs-on: ubuntu-latest
    environment: production # gates this job on required-reviewer approval
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Joins this runner to the same tailnet the host is a member of
      # (connect-platform-deploy-via-tailscale) -- SSH is only reachable
      # this way, not over the public internet, per that change's
      # design.md. The OAuth client is scoped to the `production`
      # Environment like every other secret this job uses, and ephemeral
      # per-run nodes are created automatically (tailscale/github-action's
      # own behavior), not a long-lived credential. `ping` waits for the
      # host to actually become reachable before proceeding -- new
      # tailnet peers propagate with a brief, eventually-consistent
      # delay, and the deploy steps below would otherwise race it.
      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PLATFORM_DEPLOY_HOST }}

      # Rendered fresh each run from Environment-scoped secrets -- never
      # committed, never logged. See Platform Secrets Rendered from CI at
      # Deploy Time.
      - name: Render .env from secrets
        run: |
          umask 077
          {
            echo "ACME_EMAIL=${{ secrets.PLATFORM_ACME_EMAIL }}"
            echo "POSTGRES_USER=${{ secrets.PLATFORM_POSTGRES_USER }}"
            echo "POSTGRES_PASSWORD=${{ secrets.PLATFORM_POSTGRES_PASSWORD }}"
          } >platform/.env

      # PLATFORM_DEPLOY_SSH_KEY is the private half of the platform
      # keypair add-per-app-deploy-keys's deploy_user role installs the
      # public half of (as this key's own `deploy_apps` entry) -- generated
      # out-of-band there (its tasks.md 2.2's sibling generation for
      # platform), not here. Both this key and the three secrets above
      # SHALL be scoped to the `production` Environment specifically
      # (GitHub resolves an Environment-scoped secret ahead of a
      # repository-scoped one of the same name, mirroring apply.yml's
      # HCLOUD_TOKEN pattern), since the accepted content-layer trust
      # boundary depends on this key being unreadable before this job's
      # approval gate is passed.
      - name: Set up the deploy SSH key
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PLATFORM_DEPLOY_SSH_KEY }}" >~/.ssh/platform_deploy_key
          chmod 600 ~/.ssh/platform_deploy_key
          ssh-keyscan -H "${{ secrets.PLATFORM_DEPLOY_HOST }}" >>~/.ssh/known_hosts

      # One SSH session carries both the content and the trigger: this
      # key's `authorized_keys` entry is now restricted to the forced
      # command `deploy-receive platform` (add-per-app-deploy-keys), which
      # overrides any command sent over the session -- a separate `scp`
      # plus separate `ssh` commands (the previous three-step shape) would
      # no longer work at all against that restriction. `deploy-receive`
      # itself extracts docker-compose.yml/.env into /opt/platform, sets
      # the extracted .env's permissions (satisfying
      # iac-platform-services's restrictive-permissions requirement --
      # replacing the separate "Tighten .env permissions" step this
      # workflow used to run), and triggers `sudo /usr/local/bin/app-deploy
      # platform` -- all within this one connection, so no second command
      # ever needs to reach the host over this key. `docker compose up -d
      # --wait` inside app-deploy blocks until every service is
      # running/healthy and exits non-zero otherwise, which is what fails
      # this step (and therefore this job) on a partial deploy -- no
      # separate post-deploy health check is added here.
      - name: Deliver docker-compose.yml and .env, and trigger the deploy
        run: |
          tar -czf - -C platform docker-compose.yml .env | \
            ssh -i ~/.ssh/platform_deploy_key "deploy@${{ secrets.PLATFORM_DEPLOY_HOST }}"
