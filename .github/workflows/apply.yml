name: Terraform Apply (prod)

# Runs on merge to main. Split into two jobs in one run so the
# approving reviewer sees the exact diff before approving, rather than
# approving a not-yet-computed run. See design.md Decision 8.
# Path-filtered so a merge that cannot change infrastructure does not raise a
# `production` Environment approval request. An approval prompt that appears on
# merges with nothing to approve trains the approver to grant it without
# reading, which defeats the gate. `drift.yml` still detects out-of-band
# divergence nightly.
#
# This filter is permissible ONLY because this workflow is not a required
# status check. The opposite rule governs `pr-validation.yml`, which IS one: a
# workflow-level `paths:` filter there would leave non-matching pull requests
# permanently pending and unmergeable. See the Required Status Checks Report on
# Every Pull Request requirement, and do not copy this block into it.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"

# State locking alone doesn't prevent runs applying out of order; queue
# them instead of allowing overlap or cancellation.
concurrency:
  group: terraform-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  # PR label that permits a plan containing a delete/replace action to
  # proceed. Mechanism assumed per design.md's Open Questions; not yet
  # settled as final policy.
  DESTROY_OVERRIDE_LABEL: destroy-override

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    # No `environment:` here — this job must start immediately with the
    # read-only token, not block on approval. See the Credential
    # Scoping by Privilege and Pull Request Validation Requires No
    # Manual Approval requirements (the same principle applies here).
    permissions:
      contents: read
      # The destroy-policy gate reads the merged PR's labels. A job-level
      # `permissions:` block replaces the repo's default entirely (it does
      # not layer on top of it) — omitting this made every PR-label lookup
      # silently fail with no access, which looked exactly like the
      # commit->PR data not existing yet and cost several failed apply
      # runs before the real cause was found.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # HCP Terraform has no OIDC path for CLI-driven backend/state auth,
      # and this org's free tier has no team-scoped tokens to split by
      # privilege — see design.md Decision 9. TF_API_TOKEN is a single
      # static token, identical in both the repository and production
      # Environment secrets; HCLOUD_TOKEN's split (below) is the real
      # security boundary this job's separation into two jobs protects.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: terraform plan
        id: plan
        working-directory: terraform/environments/prod
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Write plan to job summary
        working-directory: terraform/environments/prod
        run: |
          {
            echo '### Terraform Plan — `terraform/environments/prod`'
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Fails the workflow if the plan shows any resource being deleted
      # or replaced, unless the merged PR carries the override label.
      # This gate applies only to this apply-workflow plan — not to the
      # PR-time informational plan or the drift-detection plan. See the
      # Destroy Policy Gate requirement.
      - name: Destroy-policy gate
        id: destroy_gate
        working-directory: terraform/environments/prod
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # This gate fails CLOSED. It proceeds only on a positive
          # determination that the plan holds no destructive action; every
          # route to "I could not tell" ends in a failed workflow carrying a
          # message that names plan inspection as the cause, distinct from the
          # message a plan inspected and found clean produces. Treating "could
          # not inspect" as "safe" removes the gate exactly when something is
          # already wrong. Three routes have to be closed, in this order.

          # Route 1: the plan cannot be rendered. Not tolerated -- `set -e`
          # aborts the step.
          terraform show -json tfplan >plan.json

          # Route 2: the document is well-formed JSON but is not a plan -- an
          # empty object, a truncated-then-valid artifact, the wrong file.
          # `.resource_changes[]?` below suppresses the missing-key error, so
          # such a document would evaluate to a legitimate `false` and be
          # reported as inspected-and-clean. The `?` cannot be dropped:
          # `terraform show -json` genuinely omits `resource_changes` for a
          # no-op plan. Identity is asserted separately instead.
          if ! jq -e . plan.json >/dev/null 2>&1; then
            echo "::error::Destroy-policy gate: could not inspect the plan — plan.json is not valid JSON. Refusing to conclude the plan is clean."
            exit 1
          fi

          if ! jq -e 'has("format_version")' plan.json >/dev/null 2>&1; then
            echo "::error::Destroy-policy gate: could not inspect the plan — plan.json parses but carries no 'format_version', so it is not a Terraform plan. Refusing to conclude the plan is clean."
            exit 1
          fi

          # Route 3: jq itself fails. Its status is captured explicitly rather
          # than left to `set -e`: under `bash -e` (the default shell for a
          # `run:` step) a failing command substitution in an assignment aborts
          # at the assignment, so the branch below would never run and the
          # message above would never print. `-e` is deliberately NOT used
          # here -- it exits non-zero on a `false` result, which is the good
          # outcome, conflating "the answer is no" with "the inspection failed".
          if ! has_destructive=$(jq -r '[.resource_changes[]? | select(.change.actions | index("delete") != null)] | length > 0' plan.json 2>&1); then
            echo "::error::Destroy-policy gate: could not inspect the plan — jq failed: ${has_destructive}. Refusing to conclude the plan is clean."
            exit 1
          fi

          case "$has_destructive" in
            false)
              echo "has_destructive_changes=false" >>"$GITHUB_OUTPUT"
              echo "No delete/replace actions in the plan."
              exit 0
              ;;
            true)
              ;;
            *)
              echo "::error::Destroy-policy gate: could not inspect the plan — expected 'true' or 'false', got '${has_destructive}'. Refusing to conclude the plan is clean."
              exit 1
              ;;
          esac

          echo "has_destructive_changes=true" >>"$GITHUB_OUTPUT"
          echo "::warning::Plan contains a delete or replace action."

          # GitHub's commit->PR search-index API (commits/{sha}/pulls) is
          # eventually consistent, and observed in practice to lag by
          # minutes, not seconds — no retry budget reliably covers it.
          # Prefer a deterministic path instead: every merge in this repo
          # uses the standard merge-commit strategy, whose commit message
          # is "Merge pull request #N from ...". Parsing that gives the
          # PR number immediately, with no index to wait on, and
          # `pulls/{number}` is a direct object fetch, not a search.
          #
          # Only if that parse fails (e.g. a squash or rebase merge was
          # used instead, which don't produce that message) does this
          # fall back to the search API with a generous retry budget.
          pr_number=""
          commit_subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          if [[ "$commit_subject" =~ ^Merge\ pull\ request\ \#([0-9]+)\  ]]; then
            pr_number="${BASH_REMATCH[1]}"
            echo "Resolved PR #$pr_number directly from the merge commit message."
          fi

          # Errors are captured and echoed, not silently swallowed: a
          # permissions failure here must be visibly obviously different
          # from "the PR genuinely has no override label" the next time
          # something is wrong, not indistinguishable from it.
          if [ -n "$pr_number" ]; then
            if ! api_response=$(gh api "repos/${{ github.repository }}/pulls/$pr_number" 2>&1); then
              echo "::warning::gh api pulls/$pr_number failed: $api_response"
              labels=""
            else
              labels=$(echo "$api_response" | jq -r '[.labels[].name] | join(",")')
            fi
          else
            echo "Could not parse a PR number from the commit message (\"$commit_subject\") — falling back to the commit->PR search API with retries."
            pulls_json="[]"
            for attempt in $(seq 1 15); do
              if ! pulls_json=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" 2>&1); then
                echo "::warning::gh api commits/${{ github.sha }}/pulls failed: $pulls_json"
                pulls_json="[]"
              fi
              if [ "$(echo "$pulls_json" | jq 'length' 2>/dev/null || echo 0)" -gt 0 ]; then
                echo "Found the associated PR on attempt $attempt/15."
                break
              fi
              echo "No PR associated with ${{ github.sha }} yet (attempt $attempt/15) — retrying in 5s..."
              sleep 5
            done
            labels=$(echo "$pulls_json" | jq -r '[.[].labels[].name] | join(",")' 2>/dev/null || echo "")
          fi

          if echo ",$labels," | grep -q ",${DESTROY_OVERRIDE_LABEL},"; then
            echo "Override label '${DESTROY_OVERRIDE_LABEL}' found on the merged PR — proceeding."
          else
            echo "::error::Plan contains a delete or replace action, and the merged PR did not carry the '${DESTROY_OVERRIDE_LABEL}' label. Failing to prevent an unintended destructive apply."
            exit 1
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: terraform/environments/prod/tfplan
          retention-days: 1 # tfplan holds sensitive values in cleartext

  apply:
    name: apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production # gates this job on required-reviewer approval
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This job declares `environment: production`, so HCLOUD_TOKEN
      # resolves to the write-capable Environment secret. TF_API_TOKEN
      # resolves to its Environment secret too, via the same shadowing
      # mechanism, but that value is identical to the repository one —
      # this org's free HCP Terraform tier has no privilege split to
      # apply here. See design.md Decision 9.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        working-directory: terraform/environments/prod
        run: terraform init

      # Fails cleanly (rather than applying a stale or missing plan) if
      # the plan job's tfplan artifact has already expired by the time
      # approval is granted. See task 6.8.
      - name: Download plan artifact
        id: download
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: tfplan
          path: terraform/environments/prod

      - name: Fail cleanly if the plan artifact is unavailable
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::The tfplan artifact from the plan job is missing or has expired (retention: 1 day). Re-run this workflow from a fresh push to main to produce a new plan for re-review before applying."
          exit 1

      - name: terraform apply
        working-directory: terraform/environments/prod
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform apply -input=false tfplan
