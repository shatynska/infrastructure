name: Terraform Apply

# Runs on merge to main. Split into two jobs per environment in one run so the
# approving reviewer sees the exact diff before approving, rather than approving
# a not-yet-computed run. This is the workflow the Gated Production Apply
# Applies the Reviewed Plan requirement governs; that requirement now governs
# EVERY environment's apply, and its name reads narrower than its content --
# recorded in docs/deferred-work.md rather than renamed here.
#
# Path-filtered so a merge that cannot change infrastructure does not raise an
# Environment approval request. An approval prompt that appears on merges with
# nothing to approve trains the approver to grant it without reading, which
# defeats the gate. `drift.yml` still detects out-of-band divergence nightly.
#
# The filter is coarse — every environment lives under `terraform/` — and the
# `discover` job below narrows it to the environments this merge can actually
# affect. Both halves are needed: the filter decides whether the workflow runs
# at all, the resolution decides whose Environment approval is requested.
#
# This filter is permissible ONLY because this workflow is not a required
# status check. The opposite rule governs `pr-validation.yml`, which IS one: a
# workflow-level `paths:` filter there would leave non-matching pull requests
# permanently pending and unmergeable. See the Required Status Checks Report on
# Every Pull Request requirement, and do not copy this block into it.
#
# NO ENVIRONMENT IS NAMED ANYWHERE IN THIS FILE. Each environment's GitHub
# Environment, its read-only secret and whether the destroy-policy gate applies
# to it come from that environment's own `terraform/environments/<name>/pipeline.yml`.
# See the Each Environment Declares Its Own Pipeline Configuration requirement.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read

env:
  # PR label that permits a plan containing a delete/replace action to
  # proceed, where the environment's declaration says the gate applies.
  DESTROY_OVERRIDE_LABEL: destroy-override

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    # No `environment:` — this job resolves which Environments the run will ask
    # for, so it cannot itself be gated on one of them.
    permissions:
      contents: read
    outputs:
      environments: ${{ steps.affected.outputs.environments }}
    steps:
      # `fetch-depth: 0` because the step below diffs the push's own commit
      # range. On a shallow clone the base commit is absent and the diff fails
      # rather than resolving — which the resolution refuses, failing the run
      # loudly rather than applying the wrong set.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Deliberately names neither `terraform/modules` nor
      # `terraform/environments`: it lists what changed, and the step after it
      # decides what that means.
      #
      # FAILS CLOSED, and this workflow is where that matters most. It runs on
      # `push`, where `github.event.before` is all zeroes on a branch's first
      # push and unresolvable after a force-push or a history rewrite. Reading
      # an unresolvable base as "nothing changed" would apply nothing for a
      # merge that did change infrastructure, report a green run, and leave the
      # divergence to be found by the next nightly drift sweep.
      - name: List the paths this merge changes
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          empty_tree="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE_SHA" ] || [ -z "$AFTER_SHA" ] || [ "$BEFORE_SHA" = "$empty_tree" ]; then
            echo "::error::This push carries no usable comparison base (before='${BEFORE_SHA}', after='${AFTER_SHA}'), so the paths it changes cannot be listed. Refusing to read that as 'nothing changed': that applies nothing for a merge that did change infrastructure and reports green."
            exit 1
          fi
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::The comparison base ${BEFORE_SHA} does not resolve in this checkout — a force-push or a rewritten history. Refusing to read that as 'nothing changed'."
            exit 1
          fi
          if ! paths=$(git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}" 2>&1); then
            echo "::error::git diff between ${BEFORE_SHA} and ${AFTER_SHA} failed: ${paths}. Refusing to read that as 'nothing changed'."
            exit 1
          fi
          {
            echo "paths<<CHANGED_PATHS_EOF"
            printf '%s\n' "$paths"
            echo "CHANGED_PATHS_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Discover the environments and their declarations
        id: discover
        run: |
          set -euo pipefail

          # Enumerates every environment directory, reads each one's committed
          # pipeline declaration, and emits the matrix this workflow's jobs run
          # over. Nothing here names an environment: adding one is adding a
          # directory.
          #
          # FAILS CLOSED. Every route below ends in a non-zero exit carrying a
          # message that names the directory: an absent declaration, one missing
          # a field the workflows read, and two environments colliding on a
          # secret or on a GitHub Environment. A silently skipped environment is
          # one that is planned by nothing, applied by nothing and drift-checked
          # by nothing, which is indistinguishable from it not existing.
          #
          # THIS BODY IS IDENTICAL IN ALL THREE TERRAFORM WORKFLOWS, and
          # `.github/tests` asserts that it stays so. Copies are not the only
          # available shape -- a composite action under `.github/actions/` would
          # share these steps, and the reason for not using one is that it costs
          # a fourth file in a diff already restructuring three gated workflows,
          # and that `.github/tests` locates this body by step name inside a
          # workflow. Both are costs rather than blockers. What makes the copies
          # safe meanwhile is the identity assertion: the suite executes one copy
          # and that assertion is what makes running it evidence about all three.
          # Edit them together, or factor them out together.
          #
          # Free of Actions expressions on purpose -- it takes nothing from the
          # event -- so `.github/tests` can pull this body out and run it
          # against a scratch tree carrying each of those refusals. That is the
          # constraint `ansible-verify.yml`'s discovery body already observes,
          # and the reason its tests can exist at all. The prohibition includes
          # naming the interpolation syntax in a comment, which is why this
          # sentence spells it out in words.

          environments_root="terraform/environments"
          declaration_name="pipeline.yml"

          if [ ! -d "$environments_root" ]; then
            echo "::error::Environment discovery found no ${environments_root}/ directory at all. Refusing to report success having discovered nothing: an empty matrix skips every dependent job and the run reports green having done nothing."
            exit 1
          fi

          # One flat `key: value` line out of a declaration. The declaration is
          # a flat mapping by design, so this reads it with no YAML parser --
          # the same shape the gitleaks step uses to read its pin out of
          # .pre-commit-config.yaml, and what keeps this body runnable with
          # nothing but bash, jq and coreutils.
          #
          # Leading and trailing whitespace is trimmed; whitespace INSIDE a
          # value is kept, because a GitHub Environment name may legitimately
          # carry a space and silently deleting it would attach the apply job to
          # a different Environment than the one declared -- one GitHub would
          # then create on demand, with no protection rules. A value that cannot
          # be used is refused below by name, which is what the requirement asks
          # for; normalising it into a usable-looking one is not.
          field() {
            sed -n -E "s/^[[:space:]]*${2}[[:space:]]*:[[:space:]]*(.*)\$/\1/p" "$1" \
              | head -n 1 \
              | sed -E "s/[[:space:]]+#.*\$//; s/^[[:space:]]+//; s/[[:space:]]+\$//; s/^\"(.*)\"\$/\1/; s/^'(.*)'\$/\1/"
          }

          records=$(mktemp)
          refused=0

          for directory in "$environments_root"/*/; do
            [ -d "$directory" ] || continue
            name="$(basename "$directory")"
            declaration="${directory}${declaration_name}"

            if [ ! -f "$declaration" ]; then
              echo "::error::${name}: ${directory} carries no ${declaration_name}. An environment with no declaration names no GitHub Environment and no read-only secret, so nothing plans it, nothing applies it and nothing drift-checks it."
              refused=1
              continue
            fi

            github_environment="$(field "$declaration" github_environment)"
            read_only_secret="$(field "$declaration" read_only_secret)"
            destroy_policy_gate="$(field "$declaration" destroy_policy_gate)"

            incomplete=0
            if [ -z "$github_environment" ]; then
              echo "::error::${name}: ${declaration} declares no 'github_environment'. That field names the GitHub Environment this environment's apply job attaches to, and it has no safe default."
              incomplete=1
            fi
            if [ -z "$read_only_secret" ]; then
              echo "::error::${name}: ${declaration} declares no 'read_only_secret'. That field names the repository secret holding this environment's read-only Hetzner token, and it has no safe default."
              incomplete=1
            fi

            # A value that is present but unusable is refused by name rather
            # than passed on. A plan job indexes `secrets[...]` with the secret
            # name, and an index GitHub cannot resolve yields an EMPTY
            # credential rather than an error -- the plan then authenticates as
            # nobody and fails somewhere far from the cause.
            case "$read_only_secret" in
              "") ;;
              [0-9]* | *[!A-Za-z0-9_]*)
                echo "::error::${name}: ${declaration} states 'read_only_secret: ${read_only_secret}', which is not a GitHub secret name — letters, digits and underscores only, not starting with a digit. A plan job indexes secrets[...] with it, and a name that does not resolve yields an empty credential rather than an error."
                incomplete=1
                ;;
            esac

            # A control character in either value would corrupt the
            # tab-separated record this loop builds, so it is refused here
            # rather than silently splitting an environment into two.
            case "${github_environment}${read_only_secret}" in
              *[[:cntrl:]]*)
                echo "::error::${name}: ${declaration} carries a control character in 'github_environment' or 'read_only_secret'. Refusing to read a declaration this step cannot represent."
                incomplete=1
                ;;
            esac

            # The one OPTIONAL field. Absent means the gate applies, so a
            # mistake in a declaration fails safe. A value that is neither
            # absent nor a boolean is a declaration this pipeline cannot read,
            # not a default to fall back on: read wrongly, this field disables
            # the strongest guard on an apply.
            case "$destroy_policy_gate" in
              "")
                destroy_policy_gate=true
                ;;
              true | false) ;;
              *)
                echo "::error::${name}: ${declaration} states 'destroy_policy_gate: ${destroy_policy_gate}', which is neither true nor false. Refusing to guess which was meant."
                incomplete=1
                ;;
            esac

            if [ "$incomplete" -ne 0 ]; then
              refused=1
              continue
            fi

            printf '%s\t%s\t%s\t%s\n' \
              "$name" "$github_environment" "$read_only_secret" "$destroy_policy_gate" >>"$records"
          done

          if [ ! -s "$records" ] && [ "$refused" -eq 0 ]; then
            echo "::error::Environment discovery found no environment under ${environments_root}/. Refusing to report success having discovered nothing: an empty matrix skips every dependent job and the run reports green having done nothing."
            exit 1
          fi

          # Two collisions no assertion about workflow text can reach, because
          # they live in committed data rather than in a workflow. Two
          # environments sharing a read-only secret plan under one credential
          # against different Hetzner projects; two sharing a GitHub Environment
          # share its WRITE token and its protection rules, so an environment
          # meant to be ungated would hold the reviewed one's write credential.
          for secret in $(cut -f3 "$records" | sort | uniq -d); do
            colliding=$(awk -F'\t' -v value="$secret" '$3 == value { printf "%s ", $1 }' "$records")
            echo "::error::${colliding}: all declare '${secret}' as their read-only secret. A repository secret holds one value, so their plans would run under one credential and every environment but one would report a meaningless diff."
            refused=1
          done

          for shared_environment in $(cut -f2 "$records" | sort | uniq -d); do
            colliding=$(awk -F'\t' -v value="$shared_environment" '$2 == value { printf "%s ", $1 }' "$records")
            echo "::error::${colliding}: all declare the GitHub Environment '${shared_environment}'. They would share its write token and its protection rules, so an environment intended to be ungated would hold the reviewed environment's write credential."
            refused=1
          done

          if [ "$refused" -ne 0 ]; then
            echo "::error::Environment discovery refused the committed declarations, so no environment enters the matrix. Every reason is reported above, each naming the directory it belongs to."
            exit 1
          fi

          discovered=$(jq -R -s -c '
            split("\n")
            | map(select(length > 0))
            | map(split("\t"))
            | map({
                name: .[0],
                github_environment: .[1],
                read_only_secret: .[2],
                destroy_policy_gate: (.[3] == "true")
              })
          ' <"$records")
          rm -f "$records"

          echo "Discovered environments: ${discovered}"
          echo "environments=${discovered}" >>"$GITHUB_OUTPUT"
      # An environment enters this run ONLY where the merge could affect it.
      # Without this narrowing, a merge touching one environment raises every
      # other environment's approval request — an approval prompt with nothing
      # to approve, which trains the approver to grant it without reading and
      # defeats the gate it exists to enforce.
      #
      # FAILS CLOSED on an empty input, for the reason the changed-path step
      # above states: an unresolvable result and a genuine "nothing affected"
      # are indistinguishable, and reading the first as the second applies
      # nothing while reporting success.
      #
      # Free of Actions expressions, both inputs through `env:`, so
      # `.github/tests` can pull this body out and run it.
      - name: Resolve which environments this merge affects
        id: affected
        env:
          ENVIRONMENTS: ${{ steps.discover.outputs.environments }}
          CHANGED_PATHS: ${{ steps.changed.outputs.paths }}
        run: |
          set -euo pipefail

          # THIS BODY IS IDENTICAL IN BOTH WORKFLOWS THAT NARROW BY CHANGED
          # PATHS, and `.github/tests` asserts that it stays so. A pull request
          # and the merge of that same pull request must resolve the same
          # environments, or the reviewer approves one plan and the pipeline
          # applies another. What differs between the two is only where the
          # changed paths come from, which is the step before this one.
          #
          # Free of Actions expressions, both inputs through `env:`, so
          # `.github/tests` can pull this body out and run it.

          if [ -z "${ENVIRONMENTS}" ]; then
            echo "::error::Environment discovery produced no set of environments, so which of them this change affects cannot be resolved. Refusing to read that as 'no environment affected': that plans nothing, applies nothing and reports a green run."
            exit 1
          fi

          if [ -z "${CHANGED_PATHS}" ]; then
            echo "::error::The set of changed paths is empty, which means the step that resolves it did not conclude -- a change always changes at least one path. Refusing to read that as 'no environment affected'."
            exit 1
          fi

          # The mapping the requirement states: a change under
          # `terraform/modules/` affects every environment, because every
          # environment consumes those modules; a change under
          # `terraform/environments/<name>/` affects that environment alone.
          selected=""
          every=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              terraform/modules/*)
                every=1
                ;;
              terraform/environments/*/*)
                candidate="${path#terraform/environments/}"
                selected="${selected}${candidate%%/*}
          "
                ;;
            esac
          done <<CHANGED_PATHS_EOF
          ${CHANGED_PATHS}
          CHANGED_PATHS_EOF

          if [ "$every" -eq 1 ]; then
            affected="$ENVIRONMENTS"
          else
            names=$(printf '%s' "$selected" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            affected=$(printf '%s' "$ENVIRONMENTS" | jq -c --argjson names "$names" 'map(select(.name as $name | $names | index($name)))')
          fi

          count=$(printf '%s' "$affected" | jq 'length')
          if [ "$count" -gt 0 ]; then
            expected=true
          else
            expected=false
          fi

          echo "Affected environments (${count}): ${affected}"
          echo "environments=${affected}" >>"$GITHUB_OUTPUT"
          echo "plan-expected=${expected}" >>"$GITHUB_OUTPUT"
  plan:
    name: plan (${{ matrix.environment.name }})
    needs: discover
    runs-on: ubuntu-latest
    # No `environment:` here — this job must start immediately with the
    # read-only token, not block on approval. See the Credential Scoping by
    # Privilege requirement.
    #
    # It is ALSO the only job in this workflow that can see the
    # REPOSITORY-scoped `HCLOUD_TOKEN`, which the omitted-write-token guard
    # below depends on: a job declaring an `environment:` resolves every read of
    # that name to its Environment's value and can never obtain the repository
    # one to compare against.
    permissions:
      contents: read
      # The destroy-policy gate reads the merged PR's labels. A job-level
      # `permissions:` block replaces the repo's default entirely (it does
      # not layer on top of it) — omitting this made every PR-label lookup
      # silently fail with no access, which looked exactly like the
      # commit->PR data not existing yet and cost several failed apply
      # runs before the real cause was found.
      pull-requests: read
    # State locking alone doesn't prevent runs applying out of order; queue
    # them instead of allowing overlap or cancellation. PER ENVIRONMENT, and at
    # JOB level: state is per environment, so a run against one contends with
    # nothing in another, and a workflow-level declaration cannot read a matrix
    # value at all. See the Serialized Terraform Runs requirement.
    #
    # A DIFFERENT group from the apply job's, deliberately. Sharing one would
    # let this job, queued by a later merge, cancel an apply that is waiting on
    # its Environment's protection rules — GitHub cancels a previously pending
    # job in a group when a new one queues — and a cancellation is not a
    # failure, so nothing here would report an approved change that never ran.
    concurrency:
      group: terraform-plan-${{ matrix.environment.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.discover.outputs.environments) }}
    outputs:
      # Consumed by the apply job's omitted-write-token guard. Every matrix row
      # writes the same value — the digest is of the repository-scoped secret
      # and this run's id, neither of which varies by row — so the usual
      # last-writer-wins hazard of a matrix job's outputs does not arise here.
      repository-token-digest: ${{ steps.token_digest.outputs.digest }}
    steps:
      # Half of the guard against a GitHub Environment that omits `HCLOUD_TOKEN`.
      #
      # GitHub resolves an ABSENT Environment secret to the repository secret of
      # the same name rather than failing, so an Environment created without it
      # silently supplies whatever the repository holds — at more than one
      # environment, a different environment's token and therefore a different
      # Hetzner project.
      #
      # THIS JOB IS WHERE THE REPOSITORY VALUE IS VISIBLE. It declares no
      # `environment:`, so this read is the repository-scoped one by
      # construction; the apply job below cannot obtain it, because declaring an
      # `environment:` resolves every read of that name to the Environment's
      # value. The comparison therefore cannot be made inside the apply job
      # alone.
      #
      # THE OPERAND IS `HCLOUD_TOKEN` SPECIFICALLY, not whatever this
      # environment declares as its read-only secret. GitHub falls back to the
      # repository secret OF THAT NAME, and the two coincide for at most one
      # environment — digesting the declared name would compare against a value
      # the apply job could never have fallen back to, leaving the guard passing
      # in exactly the cases it exists to catch.
      #
      # Salted with this run's id, so the digest is useless outside the run that
      # produced it and nothing durable about either secret reaches the
      # workflow's output graph.
      #
      # FIRST STEP OF THIS JOB, and the position is load-bearing. This is a
      # matrix job, and a matrix job's `outputs:` are merged across rows —
      # last writer wins, and a row that never reached the step contributes
      # nothing. Placed after the plan or the destroy-policy gate, a row that
      # failed at either would leave an empty contribution able to overwrite a
      # good one from a row that passed, and every apply row would then refuse
      # at the guard's empty-digest branch — including cleanly planned
      # environments, which is the coupling the `planned` job below exists to
      # remove, returning through the output graph instead of through `needs:`.
      # Intermittently, too, since which row finishes last is a race. First,
      # this step depends on nothing but two values that do not vary by row,
      # so every row that starts writes the same digest and clobbering is
      # harmless.
      - name: Digest the repository-scoped Hetzner token
        id: token_digest
        env:
          REPOSITORY_SCOPED_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          digest=$(printf '%s' "${REPOSITORY_SCOPED_TOKEN}${RUN_ID}" | sha256sum | cut -d' ' -f1)
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"
          echo "Digested the repository-scoped Hetzner token for this run; the apply job compares its own resolved token against this value."

      - name: Checkout
        uses: actions/checkout@v7

      # HCP Terraform has no OIDC path for CLI-driven backend/state auth,
      # and this org's free tier has no team-scoped tokens to split by
      # privilege. TF_API_TOKEN is a single static token, identical in both the
      # repository and each Environment's secrets; the Hetzner token's split
      # (below) is the real security boundary this job's separation protects.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        working-directory: terraform/environments/${{ matrix.environment.name }}
        run: terraform init

      # `secrets[...]` indexed by the name this environment's own declaration
      # states. A literal name binds one compile-time-known secret, so at more
      # than one environment every plan would run under one environment's token
      # and see none of the other's resources.
      - name: terraform plan
        id: plan
        working-directory: terraform/environments/${{ matrix.environment.name }}
        env:
          HCLOUD_TOKEN: ${{ secrets[matrix.environment.read_only_secret] }}
        run: terraform plan -no-color -input=false -out=tfplan

      # The reviewer approving an Environment reads this summary and nothing
      # else, so it names the environment it belongs to.
      - name: Write plan to job summary
        working-directory: terraform/environments/${{ matrix.environment.name }}
        env:
          ENVIRONMENT_NAME: ${{ matrix.environment.name }}
        run: |
          {
            echo "### Terraform Plan — \`terraform/environments/${ENVIRONMENT_NAME}\`"
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Fails the workflow if the plan shows any resource being deleted or
      # replaced, unless the merged PR carries the override label.
      #
      # WHETHER THIS GATE APPLIES IS A PER-ENVIRONMENT POLICY, read out of the
      # environment's own declaration rather than fixed here. An environment
      # that exists to be rebuilt may declare it inapplicable; requiring a label
      # to tear down a disposable environment is friction on the operation that
      # environment exists to make cheap, and friction on a routine operation is
      # routed around rather than heeded. An environment declaring nothing is
      # gated, so a mistake in a declaration fails safe.
      #
      # This gate applies only to this apply-workflow plan — not to the PR-time
      # informational plan or the drift-detection plan. See the Destroy Policy
      # Gate requirement.
      - name: Destroy-policy gate
        id: destroy_gate
        working-directory: terraform/environments/${{ matrix.environment.name }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DESTROY_POLICY_GATE: ${{ matrix.environment.destroy_policy_gate }}
        run: |
          set -euo pipefail

          # Applicability first, and read fail-safe: only an explicit `false`
          # exempts. An absent or unreadable value is treated as though the gate
          # applies, because reading it the other way silently removes the
          # strongest guard on an apply.
          case "$DESTROY_POLICY_GATE" in
            false)
              echo "This environment's declaration states the destroy-policy gate does not apply to it, so a destructive plan proceeds to its Environment's protection rules without an override label."
              exit 0
              ;;
            true) ;;
            *)
              echo "::warning::This environment's declaration states 'destroy_policy_gate: ${DESTROY_POLICY_GATE}', which is neither true nor false. Treating the gate as applicable."
              ;;
          esac

          # This gate fails CLOSED. It proceeds only on a positive
          # determination that the plan holds no destructive action; every
          # route to "I could not tell" ends in a failed workflow carrying a
          # message that names plan inspection as the cause, distinct from the
          # message a plan inspected and found clean produces. Treating "could
          # not inspect" as "safe" removes the gate exactly when something is
          # already wrong. Three routes have to be closed, in this order.

          # Route 1: the plan cannot be rendered. Not tolerated -- `set -e`
          # aborts the step.
          terraform show -json tfplan >plan.json

          # Route 2: the document is well-formed JSON but is not a plan -- an
          # empty object, a truncated-then-valid artifact, the wrong file.
          # `.resource_changes[]?` below suppresses the missing-key error, so
          # such a document would evaluate to a legitimate `false` and be
          # reported as inspected-and-clean. The `?` cannot be dropped:
          # `terraform show -json` genuinely omits `resource_changes` for a
          # no-op plan. Identity is asserted separately instead.
          if ! jq -e . plan.json >/dev/null 2>&1; then
            echo "::error::Destroy-policy gate: could not inspect the plan — plan.json is not valid JSON. Refusing to conclude the plan is clean."
            exit 1
          fi

          if ! jq -e 'has("format_version")' plan.json >/dev/null 2>&1; then
            echo "::error::Destroy-policy gate: could not inspect the plan — plan.json parses but carries no 'format_version', so it is not a Terraform plan. Refusing to conclude the plan is clean."
            exit 1
          fi

          # Route 3: jq itself fails. Its status is captured explicitly rather
          # than left to `set -e`: under `bash -e` (the default shell for a
          # `run:` step) a failing command substitution in an assignment aborts
          # at the assignment, so the branch below would never run and the
          # message above would never print. `-e` is deliberately NOT used
          # here -- it exits non-zero on a `false` result, which is the good
          # outcome, conflating "the answer is no" with "the inspection failed".
          if ! has_destructive=$(jq -r '[.resource_changes[]? | select(.change.actions | index("delete") != null)] | length > 0' plan.json 2>&1); then
            echo "::error::Destroy-policy gate: could not inspect the plan — jq failed: ${has_destructive}. Refusing to conclude the plan is clean."
            exit 1
          fi

          case "$has_destructive" in
            false)
              echo "has_destructive_changes=false" >>"$GITHUB_OUTPUT"
              echo "No delete/replace actions in the plan."
              exit 0
              ;;
            true)
              ;;
            *)
              echo "::error::Destroy-policy gate: could not inspect the plan — expected 'true' or 'false', got '${has_destructive}'. Refusing to conclude the plan is clean."
              exit 1
              ;;
          esac

          echo "has_destructive_changes=true" >>"$GITHUB_OUTPUT"
          echo "::warning::Plan contains a delete or replace action."

          # GitHub's commit->PR search-index API (commits/{sha}/pulls) is
          # eventually consistent, and observed in practice to lag by
          # minutes, not seconds — no retry budget reliably covers it.
          # Prefer a deterministic path instead: every merge in this repo
          # uses the standard merge-commit strategy, whose commit message
          # is "Merge pull request #N from ...". Parsing that gives the
          # PR number immediately, with no index to wait on, and
          # `pulls/{number}` is a direct object fetch, not a search.
          #
          # Only if that parse fails (e.g. a squash or rebase merge was
          # used instead, which don't produce that message) does this
          # fall back to the search API with a generous retry budget.
          pr_number=""
          commit_subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          if [[ "$commit_subject" =~ ^Merge\ pull\ request\ \#([0-9]+)\  ]]; then
            pr_number="${BASH_REMATCH[1]}"
            echo "Resolved PR #$pr_number directly from the merge commit message."
          fi

          # Errors are captured and echoed, not silently swallowed: a
          # permissions failure here must be visibly obviously different
          # from "the PR genuinely has no override label" the next time
          # something is wrong, not indistinguishable from it.
          if [ -n "$pr_number" ]; then
            if ! api_response=$(gh api "repos/${{ github.repository }}/pulls/$pr_number" 2>&1); then
              echo "::warning::gh api pulls/$pr_number failed: $api_response"
              labels=""
            else
              labels=$(echo "$api_response" | jq -r '[.labels[].name] | join(",")')
            fi
          else
            echo "Could not parse a PR number from the commit message (\"$commit_subject\") — falling back to the commit->PR search API with retries."
            pulls_json="[]"
            for attempt in $(seq 1 15); do
              if ! pulls_json=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" 2>&1); then
                echo "::warning::gh api commits/${{ github.sha }}/pulls failed: $pulls_json"
                pulls_json="[]"
              fi
              if [ "$(echo "$pulls_json" | jq 'length' 2>/dev/null || echo 0)" -gt 0 ]; then
                echo "Found the associated PR on attempt $attempt/15."
                break
              fi
              echo "No PR associated with ${{ github.sha }} yet (attempt $attempt/15) — retrying in 5s..."
              sleep 5
            done
            labels=$(echo "$pulls_json" | jq -r '[.[].labels[].name] | join(",")' 2>/dev/null || echo "")
          fi

          if echo ",$labels," | grep -q ",${DESTROY_OVERRIDE_LABEL},"; then
            echo "Override label '${DESTROY_OVERRIDE_LABEL}' found on the merged PR — proceeding."
          else
            echo "::error::Plan contains a delete or replace action, and the merged PR did not carry the '${DESTROY_OVERRIDE_LABEL}' label. Failing to prevent an unintended destructive apply."
            exit 1
          fi

      # Named per environment, so one environment's plan cannot be applied to
      # another.
      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          # THE ATTEMPT IS PART OF THE NAME. Artifacts are scoped to the RUN,
          # and GitHub exposes no per-attempt listing, so the name is what
          # carries the attempt: it is how the resolution below tells this
          # attempt's saved plan from one a previous attempt left behind, and
          # it is also why re-running every job of a run does not collide with
          # a name the run already holds.
          name: tfplan-${{ matrix.environment.name }}-attempt-${{ github.run_attempt }}
          path: terraform/environments/${{ matrix.environment.name }}/tfplan
          retention-days: 1 # tfplan holds sensitive values in cleartext

  # Resolves which environments actually produced a saved plan — which is the
  # set the apply stage runs over, and NOT the set the merge affects. That
  # difference is the whole reason this job exists.
  #
  # `needs:` is scoped to a JOB, not to a matrix row. An apply matrix depending
  # on the plan matrix is therefore skipped in full the moment any single
  # environment's plan row fails: `fail-fast: false` lets the other rows run,
  # but it cannot stop their collective result being `failure`. One broken
  # environment would stop every other environment's correct change reaching
  # production. The opposite repair is worse — a condition letting the apply
  # rows start regardless would request an Environment's approval for a row with
  # no saved plan, which is the empty approval prompt this workflow's path
  # filter exists to prevent, moved to the apply stage.
  #
  # A matrix job cannot publish a per-row result: its `outputs:` are written by
  # every row into one namespace, last writer wins. So the fact is read from
  # this run's artifacts instead. The saved plan is already named per
  # environment, and the plan job publishes it as its LAST step, carrying no
  # condition — so a row that failed for any reason, its own destroy-policy gate
  # included, never reached the upload and is absent here. That ordering is what
  # makes "an artifact exists" mean "every check in that plan job passed"; the
  # Gated Production Apply Applies the Reviewed Plan requirement obliges it
  # rather than leaving it to the order of a file.
  planned:
    name: planned
    needs: [discover, plan]
    # Runs whatever the plan matrix concluded — that is the point of it — but
    # not on a run whose own discovery refused, and not on a cancelled one.
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    # No `environment:`. This job decides which Environments the run will ask
    # for, so it cannot itself be gated on one of them.
    permissions:
      # The one scope it needs and nothing else: reading this run's artifact
      # NAMES. It never downloads them — a saved plan holds sensitive values in
      # cleartext, and a job that needs to know only which plans exist has no
      # business holding their contents. See Least-Privilege Workflow
      # Permissions.
      actions: read
    outputs:
      environments: ${{ steps.planned.outputs.environments }}
    steps:
      - name: Resolve which environments produced a saved plan
        id: planned
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATES: ${{ needs.discover.outputs.environments }}
        run: |
          set -euo pipefail

          # Free of Actions expressions, every input through `env:`, like every
          # other fail-closed body in these workflows -- so `.github/tests` can
          # pull it out and run it across the inputs it must tell apart.

          if [ -z "${CANDIDATES}" ] || [ -z "${REPOSITORY}" ] || [ -z "${RUN_ID}" ] || [ -z "${RUN_ATTEMPT}" ]; then
            echo "::error::The planned-environment resolution has no candidate set, repository or run id to work from, which means a step it depends on did not conclude. Refusing to read that as 'no environment was planned': that applies nothing for a merge that did change infrastructure and reports a green run."
            exit 1
          fi

          # A read that REFUSED is not an empty result. An expired credential or
          # an API returning 502 is indistinguishable from "no plan was saved"
          # unless it is refused here; read as the second it applies nothing and
          # reports green, leaving the divergence to the nightly drift sweep.
          # THE LISTING IS RUN-SCOPED, AND THE ATTEMPT IS CARRIED IN THE NAME.
          # Artifacts belong to a run rather than to an attempt, and there is no
          # `runs/<id>/attempts/<n>/artifacts` endpoint -- that path 404s, which
          # is how this was found rather than assumed. So the plan job uploads
          # under a name carrying the attempt, and this step reconstructs that
          # name below.
          #
          # It matters on a re-run: attempt 1 plans an environment cleanly and
          # uploads its saved plan; the operator re-runs; in attempt 2 that
          # environment's destroy-policy gate refuses -- a delete appeared, or
          # the override label was removed -- so it uploads nothing. Attempt 1's
          # artifact is still in the run's listing, and matched on a name
          # carrying no attempt it would put that environment into the planned
          # set, raise its approval, and apply a plan this attempt's gate
          # refused. The requirement's "only where every check its plan job
          # performs has passed" would then hold within an attempt and fail
          # across them.
          #
          # `per_page` rather than `--paginate`, deliberately: on an endpoint
          # returning an OBJECT, `--paginate` emits one JSON document per page
          # and the result is a stream rather than a document -- which the
          # identity check below would then read as malformed, or worse, read as
          # its first page alone. One page is asserted to be the whole listing
          # instead, a few lines down.
          if ! listing=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" 2>&1); then
            echo "::error::Could not read this run's artifacts, so which environments produced a saved plan cannot be determined: ${listing}. Refusing to conclude that none did."
            exit 1
          fi

          # A read that SUCCEEDED and returned something which is not a listing
          # is the same failure wearing a different face: a proxy's HTML error
          # page parses as nothing, and a tolerant filter would evaluate it to
          # an empty set and report it as read-and-empty. Identity is asserted
          # separately, exactly as the destroy-policy gate asserts
          # `format_version` on a plan.
          if ! printf '%s' "$listing" | jq -e 'has("artifacts")' >/dev/null 2>&1; then
            echo "::error::This run's artifact listing carries no 'artifacts' key, so it is not a listing. Refusing to conclude that no environment produced a saved plan."
            exit 1
          fi

          if ! published=$(printf '%s' "$listing" | jq -c '[.artifacts[].name]' 2>&1); then
            echo "::error::Could not read the artifact names out of this run's listing: ${published}. Refusing to conclude that no environment produced a saved plan."
            exit 1
          fi

          # A TRUNCATED listing is the third face of the same failure, and the
          # only one of the three that is silent: a page holding fewer artifacts
          # than the run has drops environments from the planned set, and a
          # dropped environment is a reviewed change that never reaches its
          # cloud with nothing said about it. Refused rather than paginated,
          # because a run uploading one saved plan per environment cannot
          # plausibly fill a page -- so reaching this branch means something is
          # wrong rather than large.
          # `total_count` is REQUIRED rather than defaulted. Defaulting it to the
          # number of artifacts returned makes this comparison compare a value
          # with itself, so the guard silently becomes a no-op on the one shape
          # it exists to catch -- which is the same "could not tell, therefore
          # fine" the destroy-policy gate refuses one requirement over.
          if ! total=$(printf '%s' "$listing" | jq -e '.total_count | numbers' 2>&1); then
            echo "::error::This run's artifact listing carries no numeric 'total_count', so whether it is complete cannot be established: ${total}. Refusing to resolve the planned environments from a listing that may be partial."
            exit 1
          fi
          if ! returned=$(printf '%s' "$published" | jq 'length' 2>&1); then
            echo "::error::Could not count the artifact names read from this run's listing: ${returned}. Refusing to resolve the planned environments."
            exit 1
          fi
          if [ "$returned" -ne "$total" ]; then
            echo "::error::This run's artifact listing reports ${total} artifacts and returned ${returned}, so it is truncated. Refusing to resolve the planned environments from a partial listing: an environment missing from it is a reviewed change that would never be applied."
            exit 1
          fi

          # `tfplan-<environment>-attempt-<n>` is the name the plan job uploads
          # under. The literal parts are spelled out here because this body may
          # carry no Actions expression, while the upload builds the name from a
          # template -- so the two are stated in two places and could drift. A drift makes this
          # match nothing, resolve the empty set on every run, skip every apply
          # and report the workflow GREEN, since an explicitly empty planned set
          # is accepted by design. That is the most consequential silent failure
          # in this file, so what guards it is named exactly rather than waved
          # at: in `test_planned_environment_apply_stage`, `_artifact_template`
          # reads the template out of the upload step and `_render` builds the
          # fixture listing from it, so the tests that EXECUTE this body --
          # `test_every_environment_that_produced_a_plan_is_in_the_resolved_set`
          # and `test_an_environment_whose_plan_failed_is_absent_and_the_others_remain`
          # -- go red on a rename of either side. The prefix appears in no
          # assertion as a literal, which is why grepping the suite for it finds
          # nothing while the guard is real all the same.
          if ! planned=$(printf '%s' "$CANDIDATES" \
            | jq -c --argjson published "$published" --arg attempt "$RUN_ATTEMPT" \
              'map(select(("tfplan-" + .name + "-attempt-" + $attempt) as $artifact | $published | index($artifact) != null))' 2>&1); then
            echo "::error::Could not match this run's saved plans against the discovered environments: ${planned}. Refusing to conclude which environments produced a plan."
            exit 1
          fi

          if ! count=$(printf '%s' "$planned" | jq 'length' 2>&1); then
            echo "::error::Could not count the resolved planned environments: ${count}. Refusing to conclude which environments produced a plan."
            exit 1
          fi

          # An EXPLICITLY empty set is accepted, and that is a different
          # judgement from the refusals above rather than an inconsistency with
          # them. A merge matching this workflow's path filter while affecting
          # no environment reaches this stage with nothing to apply, and so does
          # one whose every plan failed — where the run is already red for that
          # reason. Failing here would turn a benign merge into a red apply
          # workflow.
          echo "Environments that produced a saved plan (${count}): ${planned}"
          echo "environments=${planned}" >>"$GITHUB_OUTPUT"

  apply:
    name: apply (${{ matrix.environment.name }})
    # `plan` stays in `needs:` alongside `planned`, and it is not decorative:
    # the omitted-write-token guard below reads `needs.plan.outputs`, which
    # leaves scope the moment that edge is dropped. The guard would then compare
    # against an empty string and pass — in exactly the configuration it exists
    # to catch. `.github/tests` asserts both the edge and that what it reads is
    # an output the plan job actually publishes.
    needs: [discover, plan, planned]
    # THE CONDITION IS WHAT BREAKS THE COUPLING. A `needs:` edge implies
    # `success()` over every dependency, so without this the job is skipped
    # whenever the plan stage's aggregate result is `failure` — the defect this
    # shape exists to remove, and one every other part of the mechanism would
    # appear to have fixed. `!cancelled()` suppresses that implicit `success()`;
    # requiring `planned` to have succeeded is what stops the apply stage
    # starting on a resolution that refused. No apply condition reads the plan
    # stage's own result, which is where the coupling would return.
    if: ${{ !cancelled() && needs.planned.result == 'success' }}
    runs-on: ubuntu-latest
    # Every apply job declares an `environment:`, taken from the environment's
    # own declaration. Whether that PAUSES for a human is a property of that
    # GitHub Environment's protection rules — repository settings, which no file
    # here can verify — and not of this workflow. An environment whose
    # Environment requires no reviewer is still gated in the sense that matters
    # here: its write credential is confined to this job.
    environment: ${{ matrix.environment.github_environment }}
    permissions:
      contents: read
    # A DIFFERENT group from the plan job's, per environment. See the comment on
    # that job: sharing one would let a later merge's queued plan cancel an
    # apply awaiting its reviewer, silently.
    concurrency:
      group: terraform-apply-${{ matrix.environment.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.planned.outputs.environments) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This job declares an `environment:`, so HCLOUD_TOKEN resolves to that
      # Environment's write-capable secret. TF_API_TOKEN resolves to its
      # Environment secret too, via the same shadowing mechanism, but that value
      # is identical to the repository one — this org's free HCP Terraform tier
      # has no privilege split to apply here.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # The other half of the omitted-write-token guard. Recomputes the plan
      # job's digest over its OWN resolved `HCLOUD_TOKEN` and refuses where the
      # two match — which is precisely what a GitHub Environment that does not
      # define `HCLOUD_TOKEN` produces.
      #
      # Live rather than dormant at one environment: on every apply the plan job
      # holds the read-only token and this job holds the read-write one, so the
      # digests differ and the check passes for the right reason. Were the
      # Environment's secret ever removed, it would fire.
      - name: Establish that this Environment supplied its own write token
        env:
          EXPECTED_REPOSITORY_DIGEST: ${{ needs.plan.outputs.repository-token-digest }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${EXPECTED_REPOSITORY_DIGEST}" ]; then
            echo "::error::The plan job published no digest of the repository-scoped Hetzner token, so whether this Environment supplied its own write token cannot be established. Refusing to apply."
            exit 1
          fi

          resolved=$(printf '%s' "${HCLOUD_TOKEN}${RUN_ID}" | sha256sum | cut -d' ' -f1)

          if [ "${resolved}" = "${EXPECTED_REPOSITORY_DIGEST}" ]; then
            echo "::error::This job resolved the REPOSITORY-scoped HCLOUD_TOKEN rather than its own Environment's, which is what GitHub supplies when an Environment does not define that secret. Applying would authenticate against whichever Hetzner project the repository token belongs to. Add HCLOUD_TOKEN to this GitHub Environment."
            exit 1
          fi

          echo "This Environment supplied its own HCLOUD_TOKEN; it is not the repository-scoped value."

      - name: terraform init
        working-directory: terraform/environments/${{ matrix.environment.name }}
        run: terraform init

      # Fails cleanly (rather than applying a stale or missing plan) if
      # the plan job's tfplan artifact has already expired by the time
      # approval is granted.
      - name: Download plan artifact
        id: download
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: tfplan-${{ matrix.environment.name }}-attempt-${{ github.run_attempt }}
          path: terraform/environments/${{ matrix.environment.name }}

      - name: Fail cleanly if the plan artifact is unavailable
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::The tfplan artifact from the plan job is missing or has expired (retention: 1 day). Re-run this workflow from a fresh push to main to produce a new plan for re-review before applying."
          exit 1

      - name: terraform apply
        working-directory: terraform/environments/${{ matrix.environment.name }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform apply -input=false tfplan
