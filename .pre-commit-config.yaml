repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_validate

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        files: ^ansible/
        # Upstream's hook hardcodes `language_version: python3.14`. This
        # project targets 3.12 -- ansible/requirements-test.txt pins its whole
        # toolchain "verified together, in this combination, on Python 3.12" --
        # so the hook is pinned to the same interpreter rather than pulling a
        # second one in. Without this the hook passes only on a machine that
        # happens to have 3.14 installed and fails everywhere else, which is
        # exactly the local-vs-CI divergence the gitleaks pin below exists to
        # prevent.
        language_version: python3.12
        # pass_filenames is false upstream (ansible-lint's own recommendation),
        # so without an explicit target it scans the whole repo, not just
        # `ansible/` — flagging unrelated files like .github/workflows/*.yml.
        args: ["ansible/"]

  - repo: local
    hooks:
      - id: ansible-playbook-syntax-check
        name: ansible-playbook --syntax-check
        language: system
        # Runs with cwd = ansible/ (not the repo root pre-commit hooks
        # otherwise use) so ansible.cfg -- and its roles_path, which
        # resolves this project's own roles/ directory -- is actually
        # found. Without this, every role reference fails to resolve:
        # Ansible only looks for ansible.cfg in the current directory,
        # it does not search upward.
        entry: bash -c 'set -euo pipefail; cd ansible && for f in playbooks/*.yml; do [ -e "$f" ] && ansible-playbook --syntax-check "$f"; done'
        pass_filenames: false
        files: ^ansible/playbooks/.*\.ya?ml$

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"
